<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>호박공주와 두리안 왕자</title>
<style>
  @font-face { font-family: 'Jua'; src: url('fonts/Jua-Regular.ttf') format('truetype'); font-display: block; }
  @font-face { font-family: 'Noto Sans KR'; src: url('fonts/NotoSansKR.ttf') format('truetype'); font-weight: 100 900; font-display: block; }
  html, body { margin: 0; background: #111; }
  body { display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 12px; font-family: 'Noto Sans KR', sans-serif; color: #ddd; }
  canvas { width: min(100%, 1280px); aspect-ratio: 16 / 9; display: block; background: #000; }
  .bar { display: flex; gap: 12px; align-items: center; width: min(100%, 1280px); }
  .bar input { flex: 1; }
  body.render { padding: 0; gap: 0; }
  body.render canvas { width: 1920px; height: 1080px; }
  body.render .bar { display: none; }
</style>
</head>
<body>
<script src="timeline.js"></script>
<script src="content.js"></script>
<script src="schema.js"></script>
<canvas id="c" width="1920" height="1080"></canvas>
<div class="bar">
  <button id="play">▶ 재생</button>
  <input id="seek" type="range" min="0" max="200" step="0.01" value="0">
  <span id="time">0.00s</span>
</div>
<script>
// ------------------------------------------------------------
// 호박공주와 두리안 왕자 — 파티 → 수박공주가 인기 → 줄무늬를 그림 → 비에 지워져 놀림 → 두리안 왕자 "그대로 아름다워요" → 결혼
// 대사 시각은 timeline.js (tools/make_audio.py 가 대사 음성 길이로 만듦). 입 모양은 대사 소리 크기(env)를 따라감
// draw(t) 는 시간 t(초)만으로 화면을 그리는 순수 함수 → 프레임 단위 렌더 가능

const W = 1920, H = 1080, TL = window.TL, DURATION = TL.duration;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const DEFAULT_CONTENT = JSON.parse(JSON.stringify(window.CONTENT));
let C = window.CONTENT, K = C.colors;
const JUA = "'Jua', 'Noto Sans KR', sans-serif";
function rgba(hex, a) { const n = parseInt(hex.slice(1), 16); return `rgba(${n >> 16 & 255},${n >> 8 & 255},${n & 255},${a})`; }

// ---------- 기본 도구 ----------
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;

const eOut = x => 1 - Math.pow(1 - x, 3), eIn = x => x * x * x, eIO = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;

const L = id => TL.lines[id] || { start: 0, end: 0, env: [] };
const S = id => TL.scenes.find(s => s.id === id) || { start: 0, end: 0 };
const st = (id, d = 0) => L(id).start + d, en = (id, d = 0) => L(id).end + d;
// 키프레임: [[시각, 값], ...] 사이를 부드럽게
function kf(t, keys) {

  for (let i = 1; i < keys.length; i++) if (t < keys[i][0]) { const [t0, v0] = keys[i - 1], [t1, v1] = keys[i]; return lerp(v0, v1, eIO((t - t0) / Math.max(.001, t1 - t0))); }
  return keys[keys.length - 1][1];

// 키프레임 사이를 움직이는 중인가 (걷기 동작용)
function moving(t, keys) { for (let i = 1; i < keys.length; i++) if (t > keys[i - 1][0] && t < keys[i][0] && Math.abs(keys[i][1] - keys[i - 1][1]) > 2) return true; return false; }
// 유아용 애니메이션 느낌: 부분마다 제 색보다 진한 가는 테두리
let INK = 0, BG_INK = 0;
function shade(c, k = .62) { if (typeof c !== 'string' || c[0] !== '#') return 'rgba(70,45,45,.45)'; const n = parseInt(c.slice(1), 16), f = v => Math.round(v * k); return `rgb(${f(n >> 16 & 255)},${f(n >> 8 & 255)},${f(n & 255)})`; }

function bg(c) { ctx.fillStyle = c; ctx.fillRect(-600, -600, W + 1200, H + 1200); }
function rect(x, y, w, h, c, a = 1) { if (a <= 0) return; ctx.save(); ctx.globalAlpha *= a; ctx.fillStyle = c; ctx.fillRect(x, y, w, h); ctx.restore(); }
function rr(x, y, w, h, r, c, a = 1, stroke = null, lw = 4) { if (a <= 0) return; if (BG_INK && c && !stroke && c[0] === '#') { stroke = shade(c, .72); lw = BG_INK; } ctx.save(); ctx.globalAlpha *= a; ctx.beginPath(); ctx.roundRect(x, y, w, h, r); if (c) { ctx.fillStyle = c; ctx.fill(); } if (stroke) { ctx.lineWidth = lw; ctx.strokeStyle = stroke; ctx.stroke(); } ctx.restore(); }

function text(str, x, y, { size = 40, color = '#fff', family = JUA, weight = 400, align = 'center', alpha = 1, stroke = null, lw = 0 } = {}) {

}
function star(x, y, r, c, rot = 0, a = 1, g = ctx) { if (r <= 0 || a <= 0) return; g.save(); g.globalAlpha *= a; g.translate(x, y); g.rotate(rot); g.fillStyle = c; g.beginPath(); for (let i = 0; i < 10; i++) { const rr2 = i % 2 ? r * .45 : r, an = i / 10 * Math.PI * 2 - Math.PI / 2; g.lineTo(Math.cos(an) * rr2, Math.sin(an) * rr2); } g.closePath(); g.fill(); g.restore(); }

function sparkles(t, x, y, k, rad = 220, n = 22) { if (k <= 0) return; const r = rng(17); for (let i = 0; i < n; i++) { const a = r() * Math.PI * 2 + t * (1 + r()), d = rad * (.3 + r() * .7); star(x + Math.cos(a) * d, y + Math.sin(a) * d * .8, 6 + r() * 12, i % 3 ? '#FFF3B0' : '#FFB3E6', t * 3 + i, k * (.5 + .5 * Math.sin(t * 8 + i))); } }
function hearts(t, x, y, k, spread = 300, seed = 3) { if (k <= 0) return; const r = rng(seed); for (let i = 0; i < 10; i++) { const q = (t * .4 + r()) % 1; heart(x + (r() - .5) * spread, y - q * 380, 16 + r() * 14, i % 2 ? '#FF6B8A' : '#FF9FB5', k * (1 - q)); } }
function thought(x, y, k, draw) { if (k <= 0) return; ctx.save(); ctx.globalAlpha *= k; circ(x - 150, y + 160, 14, '#fff'); circ(x - 110, y + 118, 22, '#fff'); ctx.beginPath(); ctx.ellipse(x, y, 170 * eBack(k), 140 * eBack(k), 0, 0, Math.PI * 2); ctx.fillStyle = '#fff'; ctx.fill(); draw(); ctx.restore(); }

// ---------- 입 모양: 그 사람이 지금 말하는 대사의 소리 크기 ----------
function talking(t, who) {
  for (const id of TL.order) { const l = TL.lines[id]; if (l.who !== who) continue;
    if (t >= l.start && t < l.end) return l.env[Math.floor((t - l.start) * 30)] || 0; }
  return 0;
}
function speaking(t, who, pad = .1) { return TL.order.some(id => { const l = TL.lines[id]; return l.who === who && t >= l.start - .05 && t < l.end + pad; }); }
function blink(t, seed) { const per = 3.1 + (seed % 5) * .37, ph = (t + seed * .77) % per; return ph < .12 ? 1 - Math.abs(ph - .06) / .06 : 0; }

// ============================================================
// 캐릭터: 과일 몸통에 얼굴, 가는 팔다리, 왕관. 오프스크린에 그려 붙임 (부분마다 진한 색 테두리, 바닥 그림자)
// o: { x, y(발 위치), s, face(1 오른쪽/-1 왼쪽), tilt, bob, armL, armR(0 아래 ~ π 위로, 바깥쪽으로 듦), walk(걸음 위상), mouth(0~1), blink, mood, pose('sit'), hold, t, stripes(0~1 칠함), wash(0~1 지워짐), veil, dress }
// ============================================================
const OC = {}; function oc(key) { if (!OC[key]) { const c = document.createElement('canvas'); c.width = 900; c.height = 1040; OC[key] = c; } return OC[key]; }
const CS = 1.0;
const SK = '#FFD9C2', CHEEK = '#FF8E8E', LINE = '#3A2E2A', GLOVE = '#FFFFFF';
// 몸통 크기 (가운데 높이, 가로 반지름, 세로 반지름, 다리 길이)
const BODY = { pumpkin: [-200, 150, 125, 70], melon: [-205, 140, 132, 70], apple: [-190, 122, 112, 74], grape: [-205, 120, 128, 70], banana: [-210, 72, 150, 56], berry: [-190, 112, 120, 66], durian: [-215, 150, 135, 76] };
function drawChar(kind, o) {
  const c = oc(kind + (o.slot || '')), g = c.getContext('2d');
  g.setTransform(1, 0, 0, 1, 0, 0); g.clearRect(0, 0, c.width, c.height);
  g.translate(450, 990); g.scale(o.face || 1, 1); g.rotate(o.tilt || 0);
  const sq = o.squash || 0; g.scale(1 + sq * .5, 1 - sq);
  INK = o.noOutline ? 0 : 6;
  fruitBody(g, kind, o);
  INK = 0;
  const s = (o.s || 1) * CS, dx = o.x - 450 * s, dy = o.y - 990 * s;
  ctx.save(); ctx.globalAlpha *= (o.alpha == null ? 1 : o.alpha);
  if (o.shadow !== false && !o.noOutline) { const [cy, rx] = BODY[kind], gy = o.ground || o.y; ctx.save(); ctx.globalAlpha *= .17; ctx.fillStyle = '#3A2350'; ctx.beginPath(); ctx.ellipse(o.x, gy + 4 * s, (rx + 10) * s * .8, (rx + 10) * s * .16, 0, 0, Math.PI * 2); ctx.fill(); ctx.restore(); }
  ctx.drawImage(c, dx, dy, c.width * s, c.height * s);
  ctx.restore();
}
// 팔·다리 한 줄 (ang: 0 = 아래, +는 바깥쪽 위로). side: -1 왼쪽 / 1 오른쪽
function limb(g, x, y, len, ang, w, col, side, end, endR, endCol) {
  g.save(); g.translate(x, y); g.rotate(-ang * side); g.lineCap = 'round';
  if (INK) { g.strokeStyle = shade(col); g.lineWidth = w + INK * 2; g.beginPath(); g.moveTo(0, 0); g.lineTo(0, len); g.stroke(); }
  g.strokeStyle = col; g.lineWidth = w; g.beginPath(); g.moveTo(0, 0); g.lineTo(0, len); g.stroke();
  if (end === 'hand') ell(g, 0, len + endR * .3, endR, endR, endCol || GLOVE);
  if (end === 'shoe') ell(g, side * endR * .35, len + endR * .2, endR * 1.25, endR * .72, endCol);
  g.restore();
}
function handPos(x, y, len, ang, side, extra = 10) { return [x + Math.sin(ang * side) * (len + extra), y + Math.cos(ang * side) * (len + extra)]; }
function bodyPath(g, kind, cy, rx, ry) {
  g.beginPath();
  if (kind === 'banana') { g.moveTo(-rx * .6, cy + ry); g.quadraticCurveTo(-rx * 1.5, cy, -rx * .35, cy - ry); g.lineTo(rx * .2, cy - ry - 10); g.quadraticCurveTo(-rx * .2, cy, rx * .95, cy + ry * .95); g.quadraticCurveTo(rx * .2, cy + ry * 1.12, -rx * .6, cy + ry); g.closePath(); }
  else if (kind === 'berry') { g.moveTo(0, cy + ry); g.bezierCurveTo(-rx * 1.45, cy + ry * .4, -rx * 1.25, cy - ry * 1.05, 0, cy - ry * .9); g.bezierCurveTo(rx * 1.25, cy - ry * 1.05, rx * 1.45, cy + ry * .4, 0, cy + ry); g.closePath(); }

}
function fruitBody(g, kind, o) {
  const [cy0, rx, ry, legLen] = BODY[kind], t = o.t || 0, bob = o.bob || 0, w = o.walk || 0, sit = o.pose === 'sit';
  const cy = cy0 + bob + (sit ? legLen + 6 : 0);
  const col = { pumpkin: K.pumpkin, melon: K.melon, apple: K.apple, grape: K.grape, banana: K.banana, berry: K.berry, durian: K.durian }[kind];
  const lc = '#' + [0, 1, 2].map(i => Math.round(parseInt(col.slice(1 + i * 2, 3 + i * 2), 16) * .55).toString(16).padStart(2, '0')).join('');
  const shoe = { pumpkin: '#E8607A', melon: '#E8607A', apple: '#3F5AA8', grape: '#3F5AA8', banana: '#8B5A2B', berry: '#6FB24B', durian: '#7A4A2B' }[kind];
  const prince = kind === 'apple' || kind === 'grape' || kind === 'durian', princess = kind === 'pumpkin' || kind === 'melon';
  // 망토 (뒤)
  if (prince) { const capeCol = { apple: '#3F7FD6', grape: '#4FB07A', durian: '#C23B4E' }[kind]; g.fillStyle = capeCol; g.beginPath(); g.moveTo(-rx * .55, cy - ry * .55); g.quadraticCurveTo(-rx * 1.2 - Math.sin(t * 3) * 6, cy + ry * .5, -rx * 1.05, cy + ry + legLen * .7 - bob); g.lineTo(rx * 1.05, cy + ry + legLen * .7 - bob); g.quadraticCurveTo(rx * 1.2 + Math.sin(t * 3) * 6, cy + ry * .5, rx * .55, cy - ry * .55); g.closePath(); g.fill(); inkPath(g, capeCol); }
  if (o.veil) veil(g, -30, cy - ry - 10, rx, ry, t);   // 면사포 (몸 뒤)
  // 공주 치마 (몸통 아래 프릴)
  if (princess && !sit) { const sc = o.veil ? '#FFFFFF' : '#FF9FC3'; g.fillStyle = sc; g.beginPath(); g.moveTo(-rx * .75, cy + ry * .55); for (let i = 0; i <= 8; i++) { const xx = -rx * .95 + i * rx * 1.9 / 8; g.quadraticCurveTo(xx - rx * .12, cy + ry * 1.18, xx, cy + ry * 1.05); } g.lineTo(rx * .75, cy + ry * .55); g.closePath(); g.fill(); inkPath(g, sc); }

  limb(g, -ax, ay, armLen, (o.armL == null ? .35 : o.armL) - (o.walk ? Math.sin(w) * .3 : 0), 15, lc, -1, 'hand', 15);
  limb(g, ax, ay, armLen, (o.armR == null ? .35 : o.armR) + (o.walk && !o.steadyR ? Math.sin(w) * .3 : 0), 15, lc, 1, 'hand', 15);

  if (kind === 'durian') { g.fillStyle = '#A8AE3A'; for (let i = 0; i < 26; i++) { const a = i / 26 * Math.PI * 2, ca = Math.cos(a), sa = Math.sin(a); g.beginPath(); g.moveTo(ca * rx * .9 - sa * 16, cy + sa * ry * .9 + ca * 16); g.lineTo(ca * (rx + 30), cy + sa * (ry + 30)); g.lineTo(ca * rx * .9 + sa * 16, cy + sa * ry * .9 - ca * 16); g.closePath(); g.fill(); inkPath(g, '#A8AE3A'); } }

    const rows = [[4, -.95], [4, -.42], [3, .1], [2, .58], [1, .95]]; const gr = rx * .33;
    rows.forEach(([n, yy], ri) => { for (let i = 0; i < n; i++) ell(g, (i - (n - 1) / 2) * gr * 1.7, cy + yy * ry * .85, gr, gr, ri % 2 ? tint(col, .08) : col); });
    g.save(); g.globalAlpha = .9; ell(g, 0, cy - ry * .1, rx * .58, ry * .48, tint(col, .25)); g.restore();
  } else {
    bodyPath(g, kind, cy, rx, ry); g.fillStyle = col; g.fill(); inkPath(g, col);

    g.save(); bodyPath(g, kind, cy, rx, ry); g.clip();
    if (kind === 'pumpkin') { g.strokeStyle = shade(col, .78); g.lineWidth = 6; [.55, .2].forEach(k => { g.beginPath(); g.ellipse(0, cy, rx * k, ry * .99, 0, 0, Math.PI * 2); g.stroke(); }); }
    if (kind === 'melon') melonStripes(g, cy, rx, ry, K.melonStripe, 1, 0);
    if (kind === 'pumpkin' && (o.stripes || 0) > 0) melonStripes(g, cy, rx, ry, K.paint, o.stripes, o.wash || 0, t);
    if (kind === 'berry') {   // 씨: 노란 작은 물방울 모양을 줄 맞춰 (테두리 없이)
      g.fillStyle = '#FFF0A0';
      for (let row = 0; row < 5; row++) { const yy = cy - ry * .55 + row * ry * .33, n = 5 - Math.floor(row / 2), half = rx * (1 - row * .14) * .78;
        for (let i = 0; i < n; i++) { const xx = -half + (i + .5) * 2 * half / n + (row % 2 ? half / n * .5 : 0) - half / n * .25;
          if (Math.abs(xx) < rx * .42 && yy > cy - ry * .3 && yy < cy + ry * .45) continue;   // 얼굴 자리는 비움

    if (kind === 'banana') { g.strokeStyle = shade(col, .8); g.lineWidth = 5; g.beginPath(); g.moveTo(-rx * .2, cy - ry * .9); g.quadraticCurveTo(-rx * .6, cy, rx * .2, cy + ry); g.stroke(); }
    if (kind === 'durian') { const r = rng(9); g.fillStyle = shade(col, .85); for (let i = 0; i < 18; i++) { const a = r() * Math.PI * 2, d = Math.sqrt(r()) * .85; g.beginPath(); g.moveTo(Math.cos(a) * rx * d, cy + Math.sin(a) * ry * d - 9); g.lineTo(Math.cos(a) * rx * d + 7, cy + Math.sin(a) * ry * d + 5); g.lineTo(Math.cos(a) * rx * d - 7, cy + Math.sin(a) * ry * d + 5); g.fill(); } }
    g.fillStyle = 'rgba(60,20,40,.12)'; g.beginPath(); g.ellipse(0, cy, rx * 1.4, ry * 1.4, 0, 0, Math.PI * 2); g.ellipse(-rx * .1, cy - ry * .12, rx * .97, ry * .97, 0, 0, Math.PI * 2, true); g.fill('evenodd');
    g.fillStyle = 'rgba(255,255,255,.35)'; g.beginPath(); g.ellipse(-rx * .45, cy - ry * .55, rx * .2, ry * .1, -.6, 0, Math.PI * 2); g.fill();
    g.restore();

  }

  if (kind === 'pumpkin' && (o.wash || 0) > 0 && (o.stripes || 0) > 0) drips(g, cy, rx, ry, o.wash, t);
  // 앉은 자세: 발만 앞으로

// 6. 두리안 왕자

    if (umbOn && close < 1) { const [hx, hy] = charHand('durian', dr); umbrella(hx, hy, 300 * (1 - close * .3), open * (1 - close), t); }

}

const NAMECOL = { pumpkin: '#F08A1C', melon: '#3E9B4A', apple: '#E04848', grape: '#8E55C2', banana: '#D9A400', berry: '#E8476A', durian: '#8A9A2A', narr: '#8C7F78' };
function subtitle(t) {

  const l = TL.lines[id], str = (C.subs && C.subs[id]) || l.text, a = Math.min(eOut(p(t, l.start - .1, .2)), 1 - p(t, l.end + .15, .2));

function draw(t) {
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1;
  const sc = TL.scenes.find(s => t >= s.start && t < s.end) || TL.scenes[TL.scenes.length - 1];

// ---------- preview player ----------
const seekEl = document.getElementById('seek'), timeEl = document.getElementById('time'), playEl = document.getElementById('play');
seekEl.max = DURATION.toFixed(2);
let playing = false, t0 = 0, tCur = 0;
const audio = new Audio('audio/mix.wav'); audio.preload = 'auto';
function show(t) { tCur = t; draw(t); seekEl.value = t; timeEl.textContent = t.toFixed(2) + 's'; }
function loop(now) { if (!playing) return; const t = (now - t0) / 1000; if (t >= DURATION) { playing = false; playEl.textContent = '▶ 재생'; audio.pause(); show(DURATION); return; } show(t); requestAnimationFrame(loop); }
playEl.onclick = () => { playing = !playing; playEl.textContent = playing ? '❚❚ 정지' : '▶ 재생'; if (playing) { if (tCur >= DURATION) tCur = 0; t0 = performance.now() - tCur * 1000; try { audio.currentTime = tCur; audio.play().catch(() => {}); } catch (e) {} requestAnimationFrame(loop); } else audio.pause(); };
seekEl.oninput = () => { show(+seekEl.value); if (playing) { t0 = performance.now() - tCur * 1000; try { audio.currentTime = tCur; } catch (e) {} } };

window.draw = draw; window.DURATION = DURATION;
function merge(base, over) {
  if (Array.isArray(base)) return Array.isArray(over) ? over.map((v, i) => base[i] !== undefined ? merge(base[i], v) : v) : base;
  if (base && typeof base === 'object') { const o = {}; for (const k in base) o[k] = over && k in over ? merge(base[k], over[k]) : base[k]; return o; }
  return over === undefined || over === null ? base : over;
}
function apply(content) { C = window.CONTENT = merge(DEFAULT_CONTENT, content); K = C.colors; }
window.VIDEO = { schema: window.SCHEMA, defaults: DEFAULT_CONTENT, get content() { return C; }, apply, canvas: cv };

}).then(() => document.fonts.ready).then(() => { if (location.search.includes('render')) document.body.classList.add('render'); show(0); return true; });
