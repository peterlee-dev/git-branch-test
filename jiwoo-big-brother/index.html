<!doctype html>
<html lang="ko">
<head>

  body.render { padding: 0; gap: 0; }
  body.render canvas { width: 1920px; height: 1080px; }
  body.render .bar { display: none; }
</style>
</head>
<body>
<script src="timeline.js"></script>
<script src="content.js"></script>
<script src="schema.js"></script>
<canvas id="c" width="1920" height="1080"></canvas>
<div class="bar">
  <button id="play">▶ 재생</button>
  <input id="seek" type="range" min="0" max="180" step="0.01" value="0">
  <span id="time">0.00s</span>
</div>
<script>

const W = 1920, H = 1080, TL = window.TL, DURATION = TL.duration;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const DEFAULT_CONTENT = JSON.parse(JSON.stringify(window.CONTENT));
let C = window.CONTENT, K = C.colors;
const JUA = "'Jua', 'Noto Sans KR', sans-serif", KR = "'Noto Sans KR', sans-serif";

const S = id => TL.scenes.find(s => s.id === id) || { start: 0, end: 0 };
// 키프레임: [[시각, 값], ...] 사이를 부드럽게

  else if (kind === 'mom') { g.ellipse(0, headY - headR * .38, headR * 1.05, headR * .8, 0, Math.PI, Math.PI * 2); g.fill(); g.beginPath(); g.moveTo(-headR, headY - headR * .2); g.quadraticCurveTo(0, headY - headR * .1, headR * .4, headY - headR * .7); g.lineTo(-headR, headY - headR * .7); g.fill(); }

    const jx = kf(t, [[0, 1250], [st('j15', .6), 1250], [en('j15'), 900], [st('j17', .4), 900], [st('j17', 1.4), 800]]);

    // 하트
    const hk = p(t, st('j17', 1), .5); if (hk > 0) { const r = rng(3); for (let i = 0; i < 10; i++) { const q = ((t - st('j17')) * .4 + r()) % 1; heart(700 + (r() - .5) * 300, 700 - q * 400, 18 + r() * 14, i % 2 ? '#FF6B8A' : '#FF9FB5', hk * (1 - q)); } }

}
// 6. 끝
function sEnd(t) {

// ---------- 자막 ----------
const NAMECOL = { jiwoo: '#4FA3E8', babyj: '#4FA3E8', mom: '#E8607A', dad: '#E3A33C', fairy: '#C77DFF', baby: '#9B6BC4', narr: '#8C7F78' };
function subtitle(t) {

// ---------- preview player ----------
const seekEl = document.getElementById('seek'), timeEl = document.getElementById('time'), playEl = document.getElementById('play');
seekEl.max = DURATION.toFixed(2);
let playing = false, t0 = 0, tCur = 0;
const audio = new Audio('audio/mix.wav'); audio.preload = 'auto';
function show(t) { tCur = t; draw(t); seekEl.value = t; timeEl.textContent = t.toFixed(2) + 's'; }
function loop(now) { if (!playing) return; const t = (now - t0) / 1000; if (t >= DURATION) { playing = false; playEl.textContent = '▶ 재생'; audio.pause(); show(DURATION); return; } show(t); requestAnimationFrame(loop); }
playEl.onclick = () => { playing = !playing; playEl.textContent = playing ? '❚❚ 정지' : '▶ 재생'; if (playing) { if (tCur >= DURATION) tCur = 0; t0 = performance.now() - tCur * 1000; try { audio.currentTime = tCur; audio.play().catch(() => {}); } catch (e) {} requestAnimationFrame(loop); } else audio.pause(); };
seekEl.oninput = () => { show(+seekEl.value); if (playing) { t0 = performance.now() - tCur * 1000; try { audio.currentTime = tCur; } catch (e) {} } };

window.draw = draw; window.DURATION = DURATION;
function merge(base, over) {
  if (Array.isArray(base)) return Array.isArray(over) ? over.map((v, i) => base[i] !== undefined ? merge(base[i], v) : v) : base;
  if (base && typeof base === 'object') { const o = {}; for (const k in base) o[k] = over && k in over ? merge(base[k], over[k]) : base[k]; return o; }
  return over === undefined || over === null ? base : over;
}
function apply(content) { C = window.CONTENT = merge(DEFAULT_CONTENT, content); K = C.colors; }

  if (r.some(fs => !fs.length)) throw new Error('폰트를 불러오지 못했습니다 (fonts/ 폴더 확인)');
}).then(() => document.fonts.ready).then(() => { if (location.search.includes('render')) document.body.classList.add('render'); show(0); return true; });
