<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Adaptive Diagnostic Assessment</title>
<style>
  @font-face { font-family: 'Noto Sans KR'; src: url('fonts/NotoSansKR.ttf') format('truetype'); font-weight: 100 900; font-display: block; }
  html, body { margin: 0; background: #111; }
  body { display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 12px; font-family: 'Noto Sans KR', sans-serif; color: #ddd; }
  canvas { width: min(100%, 1280px); aspect-ratio: 16 / 9; display: block; background: #fff; }
  .bar { display: flex; gap: 12px; align-items: center; width: min(100%, 1280px); }
  .bar input { flex: 1; }
  body.render { padding: 0; gap: 0; }
  body.render canvas { width: 1920px; height: 1080px; }
  body.render .bar { display: none; }
</style>
</head>
<body>
<script src="timeline.js"></script>
<script src="content.js"></script>
<script src="schema.js"></script>
<canvas id="c" width="1920" height="1080"></canvas>
<div class="bar">
  <button id="play">▶ Play</button>
  <input id="seek" type="range" min="0" max="300" step="0.01" value="0">
  <span id="time">0.00s</span>
</div>
<script>
// ------------------------------------------------------------
// Adaptive Diagnostic Assessment — explainer motion graphics for the Self-Learning JEI Math deck (17 slides)
// Timing comes from timeline.js (tools/make_audio.py measures the cloned-voice narration). Every animation is keyed to a narration line,
// so re-recording the voice keeps everything in sync. draw(t) is a pure function of time → frame-by-frame rendering.
// ------------------------------------------------------------
const W = 1920, H = 1080, TL = window.TL, DURATION = TL.duration;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const DEFAULT_CONTENT = JSON.parse(JSON.stringify(window.CONTENT));
let C = window.CONTENT, K = C.colors;
const FONT = "'Noto Sans KR', sans-serif";

// ---------- basics ----------
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;
const p = (t, s, d) => clamp((t - s) / d);
const eOut = x => 1 - Math.pow(1 - x, 3), eIO = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const eBack = x => { const c1 = 1.7, c3 = c1 + 1; return x <= 0 ? 0 : 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
function rgba(hex, a) { const n = parseInt(hex.slice(1), 16); return `rgba(${n >> 16 & 255},${n >> 8 & 255},${n & 255},${a})`; }
const L = id => TL.lines[id] || { start: 0, end: 0 };
const S = id => TL.scenes.find(s => s.id === id) || { start: 0, end: 0 };
const st = (id, f = 0) => L(id).start + (L(id).end - L(id).start) * f;   // f: 0 = start of the line, 1 = end
const en = (id, d = 0) => L(id).end + d;
function rr(x, y, w, h, r, fill, stroke, lw = 2, a = 1) { if (a <= 0) return; ctx.save(); ctx.globalAlpha *= a; ctx.beginPath(); ctx.roundRect(x, y, w, h, r); if (fill) { ctx.fillStyle = fill; ctx.fill(); } if (stroke) { ctx.lineWidth = lw; ctx.strokeStyle = stroke; ctx.stroke(); } ctx.restore(); }
function circ(x, y, r, fill, stroke, lw = 3, a = 1) { if (a <= 0 || r <= 0) return; ctx.save(); ctx.globalAlpha *= a; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); if (fill) { ctx.fillStyle = fill; ctx.fill(); } if (stroke) { ctx.lineWidth = lw; ctx.strokeStyle = stroke; ctx.stroke(); } ctx.restore(); }
function line(x1, y1, x2, y2, c, lw = 3, a = 1, dash) { if (a <= 0) return; ctx.save(); ctx.globalAlpha *= a; ctx.strokeStyle = c; ctx.lineWidth = lw; ctx.lineCap = 'round'; if (dash) ctx.setLineDash(dash); ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke(); ctx.restore(); }
function text(str, x, y, { size = 40, color = K.navy, weight = 500, align = 'center', alpha = 1, base = 'middle', maxW } = {}) {
  if (alpha <= 0 || !str) return; ctx.save(); ctx.globalAlpha *= alpha; ctx.font = `${weight} ${size}px ${FONT}`; ctx.textAlign = align; ctx.textBaseline = base; ctx.fillStyle = color;
  if (maxW) { const w = ctx.measureText(str).width; if (w > maxW) ctx.font = `${weight} ${size * maxW / w}px ${FONT}`; }
  ctx.fillText(str, x, y); ctx.restore();
}
// rich text: [['plain ', color], ['bold', color, weight]] centred on x
function rich(parts, x, y, size, alpha = 1, def = K.navy) {
  if (alpha <= 0) return; ctx.save(); ctx.globalAlpha *= alpha; ctx.textBaseline = 'middle';
  const ws = parts.map(([s, c, w]) => { ctx.font = `${w || 600} ${size}px ${FONT}`; return ctx.measureText(s).width; });
  let cx = x - ws.reduce((a, b) => a + b, 0) / 2;
  parts.forEach(([s, c, w], i) => { ctx.font = `${w || 600} ${size}px ${FONT}`; ctx.fillStyle = c || def; ctx.textAlign = 'left'; ctx.fillText(s, cx, y); cx += ws[i]; });
  ctx.restore();
}
// entrance: fade + rise (+ optional pop). returns k (0..1) and applies a transform around (x, y) while fn runs
function enter(t, t0, x, y, fn, { d = .55, rise = 30, pop = false } = {}) {
  const k = p(t, t0, d); if (k <= 0) return 0;
  const e = pop ? eBack(k) : eOut(k);
  ctx.save(); ctx.globalAlpha *= clamp(k * 1.6); ctx.translate(x, y + (1 - eOut(k)) * rise); if (pop) ctx.scale(lerp(.6, 1, e), lerp(.6, 1, e)); ctx.translate(-x, -y); fn(k); ctx.restore(); return k;
}
function card(x, y, w, h, { fill = '#FFFFFF', stroke = K.line, r = 18, shadow = true, a = 1 } = {}) {
  if (a <= 0) return; ctx.save(); ctx.globalAlpha *= a;
  if (shadow) { ctx.shadowColor = 'rgba(30,60,140,.12)'; ctx.shadowBlur = 30; ctx.shadowOffsetY = 10; }
  ctx.beginPath(); ctx.roundRect(x, y, w, h, r); ctx.fillStyle = fill; ctx.fill(); ctx.shadowColor = 'transparent'; ctx.lineWidth = 2; ctx.strokeStyle = stroke; ctx.stroke(); ctx.restore();
}
function arrowHead(x, y, ang, s, c) { ctx.save(); ctx.translate(x, y); ctx.rotate(ang); ctx.fillStyle = c; ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(-s, -s * .6); ctx.lineTo(-s, s * .6); ctx.closePath(); ctx.fill(); ctx.restore(); }
// arc arrow between two points that bulges up (dir -1) or down (dir 1), drawn to fraction k
function arcArrow(x1, y1, x2, y2, bulge, c, k, lw = 5) {
  if (k <= 0) return; const mx = (x1 + x2) / 2, my = (y1 + y2) / 2 + bulge;
  ctx.save(); ctx.strokeStyle = c; ctx.lineWidth = lw; ctx.lineCap = 'round'; ctx.beginPath();
  let px = x1, py = y1, ang = 0; ctx.moveTo(x1, y1);
  for (let i = 1; i <= 40 * k; i++) { const u = i / 40, nx = (1 - u) * (1 - u) * x1 + 2 * (1 - u) * u * mx + u * u * x2, ny = (1 - u) * (1 - u) * y1 + 2 * (1 - u) * u * my + u * u * y2; ang = Math.atan2(ny - py, nx - px); ctx.lineTo(nx, ny); px = nx; py = ny; }
  ctx.stroke(); ctx.restore(); arrowHead(px, py, ang, 16, c);
}
function check(x, y, s, c, k = 1, lw = 7) { if (k <= 0) return; ctx.save(); ctx.strokeStyle = c; ctx.lineWidth = lw; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.beginPath(); const pts = [[-.5, 0], [-.15, .35], [.55, -.4]]; ctx.moveTo(x + pts[0][0] * s, y + pts[0][1] * s); const k1 = clamp(k * 2), k2 = clamp(k * 2 - 1); ctx.lineTo(x + lerp(pts[0][0], pts[1][0], k1) * s, y + lerp(pts[0][1], pts[1][1], k1) * s); if (k2 > 0) ctx.lineTo(x + lerp(pts[1][0], pts[2][0], k2) * s, y + lerp(pts[1][1], pts[2][1], k2) * s); ctx.stroke(); ctx.restore(); }
function cross(x, y, s, c, k = 1, lw = 7) { if (k <= 0) return; const k1 = clamp(k * 2), k2 = clamp(k * 2 - 1); line(x - s / 2, y - s / 2, x - s / 2 + s * k1, y - s / 2 + s * k1, c, lw); if (k2 > 0) line(x + s / 2, y - s / 2, x + s / 2 - s * k2, y - s / 2 + s * k2, c, lw); }
function bigArrow(x, y, up, c, s = 1, a = 1) { ctx.save(); ctx.globalAlpha *= a; ctx.translate(x, y); ctx.scale(s, up ? -s : s); ctx.fillStyle = c; ctx.beginPath(); ctx.moveTo(-9, -22); ctx.lineTo(9, -22); ctx.lineTo(9, 2); ctx.lineTo(20, 2); ctx.lineTo(0, 24); ctx.lineTo(-20, 2); ctx.lineTo(-9, 2); ctx.closePath(); ctx.fill(); ctx.restore(); }

// ---------- background: soft gradient + blue swoosh waves (from the deck) ----------
function backdrop(t, swoosh = .35) {
  const g = ctx.createLinearGradient(0, 0, W, H); g.addColorStop(0, '#FFFFFF'); g.addColorStop(1, K.bg); ctx.fillStyle = g; ctx.fillRect(-200, -200, W + 400, H + 400);
  const b = ctx.createRadialGradient(1500, 120, 10, 1500, 120, 900); b.addColorStop(0, 'rgba(120,160,255,.10)'); b.addColorStop(1, 'rgba(120,160,255,0)'); ctx.fillStyle = b; ctx.fillRect(0, 0, W, H);
  if (swoosh > 0) waves(t, swoosh);
}
function waves(t, k) {
  // three layered ribbons rising from the bottom-right corner
  const cols = [rgba(K.blue, .10 * k / .35 * .35), rgba(K.blue, .5 * k), K.blueDark];
  [[0, 520, cols[0]], [1, 380, cols[1]], [2, 250, cols[2]]].forEach(([i, h, c]) => {
    if (i === 2 && k < .9) c = rgba(K.blueDark, k);
    ctx.save(); ctx.fillStyle = c; ctx.beginPath(); ctx.moveTo(W + 50, H + 50);
    const sway = Math.sin(t * .5 + i) * 20;
    ctx.lineTo(W * (1 - .62 * k) - i * 40, H + 50); ctx.bezierCurveTo(W * (1 - .35 * k), H - h * .2 * k + sway, W - 380, H - h * k - 120 * k + sway, W + 50, H - h * k * 1.9 - 120 * k);
    ctx.closePath(); ctx.fill(); ctx.restore();
  });
}
// section header like the deck: small "01 Background" + title + hairline
function header(t, t0, small, title) {
  const k = p(t, t0, .6); if (k <= 0) return;
  text(small, 90, 78, { size: 24, color: K.navy, weight: 500, align: 'left', alpha: eOut(k) });
  text(title, 90 + (1 - eOut(k)) * -30, 124, { size: 46, color: K.navy, weight: 700, align: 'left', alpha: eOut(k) });
  line(90, 168, 90 + (W - 180) * eOut(k), 168, '#E3E8F2', 2);
}
function withCam(z, cx, cy, fn) { ctx.save(); ctx.translate(cx, cy); ctx.scale(z, z); ctx.translate(-cx, -cy); fn(); ctx.restore(); }
function drift(t, s0) { return 1 + .02 * eIO(clamp((t - s0) / 14)); }

// ---------- icons (simple line-art in the deck's blue) ----------
function iconDoc(x, y, s, k = 1) { ctx.save(); ctx.translate(x, y); ctx.scale(s, s); ctx.globalAlpha *= k; rr(-50, -62, 100, 124, 10, '#FFFFFF', K.blue, 5); for (let i = 0; i < 4; i++) line(-30, -30 + i * 22, 30 - (i === 3 ? 25 : 0), -30 + i * 22, K.blue, 5); rr(10, -90, 60, 42, 10, K.blueSoft, K.blue, 5); ctx.save(); ctx.translate(40, 50); ctx.rotate(-.8); rr(-8, -50, 16, 70, 4, '#FFFFFF', K.blue, 5); ctx.restore(); ctx.restore(); }
function iconChart(x, y, s, k = 1) { ctx.save(); ctx.translate(x, y); ctx.scale(s, s); ctx.globalAlpha *= k; [[-60, 20, 40], [-35, 0, 60], [-10, -20, 80]].forEach(([bx, by, bh]) => rr(bx, 60 - bh * k, 18, bh * k, 3, K.blue)); ctx.beginPath(); ctx.moveTo(-40, -40); ctx.arc(-40, -40, 34, -Math.PI / 2, Math.PI * 1.1); ctx.closePath(); ctx.fillStyle = K.blueSoft; ctx.fill(); ctx.strokeStyle = K.blue; ctx.lineWidth = 5; ctx.stroke(); for (let i = 0; i < 3; i++) line(10, -60 + i * 20, 60, -60 + i * 20, K.blue, 5); circ(30, 20, 30, 'rgba(255,255,255,.8)', K.blue, 6); line(52, 42, 75, 66, K.blue, 10); ctx.restore(); }
function iconBook(x, y, s, k = 1) { ctx.save(); ctx.translate(x, y); ctx.scale(s, s); ctx.globalAlpha *= k; ctx.strokeStyle = K.blue; ctx.lineWidth = 5; ctx.fillStyle = '#FFFFFF'; ctx.beginPath(); ctx.moveTo(0, -40); ctx.quadraticCurveTo(-40, -55, -75, -45); ctx.lineTo(-75, 40); ctx.quadraticCurveTo(-40, 30, 0, 45); ctx.quadraticCurveTo(40, 30, 75, 40); ctx.lineTo(75, -45); ctx.quadraticCurveTo(40, -55, 0, -40); ctx.closePath(); ctx.fill(); ctx.stroke(); line(0, -40, 0, 45, K.blue, 5); for (let i = 0; i < 3; i++) { line(-60, -20 + i * 18, -15, -24 + i * 18, K.blue, 4); line(15, -24 + i * 18, 60, -20 + i * 18, K.blue, 4); } circ(-10, 70, 18, K.blueSoft, K.blue, 5); ctx.save(); ctx.translate(55, -60); ctx.rotate(.7); rr(-7, -40, 14, 62, 4, '#FFFFFF', K.blue, 5); ctx.restore(); ctx.restore(); }
function iconPerson(x, y, s, c = K.blue, a = 1) { ctx.save(); ctx.globalAlpha *= a; ctx.translate(x, y); ctx.scale(s, s); circ(0, -26, 14, null, c, 5); ctx.strokeStyle = c; ctx.lineWidth = 5; ctx.beginPath(); ctx.arc(0, 18, 26, Math.PI, 0); ctx.stroke(); ctx.restore(); }
function iconSheet(x, y, s, a = 1) { ctx.save(); ctx.globalAlpha *= a; ctx.translate(x, y); ctx.scale(s, s); rr(-36, -46, 72, 92, 6, '#FFFFFF', K.blue, 4); for (let i = 0; i < 5; i++) line(-22, -28 + i * 14, i % 2 ? 6 : 22, -28 + i * 14, K.blue, 3); ctx.save(); ctx.translate(28, 30); ctx.rotate(-.7); rr(-5, -30, 10, 42, 3, K.blueSoft, K.blue, 3); ctx.restore(); ctx.restore(); }
function iconGear(x, y, s, rot, a = 1) { ctx.save(); ctx.globalAlpha *= a; ctx.translate(x, y); ctx.scale(s, s); ctx.rotate(rot); ctx.fillStyle = K.blue; ctx.beginPath(); for (let i = 0; i < 16; i++) { const r = i % 2 ? 52 : 64, a2 = i / 16 * Math.PI * 2; ctx.lineTo(Math.cos(a2) * r, Math.sin(a2) * r); } ctx.closePath(); ctx.fill(); circ(0, 0, 30, '#FFFFFF'); ctx.restore(); ctx.save(); ctx.globalAlpha *= a; ctx.translate(x, y); ctx.scale(s, s); ctx.fillStyle = K.blue; ctx.beginPath(); ctx.moveTo(4, -22); ctx.lineTo(-12, 4); ctx.lineTo(0, 4); ctx.lineTo(-4, 22); ctx.lineTo(12, -4); ctx.lineTo(0, -4); ctx.closePath(); ctx.fill(); ctx.restore(); }
function iconClock(x, y, s, ang, a = 1) { ctx.save(); ctx.globalAlpha *= a; ctx.translate(x, y); ctx.scale(s, s); ctx.strokeStyle = K.blue; ctx.lineWidth = 12; ctx.lineCap = 'round'; ctx.beginPath(); ctx.arc(0, 0, 60, -Math.PI * .35, Math.PI * 1.25); ctx.stroke(); arrowHead(Math.cos(Math.PI * 1.25) * 60, Math.sin(Math.PI * 1.25) * 60, Math.PI * 1.25 + Math.PI / 2 + .3, 26, K.blue); line(0, 0, 0, -38, K.blueDark, 10); line(0, 0, Math.cos(ang) * 30, Math.sin(ang) * 30, K.blueDark, 10); ctx.restore(); }
function iconOps(x, y, s, a = 1) { ctx.save(); ctx.globalAlpha *= a; rr(x - 36 * s, y - 36 * s, 72 * s, 72 * s, 18 * s, K.blue); ctx.restore(); text('+ −', x, y - 12 * s, { size: 22 * s, color: '#fff', weight: 800, alpha: a }); text('× ÷', x, y + 14 * s, { size: 22 * s, color: '#fff', weight: 800, alpha: a }); }
function iconChat(x, y, s, a = 1) { ctx.save(); ctx.globalAlpha *= a; ctx.translate(x, y); ctx.scale(s, s); ctx.fillStyle = K.blueDark; ctx.beginPath(); ctx.ellipse(-12, -8, 34, 26, 0, 0, Math.PI * 2); ctx.fill(); ctx.beginPath(); ctx.moveTo(-34, 6); ctx.lineTo(-40, 26); ctx.lineTo(-20, 14); ctx.fill(); ctx.fillStyle = K.navy; ctx.beginPath(); ctx.ellipse(18, 12, 28, 22, 0, 0, Math.PI * 2); ctx.fill(); ctx.beginPath(); ctx.moveTo(36, 22); ctx.lineTo(44, 38); ctx.lineTo(26, 30); ctx.fill(); ctx.restore(); }
function iconReport(x, y, s, a = 1) { ctx.save(); ctx.globalAlpha *= a; ctx.translate(x, y); ctx.scale(s, s); ctx.strokeStyle = K.orange; ctx.lineWidth = 9; ctx.lineCap = 'round'; ctx.beginPath(); ctx.arc(0, 0, 30, Math.PI * .8, Math.PI * 2.55); ctx.stroke(); arrowHead(Math.cos(Math.PI * .8) * 30, Math.sin(Math.PI * .8) * 30, Math.PI * .8 - Math.PI / 2, 16, K.orange); line(0, 0, 0, -16, K.orange, 7); line(0, 0, 12, 8, K.orange, 7); ctx.restore(); }

// ============================================================
// scenes
// ============================================================
// 1. title
function sIntro(t) {
  backdrop(t, 0);
  waves(t, eOut(p(t, .2, 2.2)));
  const k = p(t, .6, .8);
  enter(t, .5, 120, 160, () => { text('Self-Learning', 120, 160, { size: 30, color: K.navy, weight: 600, align: 'left' }); text('JEI', 318, 160, { size: 30, color: K.red, weight: 800, align: 'left' }); text('Math', 372, 160, { size: 30, color: K.navy, weight: 600, align: 'left' }); });
  enter(t, 1.0, 120, 330, () => text('Math Online', 120, 330, { size: 52, color: K.navy, weight: 700, align: 'left' }));
  // title reveals letter by letter
  const title = C.title.main, n = Math.floor(title.length * eOut(p(t, 1.3, 1.6)));
  if (n > 0) { ctx.save(); const tsz = Math.min(104, 104 * 1380 / (() => { ctx.font = `600 104px ${FONT}`; return ctx.measureText(title).width; })()); ctx.font = `600 ${tsz}px ${FONT}`; ctx.fillStyle = K.navy; ctx.textBaseline = 'middle'; ctx.fillText(title.slice(0, n), 116, 440); if (n < title.length) { const w = ctx.measureText(title.slice(0, n)).width; rr(122 + w, 440 - tsz * .42, 6, tsz * .84, 3, K.blue); } ctx.restore(); }
  enter(t, 3.0, 120, 540, () => text(C.title.sub, 122, 540, { size: 34, color: K.gray, weight: 400, align: 'left' }));
  enter(t, 3.4, 120, 640, () => text(C.title.team, 122, 640, { size: 28, color: K.navy, weight: 500, align: 'left' }));
}
// 2. what is a diagnostic assessment
function sWhat(t) {
  const s0 = S('what').start;
  withCam(drift(t, s0), 960, 540, () => {
    backdrop(t);
    header(t, s0 + .1, '01 Background', 'What is a diagnostic assessment?');
    const items = [['Pre-Learning Assessment', iconDoc], ['Assessing Learner Level', iconChart], ['Personalized Program', iconBook]];
    const times = [st('l3', 0), st('l3', .25), st('l3', .62)];
    items.forEach(([lab, icon], i) => {
      const x = 380 + i * 580, y = 560;
      enter(t, times[i], x, y, () => { card(x - 210, y - 200, 420, 400, { fill: i === 1 && t > times[1] ? '#FFFFFF' : '#FFFFFF' }); icon(x, y - 40, 1.25, 1); text(lab, x, y + 130, { size: 34, color: K.navy, weight: 600 }); if (i === 2) text('Prescription', x, y + 172, { size: 34, color: K.navy, weight: 600 }); }, { pop: true });
      if (i < 2) { const ka = p(t, times[i + 1] - .2, .4); if (ka > 0) { text('»', x + 290, y - 10, { size: 90, color: K.green, weight: 700, alpha: ka }); } }
    });
    // flowing dot along the steps
    const fk = p(t, st('l3', .7), 2); if (fk > 0 && fk < 1) circ(lerp(380, 1540, eIO(fk)), 800, 10, K.blue);
    if (fk > 0) line(380, 800, lerp(380, 1540, eIO(fk)), 800, rgba(K.blue, .35), 6);
  });
}
// 3. problems
function sProblem(t) {
  const s0 = S('problem').start;
  withCam(drift(t, s0), 960, 540, () => {
    backdrop(t);
    header(t, s0 + .1, '01 Background', 'Problems with Diagnostic Assessment');
    const bx = 360, by = 300;
    enter(t, st('l4', .05), 640, 500, () => {
      card(bx, by, 560, 360);
      for (let i = 0; i < 3; i++) { const x = bx + 110 + i * 170; iconSheet(x, by + 105, 1.1); iconPerson(x, by + 250, 1.1); }
      text('Every learner answers the same questions', bx + 280, by + 330, { size: 26, color: K.navy, weight: 600 });
    });
    // stack of questions piles up on each learner (the burden)
    const pile = p(t, st('l5', .45), 2.5);
    if (pile > 0) for (let i = 0; i < 3; i++) { const x = bx + 110 + i * 170; for (let j = 0; j < Math.floor(pile * 6); j++) rr(x - 30 + Math.sin(j * 1.7 + i) * 6, by + 40 - j * 16, 60, 12, 3, j % 2 ? K.blueSoft : '#FFFFFF', K.blue, 2); }
    // branches
    const kb = p(t, st('l5', 0), .8), kb2 = p(t, st('l5', .5), .8);
    line(bx + 560, by + 180, bx + 560 + 150 * eOut(kb), by + 180 - 110 * eOut(kb), '#9AA7C0', 3, kb);
    text('Improve', 1290, 300, { size: 40, color: K.navy, weight: 700, alpha: kb }); text('diagnostic accuracy', 1290, 350, { size: 40, color: K.navy, weight: 700, alpha: kb });
    text('BUT', 1290, 470, { size: 34, color: K.gray, weight: 500, alpha: kb2 });
    line(bx + 560, by + 180, bx + 560 + 150 * eOut(kb2), by + 180 + 110 * eOut(kb2), '#9AA7C0', 3, kb2);
    enter(t, st('l5', .55), 1290, 580, () => { text('Burden on Learners', 1270, 580, { size: 44, color: K.orange, weight: 800 }); bigArrow(1510, 580, true, K.orange, 1.1); }, { pop: true });
    enter(t, st('l6', .1), 960, 820, () => { card(430, 760, 1060, 120, { fill: '#FFFFFF' }); text('Efficiency of determining the learning starting point', 935, 820, { size: 38, color: K.navy, weight: 700 }); bigArrow(1435, 822, false, K.green, 1.2); });
  });
}
// 4. adaptive: responsive system with the multiplication example
function mathCard(x, y, w, h, q, opts, col, a = 1) {
  card(x, y, w, h, { stroke: col || K.line, a }); if (a <= 0) return;
  text('Multiply.', x + 22, y + 26, { size: 18, color: K.gray, weight: 500, align: 'left', alpha: a });

// ---------- subtitles: the current chunk of the current line ----------
function subtitle(t) {
  const id = TL.order.find(i => { const l = TL.lines[i]; return t >= l.start - .1 && t < l.end + .3; }); if (!id) return;
  const l = TL.lines[id], cs = l.chunks || [{ text: l.text, start: l.start }];
  let ci = 0; for (let i = 0; i < cs.length; i++) if (t >= cs[i].start - .05) ci = i;
  const str = (C.subs && C.subs[id] && C.subs[id] !== l.text) ? C.subs[id] : cs[ci].text;   // edited subtitle replaces the whole line
  const a = Math.min(eOut(p(t, l.start - .1, .2)), 1 - p(t, l.end + .1, .2));
  ctx.save(); ctx.font = `500 38px ${FONT}`; const w = Math.min(1700, ctx.measureText(str).width + 70); ctx.restore();
  rr(960 - w / 2, 975, w, 70, 14, rgba(K.subBox, .78), null, 0, a);
  text(str, 960, 1011, { size: 38, color: '#FFFFFF', weight: 500, alpha: a, maxW: 1640 });
}
function draw(t) {
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1;
  const sc = TL.scenes.find(s => t >= s.start && t < s.end) || TL.scenes[TL.scenes.length - 1];
  ({ intro: sIntro, what: sWhat, problem: sProblem, adaptive: sAdaptive, necessary: sNecessary, benefit: sBenefit, how: sHow, path: sPath, validate: sValidate, quick: sQuick, effects: sEffects, outro: sOutro })[sc.id](t);
  // soft white dip between scenes
  const fi = 1 - p(t, sc.start, .4), fo = p(t, sc.end - .3, .3);
  if (sc.id !== 'intro' && fi > 0) { ctx.fillStyle = `rgba(255,255,255,${fi})`; ctx.fillRect(0, 0, W, H); }
  if (sc.id !== 'outro' && fo > 0) { ctx.fillStyle = `rgba(255,255,255,${fo})`; ctx.fillRect(0, 0, W, H); }
  subtitle(t);
}

// ---------- preview player ----------
const seekEl = document.getElementById('seek'), timeEl = document.getElementById('time'), playEl = document.getElementById('play');
seekEl.max = DURATION.toFixed(2);
let playing = false, t0 = 0, tCur = 0;
const audio = new Audio('audio/mix.wav'); audio.preload = 'auto';
function show(t) { tCur = t; draw(t); seekEl.value = t; timeEl.textContent = t.toFixed(2) + 's'; }
function loop(now) { if (!playing) return; const t = (now - t0) / 1000; if (t >= DURATION) { playing = false; playEl.textContent = '▶ Play'; audio.pause(); show(DURATION); return; } show(t); requestAnimationFrame(loop); }
playEl.onclick = () => { playing = !playing; playEl.textContent = playing ? '❚❚ Pause' : '▶ Play'; if (playing) { if (tCur >= DURATION) tCur = 0; t0 = performance.now() - tCur * 1000; try { audio.currentTime = tCur; audio.play().catch(() => {}); } catch (e) {} requestAnimationFrame(loop); } else audio.pause(); };
seekEl.oninput = () => { show(+seekEl.value); if (playing) { t0 = performance.now() - tCur * 1000; try { audio.currentTime = tCur; } catch (e) {} } };

window.draw = draw; window.DURATION = DURATION;
function merge(base, over) {
  if (Array.isArray(base)) return Array.isArray(over) ? over.map((v, i) => base[i] !== undefined ? merge(base[i], v) : v) : base;
  if (base && typeof base === 'object') { const o = {}; for (const k in base) o[k] = over && k in over ? merge(base[k], over[k]) : base[k]; return o; }
  return over === undefined || over === null ? base : over;
}
function apply(content) { C = window.CONTENT = merge(DEFAULT_CONTENT, content); K = C.colors; }
window.VIDEO = { schema: window.SCHEMA, defaults: DEFAULT_CONTENT, get content() { return C; }, apply, canvas: cv };
window.ready = document.fonts.load(`700 100px 'Noto Sans KR'`, 'Aa').then(r => {
  if (!r.length) throw new Error('font failed to load (check fonts/)');
}).then(() => document.fonts.ready).then(() => { if (location.search.includes('render')) document.body.classList.add('render'); show(0); return true; });
