<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>광합성 종이공예 과학 영상</title>
<style>
  @font-face { font-family: 'Jua'; src: url('fonts/Jua-Regular.ttf') format('truetype'); font-display: block; }
  @font-face { font-family: 'Noto Sans KR'; src: url('fonts/NotoSansKR.ttf') format('truetype'); font-weight: 100 900; font-display: block; }
  html, body { margin: 0; background: #111; }
  body { display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 12px; font-family: 'Jua', sans-serif; color: #ddd; }
  canvas { width: min(100%, 1280px); aspect-ratio: 16 / 9; display: block; background: #000; }
  .bar { display: flex; gap: 12px; align-items: center; width: min(100%, 1280px); }
  .bar input { flex: 1; }
  body.render { padding: 0; gap: 0; }
  body.render canvas { width: 1920px; height: 1080px; }
  body.render .bar { display: none; }
</style>
</head>
<body>
<script src="timeline.js"></script>
<canvas id="c" width="1920" height="1080"></canvas>
<div class="bar">
  <button id="play">▶ 재생</button>
  <input id="seek" type="range" min="0" max="200" step="0.01" value="0">
  <span id="time">0.00s</span>
</div>
<script>
// ------------------------------------------------------------
// 광합성 종이공예(페이퍼 컷아웃) 과학 모션그래픽
// draw(t) 는 시간 t(초)만으로 화면을 그리는 순수 함수 → 프레임 단위 렌더 가능
// · 종이 질감: 절차적으로 만든 종이결 텍스처를 multiply 로 얹음
// · 겹친 종이: 도형마다 그림자를 줘서 층이 쌓인 느낌
// · 스톱모션: 애니메이션 시간을 15fps 로 끊고, 6fps 로 종이가 살짝 떨림
// 자막과 시간 늘리기(WARP)는 tools/make_audio.py 가 만든 timeline.js 에서 읽음
// ------------------------------------------------------------
const W = 1920, H = 1080, BASE_DURATION = 148;
const WARP = window.WARP || [];
const SUBS = window.SUBS || [];
const v2r = v => WARP.reduce((r, [vs, ve, f]) => v > vs ? r + (Math.min(v, ve) - vs) * (f - 1) : r, v);
function r2v(r) {
  let v = 0, rr = 0;
  for (const [vs, ve, f] of WARP) {
    if (r < rr + (vs - v)) return v + (r - rr);
    rr += vs - v; v = vs;
    const seg = (ve - vs) * f;
    if (r < rr + seg) return vs + (r - rr) / f;
    rr += seg; v = ve;
  }
  return v + (r - rr);
}
const DURATION = v2r(BASE_DURATION);
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');

const INK = '#3B2F25', CREAM = '#F3EAD8', WHITE = '#FCF9F3', KRAFT = '#D8BC92';
const GREEN = '#66B85C', GREEN_D = '#2F7D46', GREEN_L = '#9AD46F', CELL = '#DDF0C8';
const SKY = '#CDE8F4', SKY_D = '#86C5E3', SUN = '#FFC93C', SUN_D = '#FF9F1C';
const SOIL = '#8B5A3C', ROOT = '#E2C08D', WATER = '#4FA8E8', RED = '#E60012', GRAY = '#5A5A5A', PINK = '#F4A6B8', STARCH = '#F2D9A0';
const F = "'Jua', 'Noto Sans KR', sans-serif";

// ---------- easing / timing ----------
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;
const p = (t, s, d) => clamp((t - s) / d);
const eOut = x => 1 - Math.pow(1 - x, 3);
const eIn = x => x * x * x;
const eIO = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const eBack = x => { const c1 = 2.0, c3 = c1 + 1; return x <= 0 ? 0 : 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const env = (t, s, e, fi = .4, fo = .4) => Math.min(eOut(p(t, s, fi)), 1 - eIn(p(t, e - fo, fo)));
const pop = (t, s, d = .5) => eBack(p(t, s, d));
function rng(seed) { return () => (seed = (seed * 16807) % 2147483647) / 2147483647; }
let ST = 0, STEP = 0, PID = 0;   // 스톱모션 시간, 떨림 단계, 종이 조각 번호

// ---------- 종이 질감 ----------
function makeTexture() {
  const c = document.createElement('canvas'); c.width = c.height = 512;
  const g = c.getContext('2d'), r = rng(11);
  g.fillStyle = '#fff'; g.fillRect(0, 0, 512, 512);
  for (let i = 0; i < 40; i++) {              // 큰 얼룩
    const x = r() * 512, y = r() * 512, rad = 60 + r() * 120, gr = g.createRadialGradient(x, y, 0, x, y, rad);
    gr.addColorStop(0, 'rgba(150,120,90,.05)'); gr.addColorStop(1, 'rgba(150,120,90,0)');
    g.fillStyle = gr; g.fillRect(x - rad, y - rad, rad * 2, rad * 2);
  }
  for (let i = 0; i < 9000; i++) {            // 잔 알갱이
    g.fillStyle = `rgba(${100 + r() * 60 | 0},${80 + r() * 40 | 0},60,${.03 + r() * .06})`;
    g.fillRect(r() * 512, r() * 512, 1 + r() * 1.6, 1 + r() * 1.6);
  }
  g.lineWidth = 1;
  for (let i = 0; i < 520; i++) {             // 종이 섬유
    const x = r() * 512, y = r() * 512, a = r() * 6.28, l = 4 + r() * 16;
    g.strokeStyle = `rgba(120,90,60,${.04 + r() * .06})`;
    g.beginPath(); g.moveTo(x, y); g.lineTo(x + Math.cos(a) * l, y + Math.sin(a) * l); g.stroke();
  }
  return c;
}
const PAT = ctx.createPattern(makeTexture(), 'repeat');

function jit(seed) { return [Math.sin(STEP * 12.9898 + seed * 78.233) * 1.3, Math.cos(STEP * 7.531 + seed * 39.346) * 1.3]; }
// 종이 한 장: 그림자 → 색 → 종이결 → 가장자리 하이라이트
function paper(build, color, o = {}) {
  const { lift = 1, alpha = 1, tex = true, edge = true, j = true } = o;
  if (alpha <= 0) return;
  const id = PID++;
  ctx.save(); ctx.globalAlpha *= alpha;
  if (j) { const [jx, jy] = jit(id); ctx.translate(jx, jy); }
  if (lift > 0) { ctx.shadowColor = 'rgba(70,45,20,.34)'; ctx.shadowBlur = 5 + 7 * lift; ctx.shadowOffsetX = 2 * lift; ctx.shadowOffsetY = 4 * lift; }
  build(); ctx.fillStyle = color; ctx.fill();
  ctx.shadowColor = 'transparent'; ctx.shadowBlur = 0; ctx.shadowOffsetX = 0; ctx.shadowOffsetY = 0;
  if (tex) { ctx.save(); build(); ctx.clip(); ctx.globalCompositeOperation = 'multiply'; ctx.fillStyle = PAT; ctx.fillRect(-4000, -4000, 8000, 8000); ctx.restore(); }
  if (edge) { build(); ctx.lineWidth = 2.2; ctx.strokeStyle = 'rgba(255,255,255,.4)'; ctx.stroke(); }
  ctx.restore();
}
function paperBg(color) {
  ctx.fillStyle = color; ctx.fillRect(0, 0, W, H);
  ctx.save(); ctx.globalCompositeOperation = 'multiply'; ctx.fillStyle = PAT; ctx.fillRect(0, 0, W, H); ctx.restore();
  const g = ctx.createRadialGradient(W / 2, H / 2, H * .45, W / 2, H / 2, H * 1.05);
  g.addColorStop(0, 'rgba(90,60,30,0)'); g.addColorStop(1, 'rgba(90,60,30,.16)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
}

// ---------- 모양(경로) 만들기 ----------
const B = {
  circle: (x, y, r) => () => { ctx.beginPath(); ctx.arc(x, y, Math.max(0.01, r), 0, Math.PI * 2); },
  ellipse: (x, y, rx, ry, rot = 0) => () => { ctx.beginPath(); ctx.ellipse(x, y, Math.max(.01, rx), Math.max(.01, ry), rot, 0, Math.PI * 2); },
  rrect: (x, y, w, h, r) => () => { ctx.beginPath(); ctx.roundRect(x, y, Math.max(.01, w), Math.max(.01, h), Math.min(r, Math.abs(w) / 2, Math.abs(h) / 2)); },
  poly: pts => () => { ctx.beginPath(); pts.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)); ctx.closePath(); },
  blob: (cx, cy, rx, ry, seed, amp = .05, n = 26) => {          // 가위로 오린 듯한 울퉁불퉁한 원
    const rr = rng(seed), pts = [];
    for (let i = 0; i < n; i++) { const a = i / n * Math.PI * 2, k = 1 + (rr() - .5) * 2 * amp; pts.push([cx + Math.cos(a) * rx * k, cy + Math.sin(a) * ry * k]); }
    const m = (a, b) => [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2];
    return () => {
      ctx.beginPath(); const s = m(pts[n - 1], pts[0]); ctx.moveTo(s[0], s[1]);
      for (let i = 0; i < n; i++) { const c = pts[i], e = m(pts[i], pts[(i + 1) % n]); ctx.quadraticCurveTo(c[0], c[1], e[0], e[1]); }
      ctx.closePath();
    };
  },
  star: (x, y, r) => () => { ctx.beginPath(); for (let i = 0; i < 8; i++) { const a = i / 8 * Math.PI * 2 - Math.PI / 2, rr = i % 2 ? r * .32 : r; ctx.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr); } ctx.closePath(); },
  hex: (x, y, r) => () => { ctx.beginPath(); for (let i = 0; i < 6; i++) { const a = i / 6 * Math.PI * 2 + Math.PI / 6; ctx.lineTo(x + Math.cos(a) * r, y + Math.sin(a) * r); } ctx.closePath(); },
};
function leafPath(x, y, len, wid, ang) {
  const c = Math.cos(ang), s = Math.sin(ang), P = (px, py) => [x + px * c - py * s, y + px * s + py * c];
  return () => { ctx.beginPath(); ctx.moveTo(...P(0, 0)); ctx.quadraticCurveTo(...P(len * .35, -wid * 1.25), ...P(len, 0)); ctx.quadraticCurveTo(...P(len * .35, wid * 1.25), ...P(0, 0)); ctx.closePath(); };
}
function leaf(x, y, len, wid, ang, color = GREEN, alpha = 1) {
  if (len < 2) return;
  paper(leafPath(x, y, len, wid, ang), color, { alpha });
  const c = Math.cos(ang), s = Math.sin(ang), P = (px, py) => [x + px * c - py * s, y + px * s + py * c];
  ctx.save(); ctx.globalAlpha *= alpha; ctx.strokeStyle = 'rgba(255,255,255,.5)'; ctx.lineWidth = 3; ctx.lineCap = 'round'; ctx.beginPath();
  ctx.moveTo(...P(0, 0)); ctx.lineTo(...P(len * .92, 0));
  for (const t of [.3, .5, .7]) for (const sd of [-1, 1]) { ctx.moveTo(...P(len * t, 0)); ctx.lineTo(...P(len * (t + .13), sd * wid * .62 * (1 - t))); }
  ctx.stroke(); ctx.restore();
}

// ---------- 글자 ----------
function label(str, x, y, { size = 60, color = INK, align = 'center', alpha = 1, scale = 1, rot = 0, shadow = true } = {}) {
  if (alpha <= 0 || scale <= 0) return;
  ctx.save(); ctx.globalAlpha *= alpha; ctx.translate(x, y); ctx.rotate(rot); ctx.scale(scale, scale);
  ctx.font = `${size}px ${F}`; ctx.textAlign = align; ctx.textBaseline = 'middle';
  if (shadow) { ctx.fillStyle = 'rgba(60,40,20,.22)'; ctx.fillText(str, 1.5, 3.5); }
  ctx.fillStyle = color; ctx.fillText(str, 0, 0); ctx.restore();
}
function measure(str, size) { ctx.save(); ctx.font = `${size}px ${F}`; const w = ctx.measureText(str).width; ctx.restore(); return w; }
// 화학식: 문자 뒤의 숫자는 아래첨자로
function chemParts(str, size) {
  const parts = []; let prev = '';
  for (const ch of str) {
    const sub = /[0-9]/.test(ch) && /[A-Za-z)]/.test(prev);
    const s = sub ? size * .62 : size;
    ctx.save(); ctx.font = `${s}px ${F}`; const w = ctx.measureText(ch).width; ctx.restore();
    parts.push({ ch, sub, s, w }); prev = ch;
  }
  return parts;
}
function chemWidth(str, size) { return chemParts(str, size).reduce((a, b) => a + b.w, 0); }
function chem(str, x, y, { size = 50, color = INK, align = 'center', alpha = 1, scale = 1 } = {}) {
  if (alpha <= 0 || scale <= 0) return;
  const parts = chemParts(str, size), total = parts.reduce((a, b) => a + b.w, 0);
  ctx.save(); ctx.globalAlpha *= alpha; ctx.translate(x, y); ctx.scale(scale, scale);
  let cx = align === 'center' ? -total / 2 : align === 'right' ? -total : 0;
  parts.forEach(({ ch, sub, s, w }) => { ctx.font = `${s}px ${F}`; ctx.textAlign = 'left'; ctx.textBaseline = 'middle'; ctx.fillStyle = color; ctx.fillText(ch, cx, sub ? size * .22 : 0); cx += w; });
  ctx.restore();
}
function tag(str, x, y, { size = 48, fill = WHITE, color = INK, k = 1, padX = 32, padY = 14, rot = 0, alpha = 1, isChem = false } = {}) {
  if (k <= 0 || alpha <= 0) return;
  const w = (isChem ? chemWidth(str, size) : measure(str, size)) + padX * 2, h = size + padY * 2;
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot); ctx.scale(k, k);
  paper(B.rrect(-w / 2, -h / 2, w, h, h * .32), fill, { alpha, lift: 1 });
  if (isChem) chem(str, 0, 3, { size, color, alpha }); else label(str, 0, 3, { size, color, shadow: false, alpha });
  ctx.restore();
}
function arrowP(x0, y0, x1, y1, th, color, k = 1, alpha = 1) {
  if (k <= 0) return;
  const a = Math.atan2(y1 - y0, x1 - x0), d = Math.hypot(x1 - x0, y1 - y0) * k;
  ctx.save(); ctx.translate(x0, y0); ctx.rotate(a);
  paper(() => { ctx.beginPath(); ctx.moveTo(0, -th / 2); ctx.lineTo(d - th * 1.2, -th / 2); ctx.lineTo(d - th * 1.2, -th); ctx.lineTo(d, 0); ctx.lineTo(d - th * 1.2, th); ctx.lineTo(d - th * 1.2, th / 2); ctx.lineTo(0, th / 2); ctx.closePath(); }, color, { alpha, lift: .8 });
  ctx.restore();
}
function pointer(x0, y0, x1, y1, k = 1, alpha = 1) {
  if (k <= 0) return;
  ctx.save(); ctx.globalAlpha *= alpha; ctx.strokeStyle = INK; ctx.lineWidth = 4; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(lerp(x0, x1, k), lerp(y0, y1, k)); ctx.stroke();
  if (k >= 1) circle(x1, y1, 7, INK); ctx.restore();
}
function circle(x, y, r, c, a = 1) { if (r <= 0 || a <= 0) return; ctx.save(); ctx.globalAlpha *= a; ctx.fillStyle = c; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill(); ctx.restore(); }
function along(P, u) {
  const L = [0]; for (let i = 1; i < P.length; i++) L.push(L[i - 1] + Math.hypot(P[i][0] - P[i - 1][0], P[i][1] - P[i - 1][1]));
  const d = clamp(u) * L[L.length - 1]; let i = 1; while (i < L.length - 1 && L[i] < d) i++;
  const f = (d - L[i - 1]) / ((L[i] - L[i - 1]) || 1); return [lerp(P[i - 1][0], P[i][0], f), lerp(P[i - 1][1], P[i][1], f)];
}

// ---------- 분자 ----------
const atom = (x, y, r, c, a = 1) => paper(B.circle(x, y, r), c, { lift: .5, alpha: a, j: false });
function co2(x, y, s = 1, a = 1) { atom(x - 30 * s, y, 14 * s, RED, a); atom(x + 30 * s, y, 14 * s, RED, a); atom(x, y, 18 * s, GRAY, a); }
function h2o(x, y, s = 1, a = 1) { atom(x - 22 * s, y + 16 * s, 10 * s, WHITE, a); atom(x + 22 * s, y + 16 * s, 10 * s, WHITE, a); atom(x, y, 18 * s, RED, a); }
function o2(x, y, s = 1, a = 1) { atom(x - 14 * s, y, 15 * s, RED, a); atom(x + 14 * s, y, 15 * s, RED, a); }
function glucose(x, y, s = 1, a = 1, color = PINK) {
  paper(B.hex(x, y, 46 * s), color, { alpha: a, j: false });
  for (let i = 0; i < 6; i++) { const ang = i / 6 * Math.PI * 2 + Math.PI / 6; circle(x + Math.cos(ang) * 46 * s * .68, y + Math.sin(ang) * 46 * s * .68, 6.5 * s, i === 0 ? RED : GRAY, a); }
  circle(x, y, 8 * s, 'rgba(255,255,255,.55)', a);
}

// ---------- 하늘·땅·식물 ----------
function cloud(x, y, s, k = 1) {
  if (k <= 0) return; ctx.save(); ctx.translate(x, y); ctx.scale(s * k, s * k);
  const o = { lift: .6, edge: false, j: false };
  paper(B.circle(-60, 10, 52), WHITE, o); paper(B.circle(10, -22, 68), WHITE, o); paper(B.circle(78, 8, 50), WHITE, o); paper(B.rrect(-108, 6, 236, 56, 28), WHITE, o);
  ctx.restore();
}
function sun(x, y, r, k = 1, ts = 0) {
  if (k <= 0) return; ctx.save(); ctx.translate(x, y); ctx.scale(k, k);
  for (let i = 0; i < 12; i++) {
    const a = i / 12 * Math.PI * 2 + ts * .3, c = Math.cos(a), s = Math.sin(a), n = [-s, c];
    paper(B.poly([[c * r * 1.05 + n[0] * r * .2, s * r * 1.05 + n[1] * r * .2], [c * r * 1.6, s * r * 1.6], [c * r * 1.05 - n[0] * r * .2, s * r * 1.05 - n[1] * r * .2]]), i % 2 ? SUN : SUN_D, { lift: .6, j: false });
  }
  paper(B.circle(0, 0, r), SUN, { lift: 1, j: false });
  circle(-r * .32, -r * .1, r * .08, INK); circle(r * .32, -r * .1, r * .08, INK);
  circle(-r * .52, r * .22, r * .12, SUN_D, .6); circle(r * .52, r * .22, r * .12, SUN_D, .6);
  ctx.strokeStyle = INK; ctx.lineWidth = 5; ctx.lineCap = 'round'; ctx.beginPath(); ctx.arc(0, r * .12, r * .3, .2 * Math.PI, .8 * Math.PI); ctx.stroke();
  ctx.restore();
}
const hill = (cx, cy, rx, ry, color, seed, lift = 1) => paper(B.blob(cx, cy, rx, ry, seed, .03, 30), color, { lift });
const stemPt = (x, y, h, u) => [x + 16 * Math.sin(u * 3.2), y - h * u];
// 식물: leaves = [[줄기 위치 u, 방향(-1 왼쪽/1 오른쪽), 길이, 폭, 각도 보정], ...]
function plant(x, y, h, g, ts, leaves, sw = 22) {
  if (g <= 0) return;
  paper(B.blob(x, y + 14, 130, 36, 21, .06, 20), SOIL, { lift: .8 });
  ctx.save(); ctx.shadowColor = 'rgba(70,45,20,.3)'; ctx.shadowBlur = 8; ctx.shadowOffsetX = 2; ctx.shadowOffsetY = 4;
  ctx.strokeStyle = GREEN_D; ctx.lineWidth = sw; ctx.lineCap = 'round'; ctx.beginPath();
  for (let i = 0; i <= 20; i++) { const [px, py] = stemPt(x, y, h * g, i / 20); i ? ctx.lineTo(px, py) : ctx.moveTo(px, py); }
  ctx.stroke(); ctx.restore();
  leaves.forEach(([u, side, len, wid, adj = 0], i) => {
    const k = eOut(clamp((g - u * .55) / .4)); if (k <= 0) return;
    const [px, py] = stemPt(x, y, h * g, u);
    const ang = (side < 0 ? -Math.PI + .5 + adj : -.5 - adj) + Math.sin(ts * 1.6 + i) * .05 * (side < 0 ? -1 : 1);
    leaf(px, py, len * k, wid * k, ang, i % 2 ? '#5AAE52' : GREEN);
  });
}
const LEAVES = [[.42, -1, 200, 62], [.55, 1, 210, 66], [.72, -1, 250, 76], [.86, 1, 250, 76], [1, -1, 160, 54, .55], [1, 1, 160, 54, .55]];

// ============================================================
// 장면
// ============================================================

// 0–7 : 타이틀
function sTitle(t) {
  paperBg(SKY);
  [[300, 230, 1], [1480, 150, .8], [860, 110, .6]].forEach(([x, y, s], i) => cloud(x + Math.sin(ST * .35 + i) * 20, y, s, pop(t, .1 + i * .25, .6)));
  sun(1660, 270, 78, pop(t, .3, .7), ST);
  hill(640, 1160, 1080, 420, GREEN_L, 5, 1.5); hill(1500, 1190, 900, 380, GREEN, 8, 1.5);
  plant(540, 870, 360, eOut(p(t, .6, 1.8)), ST, LEAVES);
  ctx.save(); ctx.translate(1240, 470); ctx.rotate(-.03); ctx.scale(pop(t, 1.0, .8), pop(t, 1.0, .8));
  paper(B.rrect(-430, -150, 860, 300, 46), WHITE, { lift: 1.6 });
  label('광합성', 0, 8, { size: 220, color: GREEN_D });
  ctx.restore();
  tag('식물은 어떻게 양분을 만들까요?', 1250, 700, { size: 48, fill: SUN, k: pop(t, 2.0, .6), rot: .02 });
  tag('재능교육', 1720, 1000, { size: 34, fill: RED, color: '#fff', k: pop(t, 2.6, .5), padX: 24, padY: 10 });
}

// 7–22 : 궁금해요
function s1(t) {
  paperBg(CREAM);
  hill(960, 1180, 1300, 360, GREEN_L, 3, 1);
  const bo = 1 - eIn(p(t, 15, .5)), bx = 520, by = 700;
  if (bo > 0) {
    const k = pop(t, 7.6, .6) * bo;
    ctx.save(); ctx.translate(bx, by); ctx.scale(k, k);
    paper(() => { ctx.beginPath(); ctx.moveTo(-170, 0); ctx.quadraticCurveTo(-160, 150, 0, 156); ctx.quadraticCurveTo(160, 150, 170, 0); ctx.closePath(); }, '#6FA8D6');
    paper(B.blob(0, -30, 148, 74, 4, .06, 24), WHITE, { lift: .6 });

  const a = env(t, 112.5, 117.8, .4, .5);
  if (a > 0) {
    ctx.save(); ctx.globalAlpha *= a;
    [['빛의 세기', 360, 112.8], ['이산화탄소 농도', 960, 113.6], ['온도', 1560, 114.4]].forEach(([s, x, at], i) => {
      const k = pop(t, at, .6);
      ctx.save(); ctx.translate(x, 500); ctx.scale(k, k); ctx.rotate((i - 1) * .025);
      paper(B.rrect(-215, -250, 430, 500, 40), WHITE, { lift: 1.5 });
      ctx.restore();
      if (k > 0.05) {
        ctx.save(); ctx.translate(x, 430); ctx.scale(k, k);
        if (i === 0) sun(0, 0, 66, 1, ST);
        if (i === 1) co2(0, 0, 2.4, 1);
        if (i === 2) { paper(B.rrect(-26, -130, 52, 220, 26), '#EDEDED', { lift: .8, j: false }); paper(B.circle(0, 90, 48), RED, { lift: .8, j: false }); paper(B.rrect(-11, -60 + (Math.sin(ST * 2) * 10), 22, 150 - (Math.sin(ST * 2) * 10), 11), RED, { lift: 0, j: false }); }
        ctx.restore();
      }
      label(s, x, 700, { size: 50, scale: k });
    });
    ctx.restore();
  }
  const b = env(t, 117.6, 124.8, .5, .5);
  if (b > 0) {
    const pr = eIO(p(t, 118.0, 4.6));
    const G = graph(330, 190, 1260, 700, fLight, pr, { xl: '빛의 세기', yl: '광합성량', alpha: b });
    if (t > 121.6) { ctx.save(); ctx.globalAlpha *= b; ctx.setLineDash([12, 12]); ctx.strokeStyle = INK; ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(G.gx + G.gw * .7, G.gy); ctx.lineTo(G.gx + G.gw * .7, G.gy - G.gh * .9 * fLight(.7)); ctx.stroke(); ctx.restore(); }
    tag('더 늘지 않아요', 1240, 330, { size: 48, fill: SUN, k: pop(t, 122.2, .6) * b, rot: -.02 });
  }
  const c = env(t, 124.4, 132.4, .5, .5);
  if (c > 0) {
    const pr = eIO(p(t, 125.0, 3.6));
    graph(120, 210, 830, 640, fLight, pr, { xl: '이산화탄소 농도', yl: '광합성량', alpha: c });
    const G = graph(980, 210, 830, 640, fTemp, pr, { xl: '온도', yl: '광합성량', alpha: c, color: RED });
    tag('알맞은 온도', G.gx + G.gw * .6, 320, { size: 44, fill: SUN, k: pop(t, 128.6, .6) * c, rot: -.02 });
    tag('너무 낮아도', G.gx + G.gw * .14, 700, { size: 34, fill: '#D9D4CC', k: pop(t, 129.2, .5) * c, padX: 20, padY: 8 });
    tag('너무 높아도', G.gx + G.gw * .9, 700, { size: 34, fill: '#D9D4CC', k: pop(t, 129.6, .5) * c, padX: 20, padY: 8 });
  }
}

// 132–148 : 정리
function s7(t) {
  paperBg(SKY);
  cloud(1450, 170, .8); cloud(560, 130, .6);
  sun(320, 260, 80, 1, ST);
  hill(640, 1170, 1100, 400, GREEN_L, 5, 1.5); hill(1500, 1190, 900, 360, GREEN, 8, 1.5);
  plant(960, 880, 470, 1, ST, LEAVES);
  const ins = [['빛', SUN, 133.4, 430], ['물', WATER, 134.2, 550], ['이산화탄소', '#D9D4CC', 135.0, 670]];
  ins.forEach(([s, f, at, y]) => {
    tag(s, 300, y, { size: 46, fill: f, color: f === WATER ? '#fff' : INK, k: pop(t, at, .5) });
    arrowP(470, y, 700, y + (500 - y) * .2, 30, SUN_D, eOut(p(t, at + .2, .5)));
  });
  [['포도당', PINK, 136.0, 470], ['산소', SKY, 136.6, 610]].forEach(([s, f, at, y]) => {
    arrowP(1230, y - (y - 560) * .2, 1440, y, 30, GREEN_D, eOut(p(t, at, .5)));
    tag(s, 1620, y, { size: 46, fill: f, k: pop(t, at + .2, .5) });
  });
  tag('식물은 빛, 물, 이산화탄소로 포도당과 산소를 만들어요', 1130, 160, { size: 44, fill: WHITE, k: pop(t, 132.8, .6), rot: -.01, padX: 36 });
  const bo = eOut(p(t, 138.8, .5));
  if (bo > 0) {
    for (let i = 0; i < 6; i++) { const u = ((t - 139.5) * .18 + i / 6) % 1; o2(lerp(880, 1100, (i % 3) / 2) + Math.sin(ST * 3 + i) * 20, lerp(440, 270, u), 1, bo * Math.min(1, u * 6) * (1 - eIn(clamp((u - .8) / .2)))); }
    tag('광합성 덕분에 식물도 자라고, 우리도 숨 쉴 수 있어요!', 960, 960, { size: 52, fill: SUN, k: pop(t, 138.8, .7), rot: .01, padX: 44 });
  }
  tag('재능교육', 1720, 1010, { size: 30, fill: RED, color: '#fff', k: pop(t, 141, .5), padX: 22, padY: 8 });
  const f = p(t, 147, 1); if (f > 0) { ctx.fillStyle = `rgba(0,0,0,${eIO(f)})`; ctx.fillRect(0, 0, W, H); }
}

// ---------- 공통 UI ----------
const SECTIONS = [[7.5, 22, '궁금해요'], [22, 48, '광합성의 재료'], [48, 68, '광합성이 일어나는 곳'], [68, 92, '광합성 식'], [92, 112, '광합성의 결과'], [112, 132, '광합성에 영향을 주는 요인']];
function header(t) {
  const s = SECTIONS.find(s => t >= s[0] && t < s[1]); if (!s) return;
  const k = pop(t, s[0] + .1, .5), w = measure(s[2], 46) + 140;
  ctx.save(); ctx.translate(60, 80); ctx.scale(k, k); ctx.rotate(-.012);
  paper(B.rrect(0, -46, w, 92, 22), WHITE, { lift: 1.2 }); paper(B.rrect(20, -18, 36, 36, 6), RED, { lift: 0, j: false });
  label(s[2], 80, 3, { size: 46, align: 'left', shadow: false });
  ctx.restore();
}
function subtitle(t) {
  const s = SUBS.find(s => t >= s[0] && t < s[1]); if (!s) return;
  const a = env(t, s[0], s[1], .25, .25), w = measure(s[2], 46) + 110;
  ctx.save(); ctx.globalAlpha *= a; paper(B.rrect(W / 2 - w / 2, 950, w, 92, 26), WHITE, { lift: 1.2, j: false });
  label(s[2], W / 2, 998, { size: 46, shadow: false }); ctx.restore();
}
const TRANS = [[7, '궁금해요', KRAFT], [22, '재료', GREEN_L], [48, '엽록체', PINK], [68, '광합성 식', SKY_D], [92, '결과', SUN], [112, '영향', GREEN], [132, '정리', KRAFT]];
function transition(t) {
  TRANS.forEach(([T, name, col], i) => {
    if (t < T - .5 || t > T + .5) return;
    const Ws = W + 500; const L = t < T ? lerp(W, -500, eIO(p(t, T - .5, .5))) : lerp(-500, -Ws - 120, eIO(p(t, T, .5)));
    paper(() => { ctx.beginPath(); ctx.moveTo(L, -30); for (let y = -30; y <= H + 30; y += 50) ctx.lineTo(L + Math.sin(y * .07 + i) * 16, y); ctx.lineTo(L + Ws, H + 30); ctx.lineTo(L + Ws, -30); ctx.closePath(); }, col, { lift: 3, j: false });
    label(name, L + Ws / 2, H / 2, { size: 190, color: INK, alpha: .9 });
  });
}

function draw(realT) {
  let t = r2v(realT); t = Math.floor(t * 15 + 1e-4) / 15;     // 15fps 스톱모션
  ST = t; STEP = Math.floor(t * 6); PID = 0;
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.shadowColor = 'transparent'; ctx.shadowBlur = 0; ctx.setLineDash([]);
  if (t < 7) sTitle(t); else if (t < 22) s1(t); else if (t < 48) s2(t); else if (t < 68) s3(t); else if (t < 92) s4(t); else if (t < 112) s5(t); else if (t < 132) s6(t); else s7(t);
  header(t); subtitle(t); transition(t);
  if (t < 7 && t > 0) { /* 타이틀 자막은 위 subtitle 에서 처리 */ }
}

// ---------- preview player ----------
const seekEl = document.getElementById('seek'), timeEl = document.getElementById('time'), playEl = document.getElementById('play');
seekEl.max = DURATION;
let playing = false, t0 = 0, tCur = 0;
const audio = new Audio('audio/mix.wav'); audio.preload = 'auto';
function show(t) { tCur = t; draw(t); seekEl.value = t; timeEl.textContent = t.toFixed(2) + 's'; }
function loop(now) {
  if (!playing) return;
  const t = (now - t0) / 1000;
  if (t >= DURATION) { playing = false; playEl.textContent = '▶ 재생'; audio.pause(); show(DURATION); return; }
  show(t); requestAnimationFrame(loop);
}
playEl.onclick = () => {
  playing = !playing; playEl.textContent = playing ? '❚❚ 정지' : '▶ 재생';
  if (playing) { if (tCur >= DURATION) tCur = 0; t0 = performance.now() - tCur * 1000; try { audio.currentTime = tCur; audio.play().catch(() => {}); } catch (e) {} requestAnimationFrame(loop); }
  else audio.pause();
};
seekEl.oninput = () => { show(+seekEl.value); if (playing) { t0 = performance.now() - tCur * 1000; try { audio.currentTime = tCur; } catch (e) {} } };

window.draw = draw;
window.DURATION = DURATION;
window.ready = Promise.all([
  document.fonts.load(`100px 'Jua'`, '가'), document.fonts.load(`400 100px 'Noto Sans KR'`, '→'),
]).then(r => {
  if (r.some(fs => !fs.length)) throw new Error('폰트를 불러오지 못했습니다 (fonts/ 폴더 확인)');
}).then(() => document.fonts.ready).then(() => { if (location.search.includes('render')) document.body.classList.add('render'); show(0); return true; });
</script>
