<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Adaptive Diagnostic Assessment v2</title>
<style>
  @font-face { font-family: 'Noto Sans KR'; src: url('fonts/NotoSansKR.ttf') format('truetype'); font-weight: 100 900; font-display: block; }
  html, body { margin: 0; background: #0E1424; }
  body { display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 12px; font-family: 'Avenir Next', 'Noto Sans KR', sans-serif; color: #ddd; }
  canvas { width: min(100%, 1280px); aspect-ratio: 16 / 9; display: block; background: #FEFFFF; }
  .bar { display: flex; gap: 12px; align-items: center; width: min(100%, 1280px); }
  .bar input { flex: 1; }
  body.render { padding: 0; gap: 0; }
  body.render canvas { width: 1920px; height: 1080px; }
  body.render .bar { display: none; }
</style>
</head>
<body>
<script src="timeline.js"></script>
<script src="content.js"></script>
<script src="schema.js"></script>
<canvas id="c" width="1920" height="1080"></canvas>
<div class="bar">
  <button id="play">▶ Play</button>
  <input id="seek" type="range" min="0" max="300" step="0.01" value="0">
  <span id="time">0.00s</span>
</div>
<script>
// ------------------------------------------------------------
// Adaptive Diagnostic Assessment — v2: the same script, drawn as one continuous sheet of graph paper
// (same concept as ../math-di-improvement-v2). Each scene is a workbook page; the camera slides sideways between pages
// (in time with the whoosh in the mix) and stays still while the page is read. Teacher's-pen marks: circles, checks,
// crosses, highlighter, sticky notes, stamps. The difficulty ladder (1–9) is the recurring picture of how it works.
// Timing: timeline.js, written by tools/make_audio.py from the recorded narration (audio/narration.mp3). draw(t) is a pure function of time.
// Sound cues baked into audio/mix.wav sit on spoken words (TL.cues): path scene pathDown / pathUp, validate understood /
// notUnderstood, outro l31 −0.3.
// ------------------------------------------------------------
const W = 1920, H = 1080, TL = window.TL, DURATION = TL.duration;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const DEFAULT_CONTENT = JSON.parse(JSON.stringify(window.CONTENT));
let C = window.CONTENT, K = C.colors;
const SANS = "'Avenir Next', 'Noto Sans KR', 'Helvetica Neue', sans-serif";
const HAND = "'Noteworthy', 'Bradley Hand', 'Marker Felt', 'Noto Sans KR', cursive";
const LINE = '#DDE1E6', STICKY = '#EEEFF1', BAR = '#E6E8EC';   // card outline, sticky note, empty answer lines
const HI = () => rgba(K.blush, .95);   // highlighter

// ---------- basics ----------
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;
const p = (t, s, d) => clamp((t - s) / d);
const eOut = x => 1 - Math.pow(1 - x, 3), eIO = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const eBack = x => { const c1 = 1.7, c3 = c1 + 1; return x <= 0 ? 0 : 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const nz = (i, s = 1) => { const v = Math.sin(i * 12.9898 + s * 78.233) * 43758.5453; return v - Math.floor(v) - .5; };   // fixed jitter (no flicker)
function rgba(hex, a) { const n = parseInt(hex.slice(1), 16); return `rgba(${n >> 16 & 255},${n >> 8 & 255},${n & 255},${a})`; }
const L = id => TL.lines[id] || { start: 0, end: 0 };
const S = id => TL.scenes.find(s => s.id === id) || { start: 0, end: 0 };
const st = (id, f = 0) => L(id).start + (L(id).end - L(id).start) * f;   // f: 0 = start of the narration line, 1 = end
const en = (id, d = 0) => L(id).end + d;
const CUE = TL.cues || {};   // times of the spoken words that pictures and sound effects follow (tools/make_audio.py)

function rr(x, y, w, h, r, fill, stroke, lw = 2, a = 1) { if (a <= 0) return; ctx.save(); ctx.globalAlpha *= a; ctx.beginPath(); ctx.roundRect(x, y, w, h, r); if (fill) { ctx.fillStyle = fill; ctx.fill(); } if (stroke) { ctx.lineWidth = lw; ctx.strokeStyle = stroke; ctx.stroke(); } ctx.restore(); }
function circle(x, y, r, fill, stroke, lw = 3, a = 1) { if (r <= 0 || a <= 0) return; ctx.save(); ctx.globalAlpha *= a; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); if (fill) { ctx.fillStyle = fill; ctx.fill(); } if (stroke) { ctx.lineWidth = lw; ctx.strokeStyle = stroke; ctx.stroke(); } ctx.restore(); }
function line0(x1, y1, x2, y2, c, lw = 3) { ctx.save(); ctx.strokeStyle = c; ctx.lineWidth = lw; ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke(); ctx.restore(); }
function card(x, y, w, h, { fill = '#FFFFFF', stroke = LINE, r = 16, a = 1, shadow = true, lw = 2 } = {}) {
  if (a <= 0) return; ctx.save(); ctx.globalAlpha *= a;
  if (shadow) { ctx.shadowColor = 'rgba(24,38,74,.10)'; ctx.shadowBlur = 22; ctx.shadowOffsetY = 8; }
  ctx.beginPath(); ctx.roundRect(x, y, w, h, r); ctx.fillStyle = fill; ctx.fill(); ctx.shadowColor = 'transparent';
  if (stroke) { ctx.lineWidth = lw; ctx.strokeStyle = stroke; ctx.stroke(); } ctx.restore();
}
function measure(str, size, weight = 600, fam = SANS) { ctx.save(); ctx.font = `${weight} ${size}px ${fam}`; const w = ctx.measureText(str).width; ctx.restore(); return w; }
// ink box of a string drawn by text() at (x, y): { l, r, t, b } offsets from (x, y). Glyphs inside pen circles centre on this, not on the em box
function ink(str, size, weight = 600, fam = SANS) { ctx.save(); ctx.font = `${weight} ${size}px ${fam}`; ctx.textBaseline = 'middle'; const m = ctx.measureText(str); ctx.restore(); return { l: -m.actualBoundingBoxLeft, r: m.actualBoundingBoxRight, t: -m.actualBoundingBoxAscent, b: m.actualBoundingBoxDescent }; }
const inkDy = (str, size, weight, fam) => { const b = ink(str, size, weight, fam); return -(b.t + b.b) / 2; };   // y shift that puts the ink's middle on y
function text(str, x, y, { size = 36, weight = 600, fam = SANS, color = K.ink, align = 'left', alpha = 1, maxW, spacing = 0 } = {}) {
  if (alpha <= 0 || !str) return; ctx.save(); ctx.globalAlpha *= alpha;
  let sz = size; if (maxW) { const w = measure(str, size, weight, fam) + spacing * str.length; if (w > maxW) sz = size * maxW / w; }
  ctx.font = `${weight} ${sz}px ${fam}`; ctx.textAlign = align; ctx.textBaseline = 'middle'; ctx.fillStyle = color;
  if (spacing) ctx.letterSpacing = spacing + 'px';
  ctx.fillText(str, x, y); ctx.restore();
}
// entrance: fade + rise (+ optional pop around ox, oy). Moves only while entering, then stays put
function enter(t, t0, fn, { d = .55, dy = 26, pop = false, ox = 960, oy = 540 } = {}) {
  const k = p(t, t0, d); if (k <= 0) return 0;
  ctx.save(); ctx.globalAlpha *= clamp(k * 1.5);
  if (pop) { const s = lerp(.5, 1, eBack(k)); ctx.translate(ox, oy); ctx.scale(s, s); ctx.translate(-ox, -oy); }
  else ctx.translate(0, (1 - eOut(k)) * dy);
  fn(k); ctx.restore(); return k;
}

// ---------- teacher's pen ----------
function strokePts(pts, k, color, lw = 5, a = 1, dash) {
  if (k <= 0 || a <= 0 || pts.length < 2) return;
  let tot = 0; const seg = []; for (let i = 1; i < pts.length; i++) { const d = Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]); seg.push(d); tot += d; }
  let left = tot * clamp(k);
  ctx.save(); ctx.globalAlpha *= a; ctx.strokeStyle = color; ctx.lineWidth = lw; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; if (dash) ctx.setLineDash(dash);
  ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length && left > 0; i++) { const f = Math.min(1, left / seg[i - 1]); ctx.lineTo(lerp(pts[i - 1][0], pts[i][0], f), lerp(pts[i - 1][1], pts[i][1], f)); left -= seg[i - 1]; }
  ctx.stroke(); ctx.restore();
}
function wobble(x1, y1, x2, y2, seed = 1, amp = 1.6, n = 14) {
  const dx = x2 - x1, dy = y2 - y1, len = Math.hypot(dx, dy) || 1, nx = -dy / len, ny = dx / len, pts = [];
  for (let i = 0; i <= n; i++) { const f = i / n, j = (i === 0 || i === n) ? 0 : nz(i, seed) * amp * 2; pts.push([x1 + dx * f + nx * j, y1 + dy * f + ny * j]); }
  return pts;
}
const pen = (x1, y1, x2, y2, k, c = K.red, lw = 5, seed = 1, a = 1, dash) => strokePts(wobble(x1, y1, x2, y2, seed), k, c, lw, a, dash);
function penCircle(cx, cy, rx, ry, k, c = K.red, lw = 5, seed = 1, a = 1) {
  const pts = [], a0 = -2.3 + nz(1, seed) * .4, n = 56;
  for (let i = 0; i <= n; i++) { const ang = a0 + (i / n) * Math.PI * 2.12, r = 1 + nz(i, seed) * .05 + (i / n) * .06; pts.push([cx + Math.cos(ang) * rx * r, cy + Math.sin(ang) * ry * r]); }
  strokePts(pts, k, c, lw, a);
}
function penArrow(x1, y1, x2, y2, k, c = K.red, lw = 5, seed = 1, a = 1) {
  pen(x1, y1, x2, y2, clamp(k / .8), c, lw, seed, a);
  const hk = clamp((k - .75) / .25); if (hk <= 0) return;
  const ang = Math.atan2(y2 - y1, x2 - x1), s = 18 + lw;
  pen(x2, y2, x2 - Math.cos(ang - .5) * s, y2 - Math.sin(ang - .5) * s, hk, c, lw, seed + 3, a);
  pen(x2, y2, x2 - Math.cos(ang + .5) * s, y2 - Math.sin(ang + .5) * s, hk, c, lw, seed + 5, a);
}
function penCurve(x1, y1, cx, cy, x2, y2, k, c = K.red, lw = 5, a = 1, arrow = false) {
  const pts = []; for (let i = 0; i <= 30; i++) { const f = i / 30; pts.push([(1 - f) * (1 - f) * x1 + 2 * (1 - f) * f * cx + f * f * x2, (1 - f) * (1 - f) * y1 + 2 * (1 - f) * f * cy + f * f * y2]); }
  strokePts(pts, arrow ? clamp(k / .85) : k, c, lw, a);
  if (arrow) { const hk = clamp((k - .8) / .2); if (hk > 0) { const ang = Math.atan2(y2 - cy, x2 - cx), s = 16 + lw; pen(x2, y2, x2 - Math.cos(ang - .5) * s, y2 - Math.sin(ang - .5) * s, hk, c, lw, 7, a); pen(x2, y2, x2 - Math.cos(ang + .5) * s, y2 - Math.sin(ang + .5) * s, hk, c, lw, 9, a); } }
}
function check(x, y, s, k, c = K.red, lw = 7) { strokePts([[x - s * .5, y], [x - s * .12, y + s * .38], [x + s * .55, y - s * .45]], k, c, lw); }
function crossMark(x, y, s, k, c = K.navy, lw = 6) { pen(x - s / 2, y - s / 2, x + s / 2, y + s / 2, clamp(k * 2), c, lw, 2); pen(x + s / 2, y - s / 2, x - s / 2, y + s / 2, clamp(k * 2 - 1), c, lw, 4); }
function hiLite(x, y, w, h, k, c = HI()) { if (k <= 0) return; const e = eOut(k); ctx.save(); ctx.fillStyle = c; ctx.beginPath(); ctx.moveTo(x, y + 4); ctx.lineTo(x + w * e, y); ctx.lineTo(x + w * e - 6, y + h); ctx.lineTo(x - 4, y + h - 3); ctx.closePath(); ctx.fill(); ctx.restore(); }
function hbox(x, y, w, h, k, c = K.ink, lw = 4, seed = 3) { strokePts([...wobble(x, y, x + w, y, seed, 1), ...wobble(x + w, y, x + w, y + h, seed + 1, 1).slice(1), ...wobble(x + w, y + h, x, y + h, seed + 2, 1).slice(1), ...wobble(x, y + h, x, y, seed + 3, 1).slice(1)], k, c, lw); }
function sticky(x, y, w, h, rot, k, lines, { size = 32, color = K.ink } = {}) {
  if (k <= 0) return; const s = lerp(.6, 1, eBack(k));
  ctx.save(); ctx.globalAlpha *= clamp(k * 2); ctx.translate(x + w / 2, y + h / 2); ctx.rotate(rot); ctx.scale(s, s);
  ctx.shadowColor = 'rgba(24,38,74,.18)'; ctx.shadowBlur = 16; ctx.shadowOffsetY = 8; ctx.fillStyle = STICKY; ctx.fillRect(-w / 2, -h / 2, w, h); ctx.shadowColor = 'transparent';
  ctx.fillStyle = 'rgba(0,0,0,.05)'; ctx.fillRect(-w / 2, -h / 2, w, 26);
  lines.forEach((l, i) => text(l, 0, (i - (lines.length - 1) / 2) * size * 1.25 + 8, { size, weight: 700, fam: HAND, color, align: 'center', maxW: w - 30 }));
  ctx.restore();
}
// rectangular rubber stamp (UNDERSTOOD / NOT UNDERSTOOD), lands from a bigger size
function stamp(str, x, y, k, c, rot = -.08, size = 34) {
  if (k <= 0) return; const s = lerp(1.8, 1, eOut(k)), w = measure(str, size, 800) + 2 * str.length + 60;
  ctx.save(); ctx.globalAlpha *= clamp(k * 3) * .92; ctx.translate(x, y); ctx.rotate(rot); ctx.scale(s, s);
  ctx.strokeStyle = c; ctx.lineWidth = 6; ctx.strokeRect(-w / 2, -size, w, size * 2); ctx.lineWidth = 2.5; ctx.strokeRect(-w / 2 + 8, -size + 8, w - 16, size * 2 - 16);
  text(str, 0, 2, { size, weight: 800, color: c, align: 'center', spacing: 2 }); ctx.restore();
}
function chip(str, x, y, { size = 22, fill = K.red, color = '#FFFFFF', a = 1, pad = 16, weight = 700, spacing = 1.5, align = 'left' } = {}) {
  if (a <= 0) return 0; const w = measure(str, size, weight) + spacing * str.length + pad * 2, h = size * 1.8, x0 = align === 'center' ? x - w / 2 : x;
  rr(x0, y - h / 2, w, h, h / 2, '#FFFFFF', null, 0, a); rr(x0, y - h / 2, w, h, h / 2, fill, null, 0, a); text(str, x0 + pad, y + 1, { size, weight, color, alpha: a, spacing }); return w;   // white underneath: tinted labels never show the grid
}
function sheet(x, y, w, h, rot = 0, a = 1, lines = 5) {
  if (a <= 0) return; ctx.save(); ctx.globalAlpha *= a; ctx.translate(x, y); ctx.rotate(rot);
  ctx.shadowColor = 'rgba(24,38,74,.12)'; ctx.shadowBlur = 12; ctx.shadowOffsetY = 5; ctx.fillStyle = '#FFFFFF'; ctx.fillRect(-w / 2, -h / 2, w, h); ctx.shadowColor = 'transparent';
  ctx.strokeStyle = LINE; ctx.lineWidth = 2; ctx.strokeRect(-w / 2, -h / 2, w, h);
  ctx.strokeStyle = BAR; ctx.lineWidth = 4; for (let i = 0; i < lines; i++) { const yy = -h / 2 + h * .2 + i * h * .7 / lines; ctx.beginPath(); ctx.moveTo(-w / 2 + w * .14, yy); ctx.lineTo(w / 2 - w * (i % 2 ? .3 : .14), yy); ctx.stroke(); }
  ctx.restore();
}

// ---------- page furniture ----------
function paper(cam) {
  ctx.fillStyle = K.paper; ctx.fillRect(0, 0, W, H);
  const minor = ((cam % 40) + 40) % 40, major = ((cam % 200) + 200) % 200;
  [[40, minor, K.grid], [200, major, K.gridMajor]].forEach(([step, off, col]) => {
    ctx.lineWidth = 1; ctx.strokeStyle = col; ctx.beginPath();
    for (let x = -off; x <= W; x += step) { ctx.moveTo(Math.round(x) + .5, 0); ctx.lineTo(Math.round(x) + .5, H); }
    for (let y = 0; y <= H; y += step) { ctx.moveTo(0, y + .5); ctx.lineTo(W, y + .5); }
    ctx.stroke();
  });
}
function pageFurniture(i) {
  ctx.save(); ctx.strokeStyle = K.margin; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(150, 0); ctx.lineTo(150, H); ctx.stroke(); ctx.restore();
  text(`p. ${i + 1}`, 1800, 92, { size: 26, weight: 700, fam: HAND, color: K.muted, align: 'right' });
}
// section tab + title (top-left). Slides in once, then stays still
function header(t, t0, tab, title, col = K.red) {
  const k1 = eOut(p(t, t0, .5)), k2 = eOut(p(t, t0 + .15, .6));
  if (k1 > 0) { ctx.save(); ctx.translate((1 - k1) * -30, 0); chip(tab, 210, 92, { size: 18, fill: col, a: k1, spacing: 2.5 }); ctx.restore(); }
  if (k2 > 0) { ctx.save(); ctx.translate((1 - k2) * -30, 0); text(title, 210, 160, { size: 56, weight: 700, alpha: k2, maxW: 1500 }); ctx.restore(); }
}
const H0 = id => S(id).start + .15;   // header time for a scene

// ============================================================
// scenes (absolute time t)
// ============================================================
const SC = {};

// 1. title — the title, and a diagnostic test being marked by the teacher's pen
SC.intro = t => {
  chip(C.title.kicker, 210, 262, { size: 18, fill: K.red, a: eOut(p(t, .4, .5)), spacing: 2.5 });
  hiLite(200, 334, measure(C.title.words[0], 104, 800) + 22, 78, p(t, 1.6, .7));
  C.title.words.forEach((w, i) => enter(t, .7 + i * .25, () => text(w, 210, 374 + i * 112, { size: 104, weight: 800, color: i === 0 ? K.red : K.ink, maxW: 960 })));
  enter(t, 1.8, () => text(C.title.sub, 214, 708, { size: 34, weight: 500, color: K.muted, maxW: 900 }));
  text(C.title.team, 214, 790, { size: 32, weight: 700, fam: HAND, color: K.red, alpha: p(t, 2.3, .5) });
  // test paper on the right
  enter(t, .6, () => {
    card(1260, 230, 480, 640, { r: 8 }); text('Diagnostic test', 1300, 290, { size: 30, weight: 700 }); line0(1300, 322, 1700, 322, LINE, 2);
    for (let i = 0; i < 6; i++) { const y = 372 + i * 68; text(`Q${i + 1}`, 1300, y, { size: 24, weight: 700, color: K.muted }); rr(1360, y - 6, 220 - (i % 3) * 40, 12, 6, BAR); }
  });
  [1, 1, 0, 1, 0, 1].forEach((ok, i) => { const y = 372 + i * 68, k = p(t, 2.2 + i * .35, .35); if (ok) check(1665, y, 40, k, K.red, 6); else crossMark(1665, y, 30, k, K.navy, 6); });
  // the result is a starting point, not a score: one line, centred, underlined by the pen
  const fw = measure('Find the starting point', 30, 700);
  text('Find the starting point', 1500, 818, { size: 30, weight: 700, align: 'center', alpha: p(t, 4.5, .5) });
  pen(1500 - fw / 2 - 6, 846, 1500 + fw / 2 + 6, 843, p(t, 5, .7), K.blue, 5, 5);
};

// 2. what — three steps of a diagnostic assessment
SC.what = t => {
  header(t, H0('what'), '01  ·  BACKGROUND', 'What is a diagnostic assessment?');
  const times = [st('l3', 0), st('l3', .28), st('l3', .62)];
  const lab = [['Before learning starts', 'take an assessment'], ["Find the learner's", 'current level'], ['Personalized program']], head = ['ASSESS', 'DIAGNOSE', 'PRESCRIBE'], cols = [K.red, K.blue, K.mint], heads = [K.red, K.blue, K.mintDark];
  times.forEach((t0, i) => {
    const x = 210 + i * 560;
    enter(t, t0, () => {
      card(x, 300, 480, 470);
      circle(x + 60, 360, 30, cols[i]); text(String(i + 1), x + 60, 362, { size: 32, weight: 700, color: '#FFFFFF', align: 'center' });
      text(head[i], x + 110, 362, { size: 26, weight: 800, color: heads[i], spacing: 3 });
      lab[i].forEach((s, j) => text(s, x + 40, 650 + j * 44, { size: 32, weight: 700, maxW: 400 }));
      if (i === 0) { sheet(x + 240, 510, 150, 180, -.04); }
      if (i === 1) { [3, 5, 7, 9].forEach((h, j) => rr(x + 150 + j * 50, 600 - h * 18, 34, h * 18, [6, 6, 0, 0], j === 2 ? K.blue : K.blueSoft)); }
      if (i === 2) { rr(x + 160, 420, 160, 190, 8, '#FFFFFF', K.mint, 3); for (let j = 0; j < 3; j++) { rr(x + 182, 452 + j * 50, 24, 24, 4, null, K.mint, 3); line0(x + 222, 464 + j * 50, x + 296, 464 + j * 50, BAR, 5); } }
    });
    if (i === 1) penCircle(x + 317, 438, 34, 34, p(t, t0 + .6, .5), K.red, 4, 11);
    if (i === 2) [0, 1, 2].forEach(j => check(x + 194, 464 + j * 50, 26, p(t, t0 + .5 + j * .2, .3), K.mint, 5));
    if (i) penArrow(x - 70, 535, x - 12, 535, p(t, t0 - .2, .4), K.ink, 4, 12 + i);
  });
};

// 3. problem — a pile of 91 identical questions; accuracy ↑ (light red) BUT burden ↑ (red), effectiveness ↓ (navy)
function meter(x, y, h, v, col, label, sub, a, up) {
  if (a <= 0) return; ctx.save(); ctx.globalAlpha *= a;
  rr(x - 44, y - h, 88, h, 12, '#FFFFFF', LINE, 2); rr(x - 32, y - 12 - (h - 24) * v, 64, (h - 24) * v, 8, col);
  text(label, x, y + 40, { size: 28, weight: 700, align: 'center', maxW: 240 }); text(sub, x, y + 76, { size: 21, weight: 500, color: K.muted, align: 'center', maxW: 250 });
  text(up ? '↑' : '↓', x + 72, y - 12 - (h - 24) * v, { size: 44, weight: 800, color: col, align: 'center' });
  ctx.restore();
}
SC.problem = t => {
  header(t, H0('problem'), '01  ·  BACKGROUND', 'The problem today');
  text('Every learner answers the same set of questions', 210, 232, { size: 28, weight: 500, color: K.muted, alpha: p(t, H0('problem') + .4, .5) });
  const pk = p(t, st('l4', .1), 4.5), n = Math.floor(pk * 14);
  for (let i = 0; i < n; i++) { const drop = eOut(clamp((pk * 14 - i) * 1.5)); sheet(520 + nz(i, 3) * 30, 830 - i * 26 - (1 - drop) * 160, 300, 64, nz(i, 5) * .08, clamp(drop * 2), 2); }
  const cnt = Math.round(lerp(1, 91, eOut(pk)));
  text(`${cnt} questions`, 520, 330, { size: 56, weight: 800, align: 'center', alpha: p(t, st('l4', .1), .4) });
  text('for every learner', 520, 384, { size: 30, weight: 700, fam: HAND, color: K.red, align: 'center', alpha: p(t, st('l4', .3), .4) });
  const accV = eOut(p(t, st('l5', .05), 1.2)) * .78, burV = eOut(p(t, st('l5', .5), 1.4)) * .95, effV = lerp(.7, .22, eOut(p(t, st('l6', .1), 1.6)));
  meter(1060, 760, 380, accV, K.redLight, 'Accuracy', 'more questions help', p(t, st('l5', 0), .5), true);
  meter(1360, 760, 380, burV, K.red, 'Burden', 'on learners', p(t, st('l5', .45), .5), true);

// 8. path — the 1–9 ladder. Each answer narrows the range: a wrong answer also rules out every harder rung, a right answer
// every easier one, so those rungs are marked without being asked ("no need to ask"). Asked rungs land on the spoken
// numbers (TL.cues.pathDown / pathUp, the same times as the sound effects). When the correct case starts the ladder is
// wiped back to its starting state.
const RX = 640, RY = i => 880 - (i - 1) * 72;
function steps(id, a, b) { const l = L(id); return [0, 1, 2].map(k => lerp(l.start + a, l.end - b, k / 2)); }   // fallback without cues
const moveWin = (ready, cue) => { const m0 = Math.max(ready, cue - .75); return [m0, Math.max(.35, cue - .05 - m0)]; };   // pencil mark arrives on the cue
SC.path = t => {
  const dn = CUE.pathDown || steps('l15', .6, .8), up = CUE.pathUp || steps('l16', 1.2, .8);
  const upT = st('l16', 0) - .2, caseUp = t > upT, clear = 1 - p(t, upT - .45, .4), sum = eOut(p(t, st('l17', .3), .8));
  header(t, H0('path'), '03  ·  OPERATING PRINCIPLE', 'Each answer narrows the range');
  ctx.save(); ctx.translate(sum * -200, 0);
  pen(RX, RY(1) + 30, RX, RY(9) - 30, 1, rgba(K.ink, .35), 5, 90);
  // sequential sweep 1 → 9 that gets crossed out; the ✗ stays until the orb takes its place at No. 5
  const sw = p(t, st('l14', .05), st('l14', .4) - st('l14', .05)), swOut = p(t, st('l14', .7), .5);
  if (sw > 0 && swOut < 1) { pen(RX - 70, RY(1), RX - 70, lerp(RY(1), RY(9), sw), sw, rgba(K.muted, .9 * (1 - swOut)), 4, 91, 1, [10, 10]); text('1 → 9 in order?', RX - 250, RY(5), { size: 30, weight: 700, fam: HAND, color: K.muted, align: 'center', alpha: (1 - swOut) * p(t, st('l14', .1), .3) }); crossMark(RX - 250, RY(5) + 56, 44, p(t, st('l14', .4), .4), rgba(K.red, 1 - swOut), 7); }
  // asked rungs (with a label) and the rungs they rule out (pen mark only)
  const c = caseUp ? up : dn, iCol = caseUp ? K.red : K.navy, a = caseUp ? 1 : clear;
  const asked = caseUp ? [[5, 'o'], [7, 'o'], [9, 'x']] : [[5, 'x'], [3, 'x'], [1, 'o']];
  const ruled = caseUp ? [[4, 3, 2, 1], [6]] : [[6, 7, 8, 9], [4]];
  const S = {}, I = {};
  asked.forEach(([i, s], j) => { if (t > c[j]) S[i] = s; }); if (t > c[2]) S[caseUp ? 8 : 2] = 'need';
  ruled.forEach((g, j) => g.forEach((i, m) => { I[i] = c[j] + (j ? .3 : .5) + m * .12; }));
  for (let i = 1; i <= 9; i++) {
    const k = eBack(p(t, st('l14', .02) + i * .05, .4)), rep = i % 2 === 1, y = RY(i); if (k <= 0) continue;
    const s = S[i], ik = !s && I[i] !== undefined ? p(t, I[i], .3) : 0, on = s || ik > 0;
    const col = s === 'o' ? K.red : s === 'x' ? K.navy : s === 'need' ? K.mint : ik > 0 ? iCol : rep ? K.ink : K.muted;
    const lab = { o: 'correct', x: 'incorrect', need: 'check this one' }[s];
    // solid white under every circle and label, so the rail and the grid never show through
    circle(RX, y, (rep ? 26 : 18) * k + 2, '#FFFFFF');
    if (lab) { const w = measure(lab, 20, 700) + 1.5 * lab.length + 28; rr(RX + 84, y - 18, w, 36, 18, '#FFFFFF', null, 0, a); }
    ctx.save(); ctx.globalAlpha *= on ? a : 1;
    circle(RX, y, (rep ? 26 : 18) * k, s ? rgba(col, .15) : ik > 0 ? rgba(col, .08) : '#FFFFFF', col, rep ? 4 : 3);
    text(String(i), RX, y + 1, { size: rep ? 26 : 20, weight: 800, color: col, align: 'center', alpha: k });
    if (s === 'o') check(RX + 52, y, 30, 1, K.red, 5); if (s === 'x') crossMark(RX + 52, y, 22, 1, K.navy, 5);
    if (ik > 0) { if (caseUp) check(RX + 52, y, 26, ik, iCol, 4); else crossMark(RX + 52, y, 20, ik, iCol, 4); }
    if (lab) chip(lab, RX + 84, y, { size: 20, fill: { o: K.redSoft, x: K.navySoft, need: K.mintSoft }[s], color: { o: K.crimson, x: K.navy, need: K.mintDark }[s], pad: 14 });
    ctx.restore();
  }
  // "no need to ask" next to the first group of ruled-out rungs
  const g = ruled[0], nk = p(t, I[g[0]], .4) * (caseUp ? 1 - sum : clear);
  if (nk > 0) { const yA = RY(Math.min(...g)) + 14, yB = RY(Math.max(...g)) - 14, bx = RX + 84;
    strokePts([[bx, yA], [bx + 12, yA], [bx + 12, yB], [bx, yB]], 1, iCol, 3, nk); text('no need to ask', bx + 32, (yA + yB) / 2, { size: 28, weight: 700, fam: HAND, color: iCol, alpha: nk }); }
  // the learner's pencil mark moves rung to rung along a pen arrow, after the ruled-out rungs are marked
  const hops = caseUp ? [[5, 7, c[1], I[1]], [7, 9, c[2], I[6]]] : [[5, 3, c[1], I[9]], [3, 1, c[2], I[4]]];
  const startT = st('l14', .65); let pos = 5;
  hops.forEach(([from, to, cue, ready]) => {
    const [m0, d] = moveWin(ready + .35, cue), k = p(t, m0, d); if (k <= 0) return;
    pos = lerp(from, to, eIO(k));
    penCurve(RX - 100, RY(from), RX - 180, (RY(from) + RY(to)) / 2, RX - 100, RY(to), k, K.grey, 4, a, true);
  });
  const last = caseUp ? [9, 8] : [1, 2], lk = eIO(p(t, c[2] + .45, .5)); if (lk > 0) pos = lerp(last[0], last[1], lk);
  const orbA = p(t, startT, .3) * (caseUp ? p(t, upT, .3) : clear);
  if (t > startT) circle(RX - 70, lerp(RY(1), RY(9), (pos - 1) / 8), 15, K.red, null, 0, orbA);
  if (t > startT && t < dn[0]) { const ka = p(t, startT, .4); text('start: a representative core question', RX + 84, RY(5) - 64, { size: 28, weight: 700, fam: HAND, color: K.red, alpha: ka }); }
  // brackets appear with the result cue and fade out only when the summary comes in
  const bracket = (a, b, label, bk) => { if (bk <= 0) return; const yA = RY(a), yB = RY(b), bx = RX + 330; strokePts([[bx - 14, yA], [bx, yA], [bx, yB], [bx - 14, yB]], 1, K.red, 4, bk); text(label, bx + 24, (yA + yB) / 2, { size: 28, weight: 700, color: K.red, alpha: bk, maxW: 560 }); };
  if (!caseUp) bracket(1, 2, 'where the learning gap begins', eOut(p(t, dn[2], .4)) * clear);
  else bracket(8, 9, 'how far understanding reaches', eOut(p(t, up[2], .4)) * (1 - sum));
  ctx.restore();
  // case caption (kept clear of the bracket: top when incorrect, lower when correct)

    const a = (caseUp ? p(t, st('l16', 0), .5) : p(t, st('l15', 0), .5)) * (1 - sum), col = caseUp ? K.red : K.navy, py = caseUp ? 560 : 300;
    card(1180, py, 600, 230, { a, stroke: K.ink }); text(caseUp ? 'If the learner answers correctly' : 'If the learner answers incorrectly', 1480, py + 62, { size: 30, weight: 800, align: 'center', alpha: a, maxW: 540 });
    text(caseUp ? '5  →  7  →  9' : '5  →  3  →  1', 1480, py + 136, { size: 48, weight: 800, color: col, align: 'center', alpha: a }); text(caseUp ? 'probe higher achievement' : 'probe underlying gaps', 1480, py + 190, { size: 24, weight: 500, color: K.muted, align: 'center', alpha: a });
  }
  if (sum > 0) { card(1100, 360, 700, 400, { a: sum });
    enter(t, st('l17', .35), () => text('Fewer questions.', 1450, 480, { size: 56, weight: 800, align: 'center' }));
    enter(t, st('l17', .6), () => text('Precise ability level.', 1450, 580, { size: 56, weight: 800, color: K.red, align: 'center', maxW: 640 }));
    pen(1190, 622, 1710, 618, p(t, st('l17', .7), .5), K.blue, 5, 95);
    text('representative items: 1, 3, 5, 7, 9', 1450, 690, { size: 24, weight: 500, color: K.muted, align: 'center', alpha: p(t, st('l17', .75), .5) }); }

  const restT = st('l24', .82), kRest = eIO(p(t, restT, 1));   // after the consultation: the rest of the ring fills in
  if (k0 > 0) {
    ctx.save(); ctx.globalAlpha *= k0; ctx.lineCap = 'round'; ctx.lineWidth = 34; ctx.strokeStyle = K.grey; ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI * 2); ctx.stroke();
    const a0 = -Math.PI / 2, a1 = a0 + Math.PI * 2 * seg;
    if (kRest > 0) { ctx.strokeStyle = K.blue; ctx.beginPath(); ctx.arc(cx, cy, R, a1, a1 + Math.PI * 2 * (1 - seg) * kRest); ctx.stroke(); }
    ctx.strokeStyle = K.red; ctx.beginPath(); ctx.arc(cx, cy, R, a0, a0 + Math.PI * 2 * seg * kNum); ctx.stroke();
    ctx.restore();
    text('Numbers &', cx, cy - 30, { size: 40, weight: 800, align: 'center', alpha: k0 }); text('Operations', cx, cy + 20, { size: 40, weight: 800, align: 'center', alpha: k0 });
    text('diagnosed first', cx, cy + 74, { size: 28, weight: 700, fam: HAND, color: K.red, align: 'center', alpha: p(t, st('l23', .1), .5) });
    text('other areas continue…', cx + R - 10, cy + R + 30, { size: 34, weight: 700, color: K.blue, alpha: p(t, restT + .9, .5) });
  }
  const rk = eOut(p(t, st('l23', .7), .7));
  if (rk > 0) { const x = lerp(1900, 1080, rk); card(x, 290, 680, 320, { r: 8 }); chip('QUICK REPORT', x + 40, 340, { size: 18, fill: K.red, spacing: 2 }); text('Numbers & Operations', x + 40, 402, { size: 32, weight: 800, maxW: 600 });
    [['Number sense', .82], ['Addition & subtraction', .64], ['Multiplication', .41]].forEach(([n, v], i) => { const y = 462 + i * 46; text(n, x + 40, y, { size: 21, weight: 600, color: K.muted, maxW: 260 }); rr(x + 330, y - 9, 300, 18, 9, BAR); rr(x + 330, y - 9, 300 * v * eOut(p(t, st('l23', .85) + i * .2, .8)), 18, 9, K.red); }); }
  // the consultation, under the report: tails point up-left at it
  [[1040, 712, 'How well does this learner know Numbers & Operations?', K.box], [1180, 832, "Let's plan the next steps.", K.redSoft]].forEach(([x, y, s, col], i) => { const k = eBack(p(t, st('l24', .35) + i * .6, .5)); if (k <= 0) return;
    ctx.save(); ctx.translate(x, y); ctx.scale(k, k); const w = measure(s, 28, 600) + 60; bubble(w, col); text(s, w / 2, 0, { size: 28, weight: 600, align: 'center' }); ctx.restore(); });
};

// pill-shaped speech bubble (0..w, -36..36) with its tail cut into the top edge near the left, pointing up-right: one filled shape, so the tail joins cleanly
function bubble(w, fill) {
  const r = 36, y0 = -36;
  ctx.save(); ctx.beginPath(); ctx.moveTo(r, y0); ctx.lineTo(42, y0); ctx.lineTo(88, y0 - 24); ctx.lineTo(70, y0); ctx.lineTo(w - r, y0); ctx.arc(w - r, 0, r, -Math.PI / 2, Math.PI / 2);
  ctx.lineTo(r, -y0); ctx.arc(r, 0, r, Math.PI / 2, Math.PI * 3 / 2); ctx.closePath();
  ctx.fillStyle = '#FFFFFF'; ctx.fill(); ctx.fillStyle = fill; ctx.fill(); ctx.restore();   // white underneath: the grid never shows through
}

// 11. effects — 91 → 40 questions, workload ↓ / smoother running ↑, then other subjects
SC.effects = t => {
  header(t, H0('effects'), '05  ·  EXPECTED EFFECTS', 'What changes in practice');
  const hubOn = p(t, st('l29', 0), .6), A = 1 - hubOn;
  if (A > 0) {
    ctx.save(); ctx.globalAlpha *= A;
    const ck = p(t, st('l26', .55), 1.6), n = Math.round(lerp(91, 40, eOut(ck))), k0 = p(t, st('l26', 0), .5);
    text('Currently → With Adaptive (example)', 210, 262, { size: 24, weight: 600, color: K.muted, alpha: k0 });
    card(210, 290, 640, 520, { a: k0 });
    text('questions to answer', 530, 360, { size: 30, weight: 600, color: K.muted, align: 'center', alpha: k0 });
    text(String(n), 530, 520, { size: 210, weight: 800, color: n === 40 ? K.red : K.ink, align: 'center', alpha: k0 });
    text('Q1  ~  Q91', 530, 690, { size: 30, weight: 600, color: K.muted, align: 'center', alpha: p(t, st('l26', .1), .5) });
    // once the count stops at 40: 51 (ink) skipped (grey)
    enter(t, st('l26', .55) + 1.6, () => { const a = '51', b = ' skipped', w = measure(a, 36, 800) + measure(b, 32, 700), x = 530 - w / 2;
      text(a, x, 752, { size: 36, weight: 800, color: K.ink }); text(b, x + measure(a, 36, 800), 752, { size: 32, weight: 700, color: K.muted }); }, { d: .5, dy: 14, ox: 530, oy: 752 });
    const bar = (y, label, sub, v, col, track, upA, a) => { if (a <= 0) return; text(label, 960, y - 44, { size: 34, weight: 800, alpha: a }); text(sub, 960, y - 6, { size: 22, weight: 500, color: K.muted, alpha: a }); rr(960, y + 26, 680, 34, 17, track, null, 0, a); rr(960, y + 26, 680 * v, 34, 17, col, null, 0, a); text(upA ? '↑' : '↓', 1690, y + 42, { size: 44, weight: 800, color: col, align: 'center', alpha: a }); };
    bar(420, 'Workload', 'for learners & teachers', lerp(.9, .35, eOut(p(t, st('l27', .25), 1.5))), K.navy, K.navySoft, false, p(t, st('l27', .05), .5));
    bar(640, 'Smoother running', 'consultations & class operations', lerp(.4, .92, eOut(p(t, st('l28', .2), 1.5))), K.red, K.redSoft, true, p(t, st('l28', .05), .5));
    ctx.restore();
  }
  if (hubOn > 0) {
    const cx = 960, cy = 560, k = eOut(hubOn);
    for (let i = 0; i < 5; i++) { const a = Math.PI / 2 + (i - 2) * .55, kk = p(t, st('l29', .45) + i * .15, .6); if (kk <= 0) continue; const x = cx + Math.cos(a) * 470, y = cy - Math.sin(a) * 280;
      pen(cx, cy, lerp(cx, x, eOut(kk)), lerp(cy, y, eOut(kk)), 1, K.grey, 3, 130 + i, 1, [12, 10]); circle(x, y, 50 * eBack(kk), '#FFFFFF', K.grey, 3); text('+', x, y + inkDy('+', 46, 700), { size: 46, weight: 700, color: K.muted, align: 'center', alpha: kk }); }
    circle(cx, cy, 130 * eBack(hubOn), K.red);
    text('Self-Learning', cx, cy - 24, { size: 28, weight: 700, color: '#FFFFFF', align: 'center', alpha: k }); text('JEI Math', cx, cy + 20, { size: 38, weight: 800, color: '#FFFFFF', align: 'center', alpha: k });
    text('applied first', cx, cy + 180, { size: 32, weight: 700, fam: HAND, color: K.muted, align: 'center', alpha: k });
    text('then scalable to other subjects', cx, 860, { size: 34, weight: 700, color: K.red, align: 'center', alpha: p(t, st('l29', .5), .6) });
  }
};

// 12. outro
SC.outro = t => {
  enter(t, st('l30', .1), () => text(C.title.words.join(' '), 960, 330, { size: 44, weight: 700, color: K.red, align: 'center', maxW: 1400 }));

// ============================================================
// compositor: slide between pages (with the whoosh), then hold still
// ============================================================
const TR = .8;
function frame(i, t, ox) {
  if (Math.abs(ox) >= W) return; const s = TL.scenes[i];
  ctx.save(); ctx.translate(Math.round(ox), 0); pageFurniture(i); SC[s.id](t); ctx.restore();
}
function draw(t) {
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1;
  const SCN = TL.scenes; let i = SCN.findIndex(s => t < s.end); if (i < 0) i = SCN.length - 1;
  const k = i > 0 ? eIO(p(t, SCN[i].start - .15, TR)) : 1;
  paper(i > 0 ? Math.round((i - 1 + k) * W) : 0);
  if (k < 1) frame(i - 1, t, -k * W);
  frame(i, t, (1 - k) * W);
  const f = p(t, DURATION - 1.2, 1.2); if (f > 0) { ctx.fillStyle = rgba(K.paper, eIO(f)); ctx.fillRect(0, 0, W, H); }
}

// ---------- preview player ----------
const seekEl = document.getElementById('seek'), timeEl = document.getElementById('time'), playEl = document.getElementById('play');
seekEl.max = DURATION.toFixed(2);
let playing = false, t0 = 0, tCur = 0;
const audio = new Audio('audio/mix.wav'); audio.preload = 'auto';
function show(t) { tCur = t; draw(t); seekEl.value = t; timeEl.textContent = t.toFixed(2) + 's'; }
function loop(now) { if (!playing) return; const t = (now - t0) / 1000; if (t >= DURATION) { playing = false; playEl.textContent = '▶ Play'; audio.pause(); show(DURATION); return; } show(t); requestAnimationFrame(loop); }
playEl.onclick = () => { playing = !playing; playEl.textContent = playing ? '❚❚ Pause' : '▶ Play'; if (playing) { if (tCur >= DURATION) tCur = 0; t0 = performance.now() - tCur * 1000; try { audio.currentTime = tCur; audio.play().catch(() => {}); } catch (e) {} requestAnimationFrame(loop); } else audio.pause(); };
seekEl.oninput = () => { show(+seekEl.value); if (playing) { t0 = performance.now() - tCur * 1000; try { audio.currentTime = tCur; } catch (e) {} } };

window.draw = draw; window.DURATION = DURATION;
function merge(base, over) {
  if (Array.isArray(base)) return Array.isArray(over) ? over.map((v, i) => base[i] !== undefined ? merge(base[i], v) : v) : base;
  if (base && typeof base === 'object') { const o = {}; for (const k in base) o[k] = over && k in over ? merge(base[k], over[k]) : base[k]; return o; }
  return over === undefined || over === null ? base : over;
}
function apply(content) { C = window.CONTENT = merge(DEFAULT_CONTENT, content); K = C.colors; }
window.VIDEO = { schema: window.SCHEMA, defaults: DEFAULT_CONTENT, get content() { return C; }, apply, canvas: cv };
window.ready = document.fonts.load(`700 100px 'Noto Sans KR'`, 'Aa').then(r => {
  if (!r.length) throw new Error('font failed to load (check fonts/)');
}).then(() => document.fonts.ready).then(() => { if (location.search.includes('render')) document.body.classList.add('render'); show(0); return true; });
