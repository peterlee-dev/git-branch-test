<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Adaptive Diagnostic Assessment v2</title>
<style>
  @font-face { font-family: 'Noto Sans KR'; src: url('fonts/NotoSansKR.ttf') format('truetype'); font-weight: 100 900; font-display: block; }
  html, body { margin: 0; background: #05091a; }
  body { display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 12px; font-family: 'Noto Sans KR', sans-serif; color: #ddd; }
  canvas { width: min(100%, 1280px); aspect-ratio: 16 / 9; display: block; background: #0A1330; }
  .bar { display: flex; gap: 12px; align-items: center; width: min(100%, 1280px); }
  .bar input { flex: 1; }
  body.render { padding: 0; gap: 0; }
  body.render canvas { width: 1920px; height: 1080px; }
  body.render .bar { display: none; }
</style>
</head>
<body>
<script src="timeline.js"></script>
<script src="content.js"></script>
<script src="schema.js"></script>
<canvas id="c" width="1920" height="1080"></canvas>
<div class="bar">
  <button id="play">▶ Play</button>
  <input id="seek" type="range" min="0" max="300" step="0.01" value="0">
  <span id="time">0.00s</span>
</div>
<script>
// ------------------------------------------------------------
// Adaptive Diagnostic Assessment — v2: a fresh visual take on the same narration.
// Dark "night-sky" canvas, a glowing orb = the learner, kinetic headlines, and one recurring visual metaphor:
// a vertical DIFFICULTY LADDER the orb climbs (correct) or steps down (incorrect).
// Timing: timeline.js (same narration/timing as ../adaptive-diagnosis). draw(t) is a pure function of time.
// Layout rule: every label is measured (measure / fitText / pill) so text never spills out of its box.
// ------------------------------------------------------------
const W = 1920, H = 1080, TL = window.TL, DURATION = TL.duration;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const DEFAULT_CONTENT = JSON.parse(JSON.stringify(window.CONTENT));
let C = window.CONTENT, K = C.colors;
const FONT = "'Noto Sans KR', sans-serif";

// ---------- basics ----------
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;
const p = (t, s, d) => clamp((t - s) / d);
const eOut = x => 1 - Math.pow(1 - x, 3), eIO = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const eBack = x => { const c1 = 1.7, c3 = c1 + 1; return x <= 0 ? 0 : 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
function rng(seed) { return () => (seed = (seed * 16807) % 2147483647) / 2147483647; }
function rgba(hex, a) { const n = parseInt(hex.slice(1), 16); return `rgba(${n >> 16 & 255},${n >> 8 & 255},${n & 255},${a})`; }
const L = id => TL.lines[id] || { start: 0, end: 0 };
const S = id => TL.scenes.find(s => s.id === id) || { start: 0, end: 0 };
const st = (id, f = 0) => L(id).start + (L(id).end - L(id).start) * f;   // f: 0 = start of the narration line, 1 = end
const en = (id, d = 0) => L(id).end + d;
function rr(x, y, w, h, r, fill, stroke, lw = 2, a = 1) { if (a <= 0) return; ctx.save(); ctx.globalAlpha *= a; ctx.beginPath(); ctx.roundRect(x, y, w, h, r); if (fill) { ctx.fillStyle = fill; ctx.fill(); } if (stroke) { ctx.lineWidth = lw; ctx.strokeStyle = stroke; ctx.stroke(); } ctx.restore(); }
function circ(x, y, r, fill, stroke, lw = 3, a = 1) { if (a <= 0 || r <= 0) return; ctx.save(); ctx.globalAlpha *= a; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); if (fill) { ctx.fillStyle = fill; ctx.fill(); } if (stroke) { ctx.lineWidth = lw; ctx.strokeStyle = stroke; ctx.stroke(); } ctx.restore(); }
function line(x1, y1, x2, y2, c, lw = 3, a = 1, dash) { if (a <= 0) return; ctx.save(); ctx.globalAlpha *= a; ctx.strokeStyle = c; ctx.lineWidth = lw; ctx.lineCap = 'round'; if (dash) ctx.setLineDash(dash); ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke(); ctx.restore(); }
function measure(str, size, weight = 600) { ctx.save(); ctx.font = `${weight} ${size}px ${FONT}`; const w = ctx.measureText(str).width; ctx.restore(); return w; }
function text(str, x, y, { size = 40, color = K.ink, weight = 500, align = 'center', alpha = 1, maxW, spacing = 0 } = {}) {
  if (alpha <= 0 || !str) return; ctx.save(); ctx.globalAlpha *= alpha;
  let sz = size; if (maxW) { const w = measure(str, size, weight) + spacing * str.length; if (w > maxW) sz = size * maxW / w; }
  ctx.font = `${weight} ${sz}px ${FONT}`; ctx.textAlign = align; ctx.textBaseline = 'middle'; ctx.fillStyle = color;
  if (spacing) ctx.letterSpacing = spacing * sz / size + 'px';
  ctx.fillText(str, x, y); ctx.restore();
}
// pill: rounded label whose width follows its text
function pill(str, x, y, size, fill, color, { pad = 28, weight = 700, stroke, alpha = 1 } = {}) { const w = measure(str, size, weight) + pad * 2, h = size * 1.9; rr(x - w / 2, y - h / 2, w, h, h / 2, fill, stroke, 2, alpha); text(str, x, y + 1, { size, color, weight, alpha }); return w; }
function glow(x, y, r, col, a = 1) { if (a <= 0 || r <= 0) return; const g = ctx.createRadialGradient(x, y, 0, x, y, r); g.addColorStop(0, rgba(col, .55 * a)); g.addColorStop(.4, rgba(col, .18 * a)); g.addColorStop(1, rgba(col, 0)); ctx.fillStyle = g; ctx.fillRect(x - r, y - r, r * 2, r * 2); }
function orb(x, y, r, t, col = K.cyan, a = 1) { glow(x, y, r * 4, col, a); circ(x, y, r, '#FFFFFF', null, 0, a); circ(x, y, r * 1.5 + Math.sin(t * 4) * 2, null, rgba(col, .7), 3, a); }
function check(x, y, s, c, k = 1, lw = 7) { if (k <= 0) return; ctx.save(); ctx.strokeStyle = c; ctx.lineWidth = lw; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.beginPath(); const P = [[-.5, 0], [-.15, .35], [.55, -.4]]; ctx.moveTo(x + P[0][0] * s, y + P[0][1] * s); const k1 = clamp(k * 2), k2 = clamp(k * 2 - 1); ctx.lineTo(x + lerp(P[0][0], P[1][0], k1) * s, y + lerp(P[0][1], P[1][1], k1) * s); if (k2 > 0) ctx.lineTo(x + lerp(P[1][0], P[2][0], k2) * s, y + lerp(P[1][1], P[2][1], k2) * s); ctx.stroke(); ctx.restore(); }
function cross(x, y, s, c, k = 1, lw = 7) { if (k <= 0) return; const k1 = clamp(k * 2), k2 = clamp(k * 2 - 1); line(x - s / 2, y - s / 2, x - s / 2 + s * k1, y - s / 2 + s * k1, c, lw); if (k2 > 0) line(x + s / 2, y - s / 2, x + s / 2 - s * k2, y - s / 2 + s * k2, c, lw); }
function arrowHead(x, y, ang, s, c) { ctx.save(); ctx.translate(x, y); ctx.rotate(ang); ctx.fillStyle = c; ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(-s, -s * .6); ctx.lineTo(-s, s * .6); ctx.closePath(); ctx.fill(); ctx.restore(); }
function upDown(x, y, up, c, s = 1, a = 1) { if (a <= 0) return; ctx.save(); ctx.globalAlpha *= a; ctx.translate(x, y); ctx.scale(s, up ? -s : s); ctx.fillStyle = c; ctx.beginPath(); ctx.moveTo(-8, -20); ctx.lineTo(8, -20); ctx.lineTo(8, 2); ctx.lineTo(18, 2); ctx.lineTo(0, 22); ctx.lineTo(-18, 2); ctx.lineTo(-8, 2); ctx.closePath(); ctx.fill(); ctx.restore(); }
// card: glassy panel
function panel(x, y, w, h, a = 1, accent) { if (a <= 0) return; rr(x, y, w, h, 22, rgba(K.card, .82), rgba(accent || K.cardLine, accent ? .9 : 1), 2, a); }

// ---------- backdrop: night gradient, dot grid, drifting particles ----------
function backdrop(t, tint = K.blue) {
  const g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, K.bg1); g.addColorStop(1, K.bg2); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  glow(1500, 180, 700, tint, .35); glow(300, 950, 600, K.cyan, .18);
  ctx.save(); ctx.fillStyle = 'rgba(160,190,255,.10)'; for (let x = 60; x < W; x += 60) for (let y = 60; y < H; y += 60) ctx.fillRect(x - 1, y - 1, 2, 2); ctx.restore();
  const r = rng(7); for (let i = 0; i < 46; i++) { const x = (r() * W + t * (8 + r() * 14)) % W, y = (r() * H - t * (4 + r() * 6) % H + H) % H, s = 1 + r() * 2.2; circ(x, y, s, 'rgba(200,220,255,.55)', null, 0, .3 + .5 * Math.abs(Math.sin(t * .7 + i))); }
}
// section chip + headline (top-left), slides in
function headline(t, t0, chip, title, sub) {
  const k = eOut(p(t, t0, .7)); if (k <= 0) return;
  ctx.save(); ctx.globalAlpha *= k; ctx.translate((1 - k) * -40, 0);
  const w = measure(chip, 22, 700) + 40; rr(96, 72, w, 40, 20, rgba(K.blue, .18), rgba(K.blue, .6), 2); text(chip, 96 + w / 2, 93, { size: 22, color: K.cyan, weight: 700 });
  text(title, 96, 162, { size: 54, color: K.ink, weight: 800, align: 'left', maxW: 1700 });
  if (sub) text(sub, 98, 218, { size: 28, color: K.dim, weight: 400, align: 'left', maxW: 1700 });
  ctx.restore();
}
function withCam(z, cx, cy, fn) { ctx.save(); ctx.translate(cx, cy); ctx.scale(z, z); ctx.translate(-cx, -cy); fn(); ctx.restore(); }
function drift(t, s0) { return 1 + .025 * eIO(clamp((t - s0) / 16)); }
// kinetic word: rises from a mask line
function rise(str, x, y, t, t0, { size = 90, color = K.ink, weight = 800, align = 'center', maxW } = {}) {
  const k = p(t, t0, .6); if (k <= 0) return; const e = eOut(k);
  ctx.save(); ctx.beginPath(); ctx.rect(0, y - size * .75, W, size * 1.5); ctx.clip(); text(str, x, y + (1 - e) * size, { size, color, weight, align, maxW }); ctx.restore();
}

// ============================================================
// scenes
// ============================================================
// 1. title — particles converge into a ring, title words rise
function sIntro(t) {
  backdrop(t);
  const ring = eOut(p(t, .2, 2.4)), r = rng(3);
  for (let i = 0; i < 90; i++) { const a = i / 90 * Math.PI * 2 + t * .15, sx = r() * W, sy = r() * H, tx = 1440 + Math.cos(a) * 250, ty = 520 + Math.sin(a) * 250; circ(lerp(sx, tx, ring), lerp(sy, ty, ring), 2.6, i % 3 ? '#BFD4FF' : K.cyan, null, 0, .4 + .6 * ring); }
  glow(1440, 520, 380, K.blue, ring); orb(1440, 520, 26 * eBack(p(t, 1.6, .8)), t, K.cyan, ring);
  text(C.title.kicker, 140, 300, { size: 26, color: K.cyan, weight: 700, align: 'left', alpha: eOut(p(t, .6, .6)), spacing: 3, maxW: 900 });
  C.title.words.forEach((w, i) => rise(w, 136, 400 + i * 118, t, .9 + i * .3, { size: 112, color: i === 0 ? K.cyan : K.ink, weight: 800, align: 'left', maxW: 1050 }));
  text(C.title.sub, 140, 780, { size: 32, color: K.dim, weight: 400, align: 'left', alpha: eOut(p(t, 2.2, .6)), maxW: 1000 });
  line(140, 840, 140 + 420 * eOut(p(t, 2.5, .8)), 840, rgba(K.cyan, .8), 3);
  text(C.title.team, 140, 885, { size: 26, color: K.ink, weight: 500, align: 'left', alpha: eOut(p(t, 2.8, .6)) });
}
// 2. what — three stations on a path, the orb travels through them
function sWhat(t) {
  const s0 = S('what').start;
  withCam(drift(t, s0), 960, 560, () => {
    backdrop(t);
    headline(t, s0 + .1, '01 · BACKGROUND', 'What is a diagnostic assessment?');
    const xs = [420, 960, 1500], y = 560, times = [st('l3', 0), st('l3', .28), st('l3', .62)];
    const labs = [['Before learning', 'starts'], ["Find the learner's", 'current level'], ['Prescribe a', 'personalized program']];
    const head = ['ASSESS', 'DIAGNOSE', 'PRESCRIBE'];
    const pathK = eOut(p(t, times[0], times[2] - times[0] + .6));
    line(xs[0], y, xs[2], y, rgba(K.dim, .35), 6); line(xs[0], y, lerp(xs[0], xs[2], pathK), y, K.cyan, 6);
    xs.forEach((x, i) => {
      const k = eBack(p(t, times[i], .6)); if (k <= 0) return;
      glow(x, y, 200, i === 2 ? K.mint : K.blue, k * .8);
      circ(x, y, 92 * k, rgba(K.card, .95), i === 2 ? K.mint : K.blue, 5);
      text(String(i + 1), x, y - 6, { size: 66 * k, color: K.ink, weight: 800 });
      text(head[i], x, y + 150, { size: 30, color: i === 2 ? K.mint : K.cyan, weight: 800, alpha: k, spacing: 4 });
      labs[i].forEach((s, j) => text(s, x, y + 196 + j * 40, { size: 30, color: K.ink, weight: 500, alpha: k, maxW: 440 }));
    });
    const ox = lerp(xs[0], xs[2], pathK); if (pathK > 0) orb(ox, y - 130, 14, t);
    if (pathK > 0) line(ox, y - 112, ox, y - 96, rgba(K.cyan, .7), 3);
  });
}
// 3. problem — everyone gets the same 91 questions: meters for accuracy / burden / efficiency
function meter(x, y, h, v, col, label, sub, a, up) {
  if (a <= 0) return; ctx.save(); ctx.globalAlpha *= a;
  rr(x - 46, y - h, 92, h, 18, rgba(K.card, .9), K.cardLine, 2); rr(x - 34, y - 12 - (h - 24) * v, 68, (h - 24) * v, 12, col);
  glow(x, y - 12 - (h - 24) * v, 120, col, .6);
  text(label, x, y + 44, { size: 28, color: K.ink, weight: 700, maxW: 260 }); text(sub, x, y + 82, { size: 22, color: K.dim, weight: 400, maxW: 260 });
  if (up !== undefined) upDown(x + 80, y - 12 - (h - 24) * v, up, col, .9);
  ctx.restore();
}
function sProblem(t) {
  const s0 = S('problem').start;
  withCam(drift(t, s0), 960, 560, () => {
    backdrop(t, K.orange);
    headline(t, s0 + .1, '01 · BACKGROUND', 'The problem today', 'Every learner answers the same set of questions');
    // left: a tall stack of identical question tiles piling onto the learner orb
    const px = 520, py = 860, pk = p(t, st('l4', .1), 4.5), n = Math.floor(pk * 12);
    for (let i = 0; i < n; i++) { const yy = py - 40 - i * 30, drop = clamp((pk * 12 - i) * 1.5); rr(px - 110 + Math.sin(i * 1.7) * 10, yy - (1 - eOut(drop)) * 200, 220, 26, 8, i % 2 ? rgba(K.blue, .9) : rgba(K.cyan, .75)); }
    orb(px, py, 22, t, K.orange, eOut(p(t, s0 + .4, .5)));
    const cnt = Math.round(lerp(1, 91, eOut(pk)));
    text(cnt + ' questions', px, 300, { size: 48, color: K.ink, weight: 800, alpha: p(t, st('l4', .1), .4) });
    text('for every learner', px, 352, { size: 26, color: K.dim, weight: 400, alpha: p(t, st('l4', .1), .4) });
    // right: meters
    const accV = eOut(p(t, st('l5', .05), 1.2)) * .78, burV = eOut(p(t, st('l5', .5), 1.4)) * .95, effV = lerp(.7, .22, eOut(p(t, st('l6', .1), 1.6)));
    meter(1050, 760, 400, accV, K.blue, 'Accuracy', 'more questions help', p(t, st('l5', 0), .5), true);
    meter(1350, 760, 400, burV, K.orange, 'Burden', 'on learners', p(t, st('l5', .45), .5), true);
    meter(1650, 760, 400, effV, K.mint, 'Efficiency', 'finding the start point', p(t, st('l6', 0), .5), false);
    const bk = p(t, st('l5', .4), .4); if (bk > 0) pill('BUT', 1200, 330, 26, rgba(K.orange, .2), K.orange, { alpha: bk, stroke: K.orange });
  });
}
// 4. adaptive — branching tree grows in real time
function tree(t, t0, dur, x0, y0) {
  // binary tree: level 0 root; up = harder (correct), down = easier (incorrect). Chosen path: ✓ ✗ ✓
  const lv = [[[x0, y0]], [[x0 + 330, y0 - 170], [x0 + 330, y0 + 170]], [[x0 + 660, y0 - 260], [x0 + 660, y0 - 80], [x0 + 660, y0 + 80], [x0 + 660, y0 + 260]],
    [[x0 + 990, y0 - 300], [x0 + 990, y0 - 220], [x0 + 990, y0 - 120], [x0 + 990, y0 - 40], [x0 + 990, y0 + 40], [x0 + 990, y0 + 120], [x0 + 990, y0 + 220], [x0 + 990, y0 + 300]]];
  const path = [0, 0, 1, 2];   // indices of chosen nodes per level
  for (let l = 1; l < lv.length; l++) lv[l].forEach(([x, y], i) => {
    const [px, py] = lv[l - 1][Math.floor(i / 2)], k = eOut(p(t, t0 + dur * (l - 1) / 3, dur / 3)); if (k <= 0) return;
    const chosen = path[l] === i && path[l - 1] === Math.floor(i / 2), up = i % 2 === 0;
    const col = chosen ? (up ? K.blue : K.orange) : rgba(K.dim, .35);
    line(px, py, lerp(px, x, k), lerp(py, y, k), col, chosen ? 6 : 3);
    circ(x, y, (l === 3 ? 12 : 18) * k, chosen ? col : rgba(K.card, 1), chosen ? null : rgba(K.dim, .6), 3);
  });
  const qk = eBack(p(t, t0 - .4, .5)); if (qk <= 0) return; circ(x0, y0, 26 * qk, K.cyan); text('Q', x0, y0 + 1, { size: 26 * qk, color: K.bg1, weight: 800 });
  // the orb walks the chosen path
  const ok = clamp((t - t0) / dur * 3, 0, 3), li = Math.min(2, Math.floor(ok)), f = eIO(ok - li);
  const a = lv[li][path[li]], b = lv[li + 1][path[li + 1]];
  if (t > t0) orb(lerp(a[0], b[0], ok >= 3 ? 1 : f), lerp(a[1], b[1], ok >= 3 ? 1 : f), 12, t);
}
function sAdaptive(t) {
  const s0 = S('adaptive').start;
  withCam(drift(t, s0), 960, 560, () => {
    backdrop(t);
    headline(t, s0 + .1, '02 · THE NEW APPROACH', 'Adaptive Diagnostic Assessment');
    const kw = ['Responsive', 'High-precision', 'Real-time'];
    kw.forEach((w, i) => pill(w, 330 + i * 300, 300, 26, rgba(K.blue, .16), K.cyan, { alpha: eOut(p(t, st('l8', .02 + i * .1), .5)), stroke: rgba(K.cyan, .5) }));
    tree(t, st('l7', .35), (st('l8', .9) - st('l7', .35)), 300, 640);
    // legend
    const lk = p(t, st('l8', .3), .5);
    if (lk > 0) { panel(1430, 470, 400, 300, lk); line(1470, 545, 1530, 545, K.blue, 6, lk); text('Correct', 1550, 530, { size: 28, color: K.ink, weight: 700, align: 'left', alpha: lk }); text('→ harder question', 1550, 566, { size: 24, color: K.dim, weight: 400, align: 'left', alpha: lk });
      line(1470, 685, 1530, 685, K.orange, 6, lk); text('Incorrect', 1550, 670, { size: 28, color: K.ink, weight: 700, align: 'left', alpha: lk }); text('→ easier question', 1550, 706, { size: 24, color: K.dim, weight: 400, align: 'left', alpha: lk }); }
  });
}
// 5. necessary — 20 tiles scanned, only 5 remain
function sNecessary(t) {
  const s0 = S('necessary').start, keep = [3, 9, 12, 14, 16];
  withCam(drift(t, s0), 960, 560, () => {
    backdrop(t);
    headline(t, s0 + .1, '02 · THE NEW APPROACH', 'Only the questions that matter');
    const gx = 260, gy = 330, scan = p(t, st('l9', .15), 1.6), cut = p(t, st('l9', .5), .8);
    for (let i = 0; i < 20; i++) {
      const r = Math.floor(i / 5), c = i % 5, x = gx + c * 170, y = gy + r * 120, on = keep.includes(i + 1), k = eOut(p(t, s0 + .3 + i * .03, .4));
      const fade = on ? 1 : 1 - .82 * cut, lit = on && cut > 0;
      rr(x, y, 150, 96, 16, lit ? K.blue : rgba(K.card, .95), lit ? K.cyan : K.cardLine, 2, k * fade);
      if (lit) glow(x + 75, y + 48, 130, K.blue, cut * .7);
      text('Q' + (i + 1), x + 75, y + 49, { size: 32, color: K.ink, weight: 700, alpha: k * fade });
    }
    if (scan > 0 && scan < 1) { const sx = gx - 20 + (5 * 170 + 20) * scan; line(sx, gy - 20, sx, gy + 4 * 120, K.cyan, 4, .9); glow(sx, gy + 220, 260, K.cyan, .5); }
    // counter 20 → 5
    const cx = 1500, n = Math.round(lerp(20, 5, eOut(cut)));
    panel(1260, 330, 480, 460, p(t, s0 + .4, .5));
    text(String(n), cx, 520, { size: 190, color: cut > .5 ? K.cyan : K.ink, weight: 800, alpha: p(t, s0 + .4, .5) });
    text('questions to answer', cx, 670, { size: 32, color: K.dim, weight: 500, alpha: p(t, s0 + .4, .5), maxW: 420 });
    text('based on each response', cx, 720, { size: 26, color: K.dim, weight: 400, alpha: cut, maxW: 420 });
  });
}
// 6. benefit — two gauges
function gauge(x, y, r, v, col, label, up, a) {
  if (a <= 0) return; ctx.save(); ctx.globalAlpha *= a;
  ctx.lineCap = 'round'; ctx.lineWidth = 26; ctx.strokeStyle = rgba(K.dim, .25); ctx.beginPath(); ctx.arc(x, y, r, Math.PI * .8, Math.PI * 2.2); ctx.stroke();
  ctx.strokeStyle = col; ctx.beginPath(); ctx.arc(x, y, r, Math.PI * .8, Math.PI * (.8 + 1.4 * v)); ctx.stroke();
  const ang = Math.PI * (.8 + 1.4 * v); glow(x + Math.cos(ang) * r, y + Math.sin(ang) * r, 90, col, .9);
  line(x, y, x + Math.cos(ang) * (r - 50), y + Math.sin(ang) * (r - 50), K.ink, 8); circ(x, y, 16, K.ink);
  const lw = Math.min(measure(label, 32, 700), r * 2.2), ly = y + r + 50; text(label, x - 30, ly, { size: 32, color: K.ink, weight: 700, maxW: r * 2.2 }); upDown(x - 30 + lw / 2 + 36, ly + 2, up, col, 1);
  ctx.restore();
}
function sBenefit(t) {
  const s0 = S('benefit').start;
  withCam(drift(t, s0), 960, 560, () => {
    backdrop(t, K.mint);
    headline(t, s0 + .1, '02 · THE NEW APPROACH', 'What it improves');

playEl.onclick = () => { playing = !playing; playEl.textContent = playing ? '❚❚ Pause' : '▶ Play'; if (playing) { if (tCur >= DURATION) tCur = 0; t0 = performance.now() - tCur * 1000; try { audio.currentTime = tCur; audio.play().catch(() => {}); } catch (e) {} requestAnimationFrame(loop); } else audio.pause(); };
seekEl.oninput = () => { show(+seekEl.value); if (playing) { t0 = performance.now() - tCur * 1000; try { audio.currentTime = tCur; } catch (e) {} } };

window.draw = draw; window.DURATION = DURATION;
function merge(base, over) {
  if (Array.isArray(base)) return Array.isArray(over) ? over.map((v, i) => base[i] !== undefined ? merge(base[i], v) : v) : base;
  if (base && typeof base === 'object') { const o = {}; for (const k in base) o[k] = over && k in over ? merge(base[k], over[k]) : base[k]; return o; }
  return over === undefined || over === null ? base : over;
}
function apply(content) { C = window.CONTENT = merge(DEFAULT_CONTENT, content); K = C.colors; }
window.VIDEO = { schema: window.SCHEMA, defaults: DEFAULT_CONTENT, get content() { return C; }, apply, canvas: cv };

}).then(() => document.fonts.ready).then(() => { if (location.search.includes('render')) document.body.classList.add('render'); show(0); return true; });
