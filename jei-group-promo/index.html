<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>재능그룹 홍보 영상</title>
<style>
  @font-face { font-family: 'Noto Sans KR'; src: url('fonts/NotoSansKR.ttf') format('truetype'); font-weight: 100 900; font-display: block; }
  @font-face { font-family: 'Inter'; src: url('fonts/Inter.ttf') format('truetype'); font-weight: 100 900; font-display: block; }
  html, body { margin: 0; background: #111; }
  body { display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 12px; font-family: 'Noto Sans KR', sans-serif; color: #ddd; }
  canvas { width: min(100%, 1280px); aspect-ratio: 16 / 9; display: block; background: #000; }
  .bar { display: flex; gap: 12px; align-items: center; width: min(100%, 1280px); }
  .bar input { flex: 1; }
  body.render { padding: 0; gap: 0; }
  body.render canvas { width: 1920px; height: 1080px; }
  body.render .bar { display: none; }
</style>
</head>
<body>
<script src="content.js"></script>
<script src="schema.js"></script>
<canvas id="c" width="1920" height="1080"></canvas>
<div class="bar">
  <button id="play">▶ 재생</button>
  <input id="seek" type="range" min="0" max="52" step="0.01" value="0">
  <span id="time">0.00s</span>
</div>
<script>
// ------------------------------------------------------------
// 재능그룹 홍보 — 그룹 비전 → 사업 부문 5개와 계열사 → 계열사 연결도 → 엔딩
// 120BPM (한 박 0.5초, 한 마디 2초). 장면 전환은 마디 첫 박: 4 · 8 · 14 · 20 · 26 · 32 · 38 · 44초
// draw(t) 는 시간 t(초)만으로 화면을 그리는 순수 함수 → 프레임 단위 렌더 가능
// ------------------------------------------------------------
const W = 1920, H = 1080, BEAT = .5, DURATION = 52;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const DEFAULT_CONTENT = JSON.parse(JSON.stringify(window.CONTENT));
let C = window.CONTENT, P;
function readColors() { P = { ...C.colors }; }
readColors();
function rgba(hex, a) { const n = parseInt(hex.slice(1), 16); return `rgba(${n >> 16 & 255},${n >> 8 & 255},${n & 255},${a})`; }
const KR = "'Noto Sans KR', sans-serif", EN = "'Inter', 'Noto Sans KR', sans-serif";

// ---------- easing ----------
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;
const p = (t, s, d) => clamp((t - s) / d);
const eOut = x => 1 - Math.pow(1 - x, 3);
const eIn = x => x * x * x;
const eIO = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const eExpo = x => x >= 1 ? 1 : 1 - Math.pow(2, -10 * x);
const eExpoIO = x => x <= 0 ? 0 : x >= 1 ? 1 : x < .5 ? Math.pow(2, 20 * x - 10) / 2 : (2 - Math.pow(2, -20 * x + 10)) / 2;
const eBack = x => { const c1 = 1.9, c3 = c1 + 1; return x <= 0 ? 0 : 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const outK = (t, e, d = .3) => 1 - eIn(p(t, e - d, d));
const EV = new Map();
function mark(type, s, info = 0) { const k = type + ':' + s.toFixed(3); if (!EV.has(k)) EV.set(k, { type, t: +s.toFixed(3), info }); }

// ---------- 그리기 도구 ----------
function bg(c) { ctx.fillStyle = c; ctx.fillRect(-200, -200, W + 400, H + 400); }
function rect(x, y, w, h, c, a = 1) { if (a <= 0 || w <= 0 || h <= 0) return; ctx.save(); ctx.globalAlpha *= a; ctx.fillStyle = c; ctx.fillRect(x, y, w, h); ctx.restore(); }
function circle(x, y, r, c, a = 1) { if (r <= 0 || a <= 0) return; ctx.save(); ctx.globalAlpha *= a; ctx.fillStyle = c; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill(); ctx.restore(); }
function rrect(x, y, w, h, r, fill, a = 1, stroke = null, lw = 2) {
  if (a <= 0 || w <= 0 || h <= 0) return;
  ctx.save(); ctx.globalAlpha *= a; ctx.beginPath(); ctx.roundRect(x, y, w, h, Math.min(r, w / 2, h / 2));
  if (fill) { ctx.fillStyle = fill; ctx.fill(); } if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw; ctx.stroke(); } ctx.restore();
}
function text(str, x, y, { size = 60, color = P.ink, family = KR, weight = 700, align = 'left', alpha = 1, spacing = 0, base = 'middle' } = {}) {
  if (alpha <= 0 || !str) return;
  ctx.save(); ctx.globalAlpha *= alpha; ctx.font = `${weight} ${size}px ${family}`; ctx.textAlign = align; ctx.textBaseline = base; ctx.letterSpacing = spacing + 'px';
  ctx.fillStyle = color; ctx.fillText(str, x, y); ctx.restore();
}
function measure(str, size, family = KR, weight = 700, spacing = 0) { ctx.save(); ctx.font = `${weight} ${size}px ${family}`; ctx.letterSpacing = spacing + 'px'; const w = ctx.measureText(str).width; ctx.restore(); return w; }
// 가려진 선 아래에서 밀려 올라오는 글자
function reveal(str, x, y, t, s, o = {}) {
  const { size = 80, dur = .6, align = 'left', family = KR, weight = 700, spacing = 0, end = null } = o;
  const k = eExpo(p(t, s, dur)), ko = end == null ? 0 : eIn(p(t, end - .35, .35));
  if (k <= 0 || ko >= 1) return;
  const w = measure(str, size, family, weight, spacing), x0 = align === 'left' ? x : align === 'center' ? x - w / 2 : x - w;
  ctx.save(); ctx.beginPath(); ctx.rect(x0 - 20, y - size * .8, w + 40, size * 1.6); ctx.clip();
  text(str, x, y + (1 - k) * size * 1.3 - ko * size * 1.3, o); ctx.restore();
}
function shadowCard(x, y, w, h, r, a) {
  ctx.save(); ctx.globalAlpha *= a; ctx.shadowColor = 'rgba(40,30,20,.14)'; ctx.shadowBlur = 30; ctx.shadowOffsetY = 12;
  ctx.beginPath(); ctx.roundRect(x, y, w, h, r); ctx.fillStyle = P.white; ctx.fill(); ctx.restore();
}
// ---------- 아이콘 (흰 선, s = 칸 크기) ----------
function icon(kind, cx, cy, s, c = P.white) {
  ctx.save(); ctx.translate(cx, cy); ctx.scale(s / 100, s / 100); ctx.strokeStyle = c; ctx.fillStyle = c; ctx.lineWidth = 6; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  const L = (pts, close) => { ctx.beginPath(); pts.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)); if (close) ctx.closePath(); ctx.stroke(); };
  const R = (x, y, w, h, r = 6) => { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); ctx.stroke(); };
  switch (kind) {
    case 'book': L([[0, -22], [-30, -30], [-30, 26], [0, 34], [30, 26], [30, -30], [0, -22], [0, 34]]); break;
    case 'tv': R(-34, -24, 68, 46, 8); L([[-12, -38], [0, -26], [12, -38]]); L([[-16, 34], [16, 34]]); break;
    case 'abc': R(-34, -28, 68, 48, 10); L([[-14, 20], [-24, 36], [-4, 20]]); ctx.font = '800 26px Inter'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('ABC', 0, -3); break;
    case 'code': L([[-14, -22], [-34, 0], [-14, 22]]); L([[14, -22], [34, 0], [14, 22]]); L([[6, -30], [-6, 30]]); break;
    case 'print': R(-20, -34, 40, 20, 3); R(-36, -14, 72, 32, 8); R(-22, 6, 44, 28, 3); L([[-12, 18], [12, 18]]); break;
    case 'truck': R(-38, -20, 44, 34, 4); L([[6, -8], [24, -8], [36, 6], [36, 14], [6, 14]]); circle(-22, 22, 8, c); circle(22, 22, 8, c); break;
    case 'building': R(-26, -36, 52, 72, 4); for (let i = 0; i < 3; i++) for (let j = 0; j < 2; j++) R(-16 + j * 20, -26 + i * 18, 12, 10, 2); L([[-6, 36], [-6, 22], [6, 22], [6, 36]]); break;
    case 'concert': L([[-36, 30], [36, 30]]); ctx.beginPath(); ctx.arc(0, 30, 34, Math.PI, 0); ctx.stroke(); L([[-14, 30], [-14, 6]]); L([[14, 30], [14, 6]]); L([[0, -22], [0, 8]]); circle(-6, 8, 7, c); break;
    case 'hanok': L([[-40, -6], [-28, -24], [28, -24], [40, -6], [26, -12], [-26, -12], [-40, -6]], true); L([[-28, -12], [-28, 30], [28, 30], [28, -12]]); L([[-8, 30], [-8, 8], [8, 8], [8, 30]]); break;
    case 'flower': for (let i = 0; i < 6; i++) { const a = i / 6 * Math.PI * 2; circle(Math.cos(a) * 16, Math.sin(a) * 16 - 6, 11, c); } circle(0, -6, 8, rgba('#000000', .25)); L([[0, 12], [0, 38]]); break;
    case 'tree': ctx.beginPath(); ctx.arc(0, -10, 26, 0, Math.PI * 2); ctx.stroke(); L([[0, 16], [0, 38]]); L([[0, 8], [-12, -4]]); L([[0, 2], [12, -10]]); break;
    case 'cap': L([[-40, -8], [0, -26], [40, -8], [0, 10], [-40, -8]], true); L([[-22, 2], [-22, 22], [0, 32], [22, 22], [22, 2]]); L([[40, -8], [40, 18]]); break;
    case 'school': L([[-36, 34], [-36, -6], [0, -30], [36, -6], [36, 34], [-36, 34]], true); L([[-8, 34], [-8, 12], [8, 12], [8, 34]]); ctx.beginPath(); ctx.arc(0, -8, 7, 0, Math.PI * 2); ctx.stroke(); break;
  }
  ctx.restore();
}
const DCOL = () => [P.d1, P.d2, P.d3, P.d4, P.d5];

// ============================================================
// 장면 — 어두운 공간에 빛나는 구체와 빛줄기로 그룹을 그림 (부문 = 구체, 계열사 = 이어지는 별)
// ============================================================
function rng(seed) { return () => (seed = (seed * 16807) % 2147483647) / 2147483647; }
// 은은한 배경: 어둠 + 색 번짐 + 천천히 흐르는 점과 가까운 점끼리 잇는 선
function night(t, glow = null, gx = W / 2, gy = H / 2, ga = .35) {
  bg(P.night);
  if (glow) { const g = ctx.createRadialGradient(gx, gy, 0, gx, gy, 900); g.addColorStop(0, rgba(glow, ga)); g.addColorStop(1, rgba(glow, 0)); ctx.fillStyle = g; ctx.fillRect(-200, -200, W + 400, H + 400); }
  const r = rng(77), pts = [];
  for (let i = 0; i < 70; i++) {
    const x = ((r() * W + t * (8 + r() * 14)) % (W + 200)) - 100, y = r() * H + Math.sin(t * .3 + i) * 14, z = .3 + r() * .7;
    pts.push([x, y, z]);
  }
  ctx.save(); ctx.lineWidth = 1;
  for (let i = 0; i < pts.length; i++) for (let j = i + 1; j < pts.length; j++) {
    const dx = pts[i][0] - pts[j][0], dy = pts[i][1] - pts[j][1], d = Math.hypot(dx, dy);
    if (d < 170) { ctx.strokeStyle = rgba(P.white, (1 - d / 170) * .09); ctx.beginPath(); ctx.moveTo(pts[i][0], pts[i][1]); ctx.lineTo(pts[j][0], pts[j][1]); ctx.stroke(); }
  }
  ctx.restore();
  pts.forEach(([x, y, z]) => circle(x, y, 1.2 + z * 1.6, P.white, .15 + z * .35));
  // 가장자리 어둡게
  const v = ctx.createRadialGradient(W / 2, H / 2, H * .35, W / 2, H / 2, H * 1.05); v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,.6)');
  ctx.fillStyle = v; ctx.fillRect(-200, -200, W + 400, H + 400);
}
function glowDot(x, y, r, c, a = 1) {
  if (r <= 0 || a <= 0) return;
  const g = ctx.createRadialGradient(x, y, 0, x, y, r * 4); g.addColorStop(0, rgba(c, .55 * a)); g.addColorStop(1, rgba(c, 0));
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r * 4, 0, Math.PI * 2); ctx.fill();
  circle(x, y, r, c, a); circle(x, y, r * .45, P.white, a * .9);
}
function orb(x, y, r, c, a = 1) {
  if (r <= 0 || a <= 0) return;
  const g = ctx.createRadialGradient(x, y, r * .2, x, y, r * 3.2); g.addColorStop(0, rgba(c, .5 * a)); g.addColorStop(.35, rgba(c, .18 * a)); g.addColorStop(1, rgba(c, 0));
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r * 3.2, 0, Math.PI * 2); ctx.fill();
  const b = ctx.createRadialGradient(x - r * .35, y - r * .4, r * .1, x, y, r); b.addColorStop(0, rgba(P.white, .55 * a)); b.addColorStop(.35, rgba(c, a)); b.addColorStop(1, rgba(c, .85 * a));
  ctx.fillStyle = b; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
  ctx.save(); ctx.globalAlpha = a * .5; ctx.strokeStyle = P.white; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.stroke(); ctx.restore();
}
// 빛줄기: a→b 로 k 만큼 뻗고, 끝에 밝은 머리
function beam(ax, ay, bx, by, k, c, w = 3, a = 1, head = true) {
  if (k <= 0 || a <= 0) return;
  const x = lerp(ax, bx, k), y = lerp(ay, by, k);
  ctx.save(); ctx.globalAlpha = a; ctx.lineCap = 'round';
  const g = ctx.createLinearGradient(ax, ay, x, y); g.addColorStop(0, rgba(c, .15)); g.addColorStop(1, rgba(c, .95));
  ctx.strokeStyle = g; ctx.lineWidth = w; ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(x, y); ctx.stroke(); ctx.restore();
  if (head && k < 1) glowDot(x, y, w * 1.6, P.white, a);
}
// 빛살 (카메라가 빨려 들어갈 때)
function streaks(cx, cy, k, c) {
  if (k <= 0) return;
  const r = rng(5);
  ctx.save(); ctx.lineCap = 'round';
  for (let i = 0; i < 60; i++) {
    const an = r() * Math.PI * 2, d0 = 80 + r() * 500, len = (200 + r() * 700) * k;
    ctx.strokeStyle = rgba(i % 3 ? P.white : c, .5 * k * (1 - k * .6)); ctx.lineWidth = 1 + r() * 2.5;
    ctx.beginPath(); ctx.moveTo(cx + Math.cos(an) * d0, cy + Math.sin(an) * d0); ctx.lineTo(cx + Math.cos(an) * (d0 + len), cy + Math.sin(an) * (d0 + len)); ctx.stroke();
  }
  ctx.restore();
}
// 장면 카메라: 시작은 살짝 멀리서 다가오고, 끝은 (fx, fy) 로 빨려 들어감
function camera(t, S, E, fx, fy, fn) {
  const zin = lerp(.84, 1, eExpo(p(t, S, 1.1))), zo = eIn(p(t, E - .55, .55));
  const z = zin * (1 + zo * 2.6), drift = (t - S) * 5;
  ctx.save();
  ctx.translate(fx, fy); ctx.scale(z, z); ctx.translate(-fx - drift, -fy);
  fn();
  ctx.restore();
  streaks(fx, fy, zo, P.white);
  const fade = Math.max(1 - eOut(p(t, S, .35)), eIn(p(t, E - .3, .3)));      // 어둠에서 열리고 어둠으로 닫힘
  if (fade > 0) rect(-200, -200, W + 400, H + 400, P.night, fade);
}
function wrapTo(str, size, weight, max) { return Math.min(size, size * max / Math.max(1, measure(str, size, KR, weight))); }

// 0–4 : 비전
function s0(t) {
  night(t, P.red, W / 2, 330, .18 * eOut(p(t, .5, 1)));
  const mk = eBack(p(t, .5, .5));
  if (mk > 0) { ctx.save(); ctx.translate(W / 2, 330); ctx.rotate((1 - mk) * Math.PI / 2 + t * .15); rect(-34 * mk, -34 * mk, 68 * mk, 68 * mk, P.red); ctx.restore(); }
  mark('tick', .5);
  reveal(C.intro.en, W / 2, 500, t, 1.0, { size: 74, color: P.white, family: EN, weight: 800, align: 'center', spacing: -1, dur: .8 });
  reveal(C.intro.ko, W / 2, 610, t, 1.75, { size: 46, color: rgba(P.white, .75), weight: 500, align: 'center' });
  reveal(C.intro.brand, W / 2, 770, t, 2.5, { size: 64, color: P.white, weight: 900, align: 'center', spacing: 6 });
  mark('tick', 1.0); mark('tick', 2.5);
  const lk = eExpoIO(p(t, 2.75, .6)); rect(W / 2 - 120 * lk, 830, 240 * lk, 4, P.red);
  mark('wipe', 3.5);
  const f = eIn(p(t, 3.6, .4)); if (f > 0) rect(-200, -200, W + 400, H + 400, P.night, f);
}
// 4–8 : 어린이부터 성인까지, 종합교육문화기업 + 빛나는 분야 낱말 7개
function s1(t) {
  camera(t, 4, 8, W / 2, 700, () => {
    night(t, P.red, W / 2, 500, .2);
    text(C.overview.since, W / 2, 210, { size: 24, color: rgba(P.white, .7), family: EN, weight: 800, align: 'center', spacing: 12, alpha: eOut(p(t, 4.1, .4)) });
    reveal(C.overview.title, W / 2, 330, t, 4.25, { size: 68, color: rgba(P.white, .9), weight: 500, align: 'center' });
    reveal(C.overview.title2, W / 2, 470, t, 4.75, { size: 150, color: P.white, weight: 900, align: 'center', spacing: -3 });
    mark('slam', 4.75);
    // 글자 위로 빛이 한 번 쓸고 지나감
    const sw = p(t, 5.0, .9);
    if (sw > 0 && sw < 1) { const w = measure(C.overview.title2, 150, KR, 900, -3), x = W / 2 - w / 2 + sw * w; const g = ctx.createLinearGradient(x - 120, 0, x + 120, 0); g.addColorStop(0, rgba(P.red, 0)); g.addColorStop(.5, rgba(P.red, .55)); g.addColorStop(1, rgba(P.red, 0)); ctx.fillStyle = g; ctx.fillRect(x - 120, 380, 240, 180); }
    const F = C.overview.fields.slice(0, 7), cols = [P.d1, P.d1, P.d2, P.d2, P.d3, P.d3, P.d4];
    F.forEach((f, i) => {
      const s = 5.5 + i * .25; mark('tick', s, i);
      const k = eExpo(p(t, s, .5)); if (k <= 0) return;
      const u = (i - 3) / 3, x = W / 2 + u * 700, y = 720 + u * u * 70 + Math.sin(t * 1.4 + i) * 6;
      glowDot(x, y - 70, 6, cols[i], k);
      text(f, x, y + (1 - k) * 30, { size: 56, color: P.white, weight: 900, align: 'center', alpha: k });
      if (i < 6) { const nx = W / 2 + ((i + 1 - 3) / 3) * 700, ny = 720 + ((i - 2) / 3) ** 2 * 70; beam(x, y - 70, nx, ny - 70, eExpoIO(p(t, s + .25, .4)) * (i < 6 ? 1 : 0), cols[i], 2, .6, false); }
    });
  });
}
// 8–38 : 사업 부문 5개 — 부문마다 구체 하나, 계열사는 빛줄기로 이어지는 별
const ORB = { x: 600, y: 470 };
const DICON = ['book', 'tv', 'print', 'concert', 'cap'];
function division(t, di) {
  const D = C.divisions[di] || { name: '', items: [] }, S = 8 + di * 6, E = S + 6, col = DCOL()[di];
  // 계열사가 하나면(재능교육) 그 계열사 + 대표 브랜드를 별로
  let sats = D.items.slice(0, 5).map(it => ({ name: it.name, desc: it.desc }));
  if (sats.length === 1 && D.items[0].chips) sats = sats.concat(D.items[0].chips.slice(0, 4).map(c => ({ name: c, desc: '' })));
  const n = sats.length, spread = n >= 5 ? 50 : n === 4 ? 50 : 42;
  camera(t, S, E, ORB.x, ORB.y, () => {
    night(t, col, ORB.x, ORB.y, .3);
    const ok = eBack(p(t, S + .1, .7)); mark('slam', S + .1, di);
    const R = 130 * ok, pulse = 1 + Math.sin(t * Math.PI * 2 / BEAT) * .012;
    // 궤도 고리
    ctx.save(); ctx.globalAlpha = .25 * ok; ctx.strokeStyle = P.white; ctx.lineWidth = 1.5; ctx.setLineDash([3, 10]);
    ctx.beginPath(); ctx.ellipse(ORB.x, ORB.y, 520, 380, 0, -Math.PI * .45, Math.PI * .45); ctx.stroke(); ctx.restore();
    sats.forEach((sa, i) => {
      const s = S + 1.0 + i * (n >= 4 ? .75 : 1.0); mark('card', s, i);
      const a = (n === 1 ? 0 : -spread + i * (2 * spread / (n - 1))) * Math.PI / 180 + Math.sin(t * .4) * .02;
      const nx = ORB.x + Math.cos(a) * 520, ny = ORB.y + Math.sin(a) * 380 + Math.sin(t * .9 + i) * 6;
      const k = eExpoIO(p(t, s, .5)), nk = eBack(p(t, s + .35, .4));
      beam(ORB.x + Math.cos(a) * R, ORB.y + Math.sin(a) * R, nx, ny, k, col, 3, .9);
      // 빛줄기를 따라 박자마다 흐르는 빛
      if (k >= 1) { const q = ((t - s) / BEAT) % 1; glowDot(lerp(ORB.x, nx, q), lerp(ORB.y, ny, q), 3, P.white, .7 * (1 - q)); }
      const rp = p(t, s + .35, .8); if (rp > 0 && rp < 1) { ctx.save(); ctx.globalAlpha = 1 - rp; ctx.strokeStyle = col; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(nx, ny, 14 + rp * 60, 0, Math.PI * 2); ctx.stroke(); ctx.restore(); }
      glowDot(nx, ny, 13 * nk, col);
      const tk = eExpo(p(t, s + .45, .6)); if (tk <= 0) return;
      const tx = nx + 44, maxW = W - 90 - tx;
      ctx.save(); ctx.beginPath(); ctx.rect(tx - 10, ny - 70, maxW + 20, 140); ctx.clip();

// 38–44 : 지식맵 — 가운데에서 부문 → 계열사 → 키워드로 빛의 지도가 번져 나감
let MAPC = null, MAPFOR = null;
function mapLayout() {
  if (MAPFOR === C) return MAPC;                       // 문구가 바뀔 때만 다시 계산
  const cx = W / 2, cy = H / 2, r = rng(2024), nodes = [], links = [], boxes = [];
  const ang = i => -Math.PI / 2 + i * Math.PI * 2 / 5;
  const hit = bx => bx[0] < 40 || bx[1] < 30 || bx[0] + bx[2] > W - 40 || bx[1] + bx[3] > 930 ||
    boxes.some(o => bx[0] < o[0] + o[2] + 8 && bx[0] + bx[2] + 8 > o[0] && bx[1] < o[1] + o[3] + 6 && bx[1] + bx[3] + 6 > o[1]);

  const hub = { x: cx, y: cy, s: 38.1, c: P.red, r: 30 }; nodes.push(hub); boxes.push([cx - 115, cy - 115, 230, 230]);
  const affs = [];
  C.divisions.forEach((D, i) => {
    const a = ang(i), col = DCOL()[i];
    const dn = { x: cx + Math.cos(a) * 300, y: cy + Math.sin(a) * 250, s: 38.5 + i * .18, c: col, r: 16, label: D.name, big: true };
    nodes.push(dn); links.push([hub, dn, dn.s - .3, 4]);

    const items = D.items.slice(0, 4);

    an.s = 39.4 + j * .1; nodes.push(an); links.push([an.dn, an, an.s - .25, 2.2]);

      let x, y;
      if (q < tags.length) {                            // 키워드는 다른 글자와 겹치지 않는 자리를 찾아 놓음

function s7(t) {

  const zoom = lerp(1.7, .9, eIO(p(t, 38, 5.2))), rot = lerp(-.05, .04, eIO(p(t, 38, 6)));
  const conv = eIn(p(t, 43.35, .55));                 // 마지막에 모두 가운데로 모임
  const P2 = nd => ({ x: lerp(nd.x, M.cx, conv), y: lerp(nd.y, M.cy, conv) });
  ctx.save(); ctx.translate(M.cx, M.cy); ctx.rotate(rot); ctx.scale(zoom, zoom); ctx.translate(-M.cx, -M.cy);
  ctx.globalCompositeOperation = 'lighter';
  M.links.forEach(([a, b, s, w, cross]) => {
    const k = eExpoIO(p(t, s, cross ? .8 : .45)); if (k <= 0) return;
    const A = P2(a), B = P2(b);

  });
  M.nodes.forEach((nd, i) => {
    const k = eBack(p(t, nd.s, .35)); if (k <= 0) return;
    if (nd.r >= 9) mark('node', Math.round(nd.s * 8) / 8, i); else if (i % 7 === 0) mark('spark', Math.round(nd.s * 8) / 8, i);
    const tw = nd.r < 9 ? .65 + .35 * Math.sin(t * 6 + i) : 1;

  });

    if (!nd.label) return;

    const right = nd.x >= M.cx - 5;
    if (nd.big) { const w = measure(nd.label, 30, KR, 900) + 40; rrect(nd.x - w / 2, nd.y - 58, w, 52, 26, rgba(nd.c, .85), k); text(nd.label, nd.x, nd.y - 31, { size: 30, color: P.white, weight: 900, align: 'center', alpha: k }); }
    else if (nd.small) text(nd.label, nd.x + (right ? 14 : -14), nd.y, { size: 20, color: rgba(P.white, .55), weight: 500, align: right ? 'left' : 'right', alpha: k });
    else text(nd.label, nd.x + (right ? 22 : -22), nd.y, { size: 27, color: P.white, weight: 700, align: right ? 'left' : 'right', alpha: k });

  const hk = eBack(p(t, 38.1, .6)); mark('slam', 38.1);
  orb(M.cx, M.cy, 110 * hk * (1 + conv * .3), P.red, 1);
  text(C.network.center, M.cx, M.cy + 2, { size: 48, color: P.white, weight: 900, align: 'center', alpha: hk * (1 - conv) });
  ctx.restore();
  const capk = eExpo(p(t, 42.25, .5)) * (1 - conv);
  if (capk > 0) { const g = ctx.createLinearGradient(0, 930, 0, 1080); g.addColorStop(0, rgba(P.night, 0)); g.addColorStop(1, rgba(P.night, .9 * capk)); ctx.fillStyle = g; ctx.fillRect(0, 930, W, 150); }
  text(C.network.caption, W / 2, 1010 + (1 - capk) * 20, { size: 30, color: rgba(P.white, .75), weight: 700, align: 'center', alpha: capk });
  const fl = Math.max(1 - eOut(p(t, 38.1, .5)) , 0) * (t >= 38.1 ? .5 : 0); if (fl > 0) rect(-200, -200, W + 400, H + 400, P.white, fl);
  const fade0 = 1 - eOut(p(t, 38, .3)); if (fade0 > 0) rect(-200, -200, W + 400, H + 400, P.night, fade0);

// 44–52 : 엔딩
function s8(t) {
  bg(P.red);
  const g = ctx.createRadialGradient(W / 2, 480, 50, W / 2, 480, 1100); g.addColorStop(0, 'rgba(255,255,255,.18)'); g.addColorStop(1, 'rgba(0,0,0,.25)'); ctx.fillStyle = g; ctx.fillRect(-200, -200, W + 400, H + 400);

  mark('slam', 44.25);

function draw(t) {
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';

  ctx.translate(W / 2, H / 2); ctx.scale(1 + punch, 1 + punch); ctx.translate(-W / 2, -H / 2);

  else if (t < 38) division(t, Math.min(4, Math.floor((t - 8) / 6)));

// ---------- preview player ----------
const seekEl = document.getElementById('seek'), timeEl = document.getElementById('time'), playEl = document.getElementById('play');
let playing = false, t0 = 0, tCur = 0;

function loop(now) {
  if (!playing) return;
  const t = (now - t0) / 1000;
  if (t >= DURATION) { playing = false; playEl.textContent = '▶ 재생'; audio.pause(); show(DURATION); return; }

}
playEl.onclick = () => {
  playing = !playing; playEl.textContent = playing ? '❚❚ 정지' : '▶ 재생';
  if (playing) { if (tCur >= DURATION) tCur = 0; t0 = performance.now() - tCur * 1000; try { audio.currentTime = tCur; audio.play().catch(() => {}); } catch (e) {} requestAnimationFrame(loop); }

function merge(base, over) {
