<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>노벨상이 궁금해요</title>
<style>
  @font-face { font-family: 'Noto Sans KR'; src: url('fonts/NotoSansKR.ttf') format('truetype'); font-weight: 100 900; font-display: block; }
  @font-face { font-family: 'Jua'; src: url('fonts/Jua-Regular.ttf') format('truetype'); font-display: block; }
  html, body { margin: 0; background: #14182A; }
  body { display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 12px; font-family: 'Noto Sans KR', sans-serif; color: #ddd; }
  canvas { width: min(100%, 1280px); aspect-ratio: 16 / 9; display: block; background: #7CC4F4; }
  .bar { display: flex; gap: 12px; align-items: center; width: min(100%, 1280px); }
  .bar input { flex: 1; }
  body.render { padding: 0; gap: 0; }
  body.render canvas { width: 1920px; height: 1080px; }
  body.render .bar { display: none; }
</style>
</head>
<body>
<script src="timeline.js"></script>
<script src="content.js"></script>
<script src="schema.js"></script>
<canvas id="c" width="1920" height="1080"></canvas>
<div class="bar">
  <button id="play">▶ 재생</button>
  <input id="seek" type="range" min="0" max="300" step="0.01" value="0">
  <span id="time">0.00s</span>
</div>
<script>
// ------------------------------------------------------------
// 노벨상이 궁금해요 — 어린이 교양 설명 영상 (플랫 일러스트 스타일, 모든 그림은 코드로 그려요)
// 장면: 네 사람의 공통점 → 제목 → 노벨의 유언 → 여섯 분야 → 심사 과정 → 수상 인원 → 누구나 → 세상을 떠난 사람은? → 마무리
// 시각: timeline.js (tools/make_audio.py 가 실제 음성 길이로 씀). 효과음 시각은 TL.sfx — 화면도 같은 때에 움직여요.
// draw(t) 는 시간만으로 정해지는 순수 함수예요 (렌더러가 아무 프레임이나 바로 그릴 수 있게).
// 장면 사이·장면 안 장면 전환은 흰 테두리가 있는 동그란 와이프 (믹스의 휙 소리와 같은 때).
// ------------------------------------------------------------
const W = 1920, H = 1080, TL = window.TL, DURATION = TL.duration, TAU = Math.PI * 2;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const DEFAULT_CONTENT = JSON.parse(JSON.stringify(window.CONTENT));
let C = window.CONTENT, K = C.colors, T = 0;
const SANS = "'Noto Sans KR', sans-serif", JUA = "'Jua', 'Noto Sans KR', sans-serif";
const WHITE = '#FFFFFF', SHADOW = 'rgba(30,34,56,.16)';

// ---------- 기본 ----------
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;
const p = (t, s, d) => clamp((t - s) / d);
const eOut = x => 1 - Math.pow(1 - x, 3), eIO = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const eBack = x => { const c1 = 1.7, c3 = c1 + 1; return x <= 0 ? 0 : 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const nz = (i, s = 1) => { const v = Math.sin(i * 12.9898 + s * 78.233) * 43758.5453; return v - Math.floor(v) - .5; };
function rgba(hex, a) { const n = parseInt(hex.slice(1), 16); return `rgba(${n >> 16 & 255},${n >> 8 & 255},${n & 255},${a})`; }
function shade(hex, f) { const n = parseInt(hex.slice(1), 16), m = v => Math.round(clamp(f < 0 ? v * (1 + f) : v + (255 - v) * f, 0, 255)); return `rgb(${m(n >> 16 & 255)},${m(n >> 8 & 255)},${m(n & 255)})`; }
const L = id => TL.lines[id] || { start: 0, end: 0 };
const S = id => TL.scenes.find(s => s.id === id) || { start: 0, end: 0 };
const st = (id, f = 0) => L(id).start + (L(id).end - L(id).start) * f;
const en = (id, d = 0) => L(id).end + d;
const cue = (id, n = 0) => { const c = TL.sfx.filter(x => x.line === id)[n]; return c ? c.t : st(id); };

function rrF(x, y, w, h, r, fill) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); ctx.fillStyle = fill; ctx.fill(); }
function rr(x, y, w, h, r, fill, stroke, lw = 2, a = 1) { if (a <= 0) return; ctx.save(); ctx.globalAlpha *= a; ctx.beginPath(); ctx.roundRect(x, y, w, h, r); if (fill) { ctx.fillStyle = fill; ctx.fill(); } if (stroke) { ctx.lineWidth = lw; ctx.strokeStyle = stroke; ctx.stroke(); } ctx.restore(); }
function circle(x, y, r, fill, stroke, lw = 3, a = 1) { if (r <= 0 || a <= 0) return; ctx.save(); ctx.globalAlpha *= a; ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); if (fill) { ctx.fillStyle = fill; ctx.fill(); } if (stroke) { ctx.lineWidth = lw; ctx.strokeStyle = stroke; ctx.stroke(); } ctx.restore(); }
function ell(x, y, rx, ry, fill, rot = 0) { ctx.beginPath(); ctx.ellipse(x, y, rx, ry, rot, 0, TAU); ctx.fillStyle = fill; ctx.fill(); }
function poly(pts, fill) { ctx.beginPath(); pts.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)); ctx.closePath(); ctx.fillStyle = fill; ctx.fill(); }
function line0(x1, y1, x2, y2, c, lw = 3, cap = 'round') { ctx.save(); ctx.strokeStyle = c; ctx.lineWidth = lw; ctx.lineCap = cap; ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke(); ctx.restore(); }
function measure(str, size, weight = 700, fam = SANS) { ctx.save(); ctx.font = `${weight} ${size}px ${fam}`; const w = ctx.measureText(str).width; ctx.restore(); return w; }
function text(str, x, y, { size = 36, weight = 700, fam = SANS, color = K.ink, align = 'left', alpha = 1, maxW, stroke, lw = 10, shadow } = {}) {
  if (alpha <= 0 || !str) return; ctx.save(); ctx.globalAlpha *= alpha;
  let sz = size; if (maxW) { const w = measure(str, size, weight, fam); if (w > maxW) sz = size * maxW / w; }
  ctx.font = `${weight} ${sz}px ${fam}`; ctx.textAlign = align; ctx.textBaseline = 'middle';
  if (shadow) { ctx.fillStyle = shadow; ctx.fillText(str, x + 4, y + 6); }
  if (stroke) { ctx.lineJoin = 'round'; ctx.strokeStyle = stroke; ctx.lineWidth = lw; ctx.strokeText(str, x, y); }
  ctx.fillStyle = color; ctx.fillText(str, x, y); ctx.restore();
}
// 알약 모양 이름표 (가운데 정렬)
function pill(str, x, y, { size = 26, fill = K.chip, color = WHITE, a = 1, pad = 20, fam = SANS, weight = 800, border = WHITE, bw = 4 } = {}) {
  if (a <= 0 || !str) return 0; const w = measure(str, size, weight, fam) + pad * 2, h = size * 1.75;
  ctx.save(); ctx.globalAlpha *= a;
  rrF(x - w / 2, y - h / 2 + 5, w, h, h / 2, 'rgba(0,0,0,.12)');
  if (border) rrF(x - w / 2 - bw, y - h / 2 - bw, w + bw * 2, h + bw * 2, h / 2 + bw, border);
  rrF(x - w / 2, y - h / 2, w, h, h / 2, fill);
  text(str, x, y + 1, { size, weight, fam, color, align: 'center' }); ctx.restore(); return w;
}
// 튀어나오기: k(0→1)에 맞춰 (ox, oy)를 중심으로 커지며 나타남
function pop(t, t0, fn, { d = .5, ox = 960, oy = 540, from = .3 } = {}) {
  const k = p(t, t0, d); if (k <= 0) return 0; const s = lerp(from, 1, eBack(k));
  ctx.save(); ctx.globalAlpha *= clamp(k * 2.5); ctx.translate(ox, oy); ctx.scale(s, s); ctx.translate(-ox, -oy); fn(k); ctx.restore(); return k;
}
function rise(t, t0, fn, { d = .5, dy = 40 } = {}) {
  const k = p(t, t0, d); if (k <= 0) return 0;
  ctx.save(); ctx.globalAlpha *= clamp(k * 2); ctx.translate(0, (1 - eOut(k)) * dy); fn(k); ctx.restore(); return k;
}
function sparkle(x, y, r, a = 1, c = WHITE) {
  if (a <= 0 || r <= 0) return; ctx.save(); ctx.globalAlpha *= a; ctx.fillStyle = c; ctx.beginPath();
  for (let i = 0; i < 8; i++) { const ang = i * Math.PI / 4 - Math.PI / 2, rr0 = i % 2 ? r * .28 : r; ctx.lineTo(x + Math.cos(ang) * rr0, y + Math.sin(ang) * rr0); }
  ctx.closePath(); ctx.fill(); ctx.restore();
}
function twinkles(t, list, c = WHITE) { list.forEach(([x, y, r], i) => sparkle(x, y, r * (.55 + .45 * Math.sin(t * 4 + i * 1.7)), 1, c)); }

// ---------- 배경 ----------
function bg(color) { ctx.fillStyle = color; ctx.fillRect(0, 0, W, H); }
// 은은한 아이콘 무늬 (원본처럼 분야 아이콘을 깔아 둔 배경)
function iconPattern(t, color, a = .13, drift = 12) {
  const names = ['atom', 'flask', 'micro', 'book', 'heart', 'chart'];
  ctx.save(); ctx.globalAlpha *= a;
  for (let r = 0; r < 7; r++) for (let c = 0; c < 12; c++) {
    const x = c * 175 + (r % 2) * 88 - 40 + (t * drift) % 175, y = r * 165 + 40;
    icon(names[(r * 5 + c) % 6], x, y, 34, color, 4);
  }
  ctx.restore();
}
function confetti(t, t0, seed = 1, cols = [K.coral, K.royal, K.leaf, WHITE, K.teal], n = 26) {
  for (let i = 0; i < n; i++) {
    const k = p(t, t0 + i * .02, .5); if (k <= 0) continue;
    const x = 960 + nz(i, seed) * 1900, y = 540 + nz(i, seed + 3) * 1000, rot = nz(i, seed + 5) * 6 + t * (nz(i, seed + 7) * 1.5), s = 14 + (nz(i, seed + 9) + .5) * 18;
    if (Math.hypot(x - 960, (y - 470) * 1.6) < 560) continue;   // 가운데 글자 자리는 비워 둠
    ctx.save(); ctx.globalAlpha *= clamp(k * 2); ctx.translate(x, y); ctx.rotate(rot); ctx.scale(eBack(k), eBack(k));
    const c = cols[i % cols.length], kind = i % 4;
    if (kind === 0) { ctx.strokeStyle = c; ctx.lineWidth = 5; ctx.lineJoin = 'round'; ctx.beginPath(); ctx.moveTo(0, -s); ctx.lineTo(s * .9, s * .6); ctx.lineTo(-s * .9, s * .6); ctx.closePath(); ctx.stroke(); }
    else if (kind === 1) { ctx.strokeStyle = c; ctx.lineWidth = 5; ctx.lineCap = 'round'; ctx.beginPath(); for (let j = 0; j < 5; j++) ctx.lineTo(-s + j * s * .5, j % 2 ? -s * .3 : s * .3); ctx.stroke(); }
    else if (kind === 2) circle(0, 0, s * .35, c);
    else rrF(-s * .6, -s * .18, s * 1.2, s * .36, 3, c);
    ctx.restore();
  }
}

// ---------- 아이콘 (선 그림) ----------
function icon(name, x, y, s, c, lw = 6) {
  ctx.save(); ctx.translate(x, y); ctx.strokeStyle = c; ctx.fillStyle = c; ctx.lineWidth = lw; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  const S_ = v => v * s;
  ctx.beginPath();
  if (name === 'atom') {
    for (let i = 0; i < 3; i++) { ctx.beginPath(); ctx.ellipse(0, 0, S_(1), S_(.38), i * Math.PI / 3, 0, TAU); ctx.stroke(); }
    ctx.beginPath(); ctx.arc(0, 0, S_(.16), 0, TAU); ctx.fill();
  } else if (name === 'flask') {
    ctx.moveTo(S_(-.25), S_(-.95)); ctx.lineTo(S_(-.25), S_(-.35)); ctx.lineTo(S_(-.8), S_(.85)); ctx.lineTo(S_(.8), S_(.85)); ctx.lineTo(S_(.25), S_(-.35)); ctx.lineTo(S_(.25), S_(-.95)); ctx.stroke();
    line0(S_(-.38), S_(-.95), S_(.38), S_(-.95), c, lw);
    ctx.beginPath(); ctx.moveTo(S_(-.52), S_(.25)); ctx.lineTo(S_(.52), S_(.25)); ctx.stroke();
    circle(S_(-.15), S_(.55), S_(.09), c); circle(S_(.2), S_(.45), S_(.06), c);
  } else if (name === 'micro') {
    ctx.moveTo(S_(-.8), S_(.9)); ctx.lineTo(S_(.8), S_(.9)); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(S_(.35), S_(.9)); ctx.quadraticCurveTo(S_(.85), S_(.2), S_(.3), S_(-.25)); ctx.stroke();
    ctx.save(); ctx.rotate(-.55); ctx.beginPath(); ctx.roundRect(S_(-.18), S_(-1.05), S_(.36), S_(1.05), S_(.08)); ctx.stroke(); ctx.restore();
    ctx.beginPath(); ctx.moveTo(S_(-.55), S_(.35)); ctx.lineTo(S_(.25), S_(.35)); ctx.stroke();
  } else if (name === 'book') {
    ctx.moveTo(0, S_(-.65)); ctx.quadraticCurveTo(S_(-.5), S_(-.9), S_(-.95), S_(-.7)); ctx.lineTo(S_(-.95), S_(.75)); ctx.quadraticCurveTo(S_(-.5), S_(.55), 0, S_(.8));
    ctx.quadraticCurveTo(S_(.5), S_(.55), S_(.95), S_(.75)); ctx.lineTo(S_(.95), S_(-.7)); ctx.quadraticCurveTo(S_(.5), S_(-.9), 0, S_(-.65)); ctx.lineTo(0, S_(.8)); ctx.stroke();
  } else if (name === 'heart') {
    ctx.moveTo(0, S_(.85)); ctx.bezierCurveTo(S_(-1.1), S_(.1), S_(-.85), S_(-.95), 0, S_(-.4)); ctx.bezierCurveTo(S_(.85), S_(-.95), S_(1.1), S_(.1), 0, S_(.85)); ctx.stroke();
  } else if (name === 'chart') {
    [[-.7, .3], [-.2, -.05], [.3, -.45]].forEach(([bx, top]) => { ctx.beginPath(); ctx.roundRect(S_(bx), S_(top), S_(.32), S_(.85 - top), S_(.05)); ctx.stroke(); });
    ctx.beginPath(); ctx.moveTo(S_(-.85), S_(-.15)); ctx.lineTo(S_(-.2), S_(-.6)); ctx.lineTo(S_(.15), S_(-.4)); ctx.lineTo(S_(.85), S_(-.95)); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(S_(.5), S_(-.95)); ctx.lineTo(S_(.85), S_(-.95)); ctx.lineTo(S_(.85), S_(-.6)); ctx.stroke();
  } else if (name === 'dove') {   // 오른쪽을 보고 나는 비둘기 + 올리브 가지
    ctx.ellipse(S_(-.05), S_(.2), S_(.62), S_(.3), -.15, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.arc(S_(.58), S_(-.02), S_(.22), 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.moveTo(S_(.76), S_(-.06)); ctx.lineTo(S_(1.0), S_(.02)); ctx.lineTo(S_(.76), S_(.08)); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(S_(-.55), S_(.2)); ctx.lineTo(S_(-1.05), S_(-.08)); ctx.lineTo(S_(-.95), S_(.38)); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(S_(-.25), S_(.05)); ctx.quadraticCurveTo(S_(-.45), S_(-.85), S_(.35), S_(-.95)); ctx.quadraticCurveTo(S_(.05), S_(-.4), S_(.25), S_(.08)); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = '#7CC46A'; ctx.lineWidth = Math.max(3, lw * .7); ctx.beginPath(); ctx.moveTo(S_(.95), S_(.04)); ctx.quadraticCurveTo(S_(1.15), S_(.3), S_(1.0), S_(.55)); ctx.stroke();
    ctx.fillStyle = '#7CC46A'; [[1.1, .25, .5], [.98, .42, -.5]].forEach(([lx, ly, r0]) => { ctx.beginPath(); ctx.ellipse(S_(lx), S_(ly), S_(.1), S_(.05), r0, 0, TAU); ctx.fill(); });
  }
  ctx.restore();
}

// ---------- 메달 ----------
function nobelProfile(r, col) {   // 메달 속 노벨 옆얼굴 (왼쪽을 봄)
  ctx.save(); ctx.fillStyle = col; ctx.beginPath();
  ctx.moveTo(-r * .62, r * .62); ctx.quadraticCurveTo(-r * .55, r * .2, -r * .18, r * .12);
  ctx.quadraticCurveTo(-r * .42, r * .02, -r * .4, -r * .2); ctx.lineTo(-r * .48, -r * .26); ctx.lineTo(-r * .38, -r * .34);
  ctx.quadraticCurveTo(-r * .36, -r * .7, r * .02, -r * .7); ctx.quadraticCurveTo(r * .34, -r * .68, r * .3, -r * .28);
  ctx.quadraticCurveTo(r * .26, r * .02, r * .1, r * .14); ctx.quadraticCurveTo(r * .52, r * .22, r * .62, r * .62); ctx.closePath(); ctx.fill(); ctx.restore();
}
function medal(x, y, r, { spin = 0, a = 1, glow = 0, rays = 0 } = {}) {
  if (a <= 0 || r <= 0) return; ctx.save(); ctx.globalAlpha *= a; ctx.translate(x, y);
  if (glow > 0) { const g = ctx.createRadialGradient(0, 0, r * .6, 0, 0, r * 2.2); g.addColorStop(0, rgba('#FFF4B0', .7 * glow)); g.addColorStop(1, rgba('#FFF4B0', 0)); ctx.fillStyle = g; ctx.fillRect(-r * 2.3, -r * 2.3, r * 4.6, r * 4.6); }
  if (rays > 0) { ctx.save(); ctx.rotate(T * .25); ctx.fillStyle = rgba('#FFF6C8', .35 * rays); for (let i = 0; i < 12; i++) { ctx.rotate(TAU / 12); ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(r * 3.2, -r * .35); ctx.lineTo(r * 3.2, r * .35); ctx.closePath(); ctx.fill(); } ctx.restore(); }
  const sx = Math.cos(spin), face = sx >= 0; ctx.scale(Math.max(.06, Math.abs(sx)), 1);
  circle(0, 0, r, '#D9961A'); circle(0, -r * .03, r * .97, '#E8A923');
  const g = ctx.createRadialGradient(-r * .3, -r * .35, r * .1, 0, 0, r * .9); g.addColorStop(0, '#FFF0A8'); g.addColorStop(.55, K.gold); g.addColorStop(1, '#E3A11E');
  circle(0, 0, r * .86, g);
  if (face) { nobelProfile(r * .86, 'rgba(196,128,20,.55)'); if (r > 60) text('NOBEL', r * .5, -r * .18, { size: r * .11, weight: 800, color: 'rgba(196,128,20,.6)', align: 'center' }); }
  ctx.save(); ctx.beginPath(); ctx.arc(0, 0, r * .86, 0, TAU); ctx.clip(); const sh = ((T * .35) % 2.4 - 1.2) * r * 2;
  ctx.fillStyle = 'rgba(255,255,255,.35)'; ctx.beginPath(); ctx.moveTo(sh - r * .2, -r); ctx.lineTo(sh + r * .1, -r); ctx.lineTo(sh - r * .3, r); ctx.lineTo(sh - r * .6, r); ctx.closePath(); ctx.fill(); ctx.restore();
  ctx.restore();
}
// 리본 달린 메달 (빨강·흰 줄무늬 리본이 양옆으로)
function ribbonMedal(x, y, r, a = 1) {
  if (a <= 0) return; ctx.save(); ctx.globalAlpha *= a;
  for (const sgn of [-1, 1]) {
    const x0 = x + sgn * r * .5, x1 = x + sgn * r * 2.15, h = r * .62;
    poly([[x0, y - h / 2], [x1, y - h / 2], [x1 - sgn * r * .25, y], [x1, y + h / 2], [x0, y + h / 2]], '#D8323F');
    poly([[x0, y - h * .16], [x1 - sgn * r * .16, y - h * .16], [x1 - sgn * r * .1, y], [x1 - sgn * r * .16, y + h * .16], [x0, y + h * .16]], WHITE);
  }
  medal(x, y, r); ctx.restore();
}

// ---------- 사람 ----------
const LOOK = {
  einstein: { skin: '#F7D4B5', hair: 'wild', hairC: '#F2F2F2', top: 'coat', topC: '#FFFFFF', inner: '#3A3D52', pants: '#3A3D52', shoe: '#2C2F45', stache: '#E8E8E8', brows: '#DADADA' },
  kim: { skin: '#F2C9A0', hair: 'side', hairC: '#3B3B46', top: 'suit', topC: '#262A3A', tie: '#3A6FD8', pants: '#262A3A', shoe: '#15171F' },
  dylan: { skin: '#F7D4B5', hair: 'curly', hairC: '#5B3A24', top: 'suit', topC: '#22232B', tie: 'bow', tieC: '#22232B', pants: '#6A6E7E', shoe: '#15171F', hat: '#2B2B33' },
  malala: { skin: '#C98E64', hair: 'hijab', hairC: '#C9343C', top: 'dress', topC: '#C9343C', pants: '#2FAE8A', shoe: '#4B3A2E' },
  nobel: { skin: '#F7D4B5', hair: 'nobel', hairC: '#6B4126', beard: '#6B4126', top: 'suit', topC: '#6E2E22', tie: 'bow', tieC: '#F2C230', pants: '#3C1E18', shoe: '#2B1A14' },
  curie: { skin: '#F7D4B5', hair: 'bun', hairC: '#5A3A2A', top: 'dress', topC: '#34303F', pants: '#34303F', shoe: '#1E1C26', collar: WHITE },
  judge: { skin: '#F2C9A0', hair: 'side', hairC: '#2B2A30', glasses: true, top: 'suit', topC: '#B87A34', tie: 'bow', tieC: '#2B2A30', pants: '#5C3A1C', shoe: '#2B1A14' },
  doctor: { skin: '#F7D4B5', hair: 'bob', hairC: '#7A4A2A', top: 'coat', topC: '#FFFFFF', inner: '#7FB3E8', pants: '#3D5A80', shoe: '#2C2F45' },
  blue: { skin: '#E8B48C', hair: 'short', hairC: '#26232B', top: 'tee', topC: '#2F63C8', pants: '#24304F', shoe: '#1B1E2B' },
  robe: { skin: '#C98E64', hair: 'pony', hairC: '#3A2A22', top: 'dress', topC: '#C86B2C', pants: '#7A3E1A', shoe: '#4B3A2E' },

// ---------- 자막 ----------
function subtitle(t) {
  const id = TL.order.find(i => { const l = TL.lines[i]; return t >= l.start - .1 && t < l.end + .3; }); if (!id) return;
  const l = TL.lines[id], cs = l.chunks || [{ text: l.text, start: l.start }];
  let ci = 0; for (let i = 0; i < cs.length; i++) if (t >= cs[i].start - .05) ci = i;
  const str = (C.subs && C.subs[id] && C.subs[id] !== l.text) ? C.subs[id] : cs[ci].text;
  const a = Math.min(eOut(p(t, l.start - .1, .2)), 1 - p(t, l.end + .1, .2));
  const w = Math.min(1760, measure(str, 42, 700) + 90);
  rr(960 - w / 2, 966, w, 76, 38, rgba(K.subBox, .78), null, 0, a);
  text(str, 960, 1005, { size: 42, weight: 700, color: WHITE, align: 'center', alpha: a, maxW: 1680 });
}

// 합성: 장면 사이는 동그란 와이프 (믹스의 휙 소리와 같은 때)
// ============================================================
const SCENE_BEATS = TL.scenes.map(s => [s.start, t => SC[s.id](t)]);
function draw(t) {
  T = t; ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1;
  beats(t, SCENE_BEATS, .6);
  const f = p(t, DURATION - 1.4, 1.4); if (f > 0) { ctx.fillStyle = `rgba(20,24,42,${eIO(f)})`; ctx.fillRect(0, 0, W, H); }
  const fi = 1 - p(t, 0, .5); if (fi > 0) { ctx.fillStyle = `rgba(255,255,255,${fi})`; ctx.fillRect(0, 0, W, H); }
  subtitle(t);
}

// ---------- 미리보기 플레이어 ----------
const seekEl = document.getElementById('seek'), timeEl = document.getElementById('time'), playEl = document.getElementById('play');
seekEl.max = DURATION.toFixed(2);
let playing = false, t0 = 0, tCur = 0;
const audio = new Audio('audio/mix.wav'); audio.preload = 'auto';
function show(t) { tCur = t; draw(t); seekEl.value = t; timeEl.textContent = t.toFixed(2) + 's'; }
function loop(now) { if (!playing) return; const t = (now - t0) / 1000; if (t >= DURATION) { playing = false; playEl.textContent = '▶ 재생'; audio.pause(); show(DURATION); return; } show(t); requestAnimationFrame(loop); }
playEl.onclick = () => { playing = !playing; playEl.textContent = playing ? '❚❚ 멈춤' : '▶ 재생'; if (playing) { if (tCur >= DURATION) tCur = 0; t0 = performance.now() - tCur * 1000; try { audio.currentTime = tCur; audio.play().catch(() => {}); } catch (e) {} requestAnimationFrame(loop); } else audio.pause(); };
seekEl.oninput = () => { show(+seekEl.value); if (playing) { t0 = performance.now() - tCur * 1000; try { audio.currentTime = tCur; } catch (e) {} } };
const q = new URLSearchParams(location.search); if (q.has('t')) tCur = +q.get('t');

window.draw = draw; window.DURATION = DURATION;
function merge(base, over) {
  if (Array.isArray(base)) return Array.isArray(over) ? over.map((v, i) => base[i] !== undefined ? merge(base[i], v) : v) : base;
  if (base && typeof base === 'object') { const o = {}; for (const k in base) o[k] = over && k in over ? merge(base[k], over[k]) : base[k]; return o; }
  return over === undefined || over === null ? base : over;
}
function apply(content) { C = window.CONTENT = merge(DEFAULT_CONTENT, content); K = C.colors; }
window.VIDEO = { schema: window.SCHEMA, defaults: DEFAULT_CONTENT, get content() { return C; }, apply, canvas: cv };
window.ready = Promise.all([document.fonts.load(`700 100px 'Noto Sans KR'`, '가A'), document.fonts.load(`100px 'Jua'`, '가')]).then(r => {
  if (!r[0].length || !r[1].length) throw new Error('font failed to load (check fonts/)');
}).then(() => document.fonts.ready).then(() => { if (location.search.includes('render')) document.body.classList.add('render'); show(tCur); return true; });
