<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>교육플랫폼팀 홍보 영상</title>
<style>
  @font-face { font-family: 'Black Han Sans'; src: url('fonts/BlackHanSans-Regular.ttf') format('truetype'); font-display: block; }
  @font-face { font-family: 'Noto Sans KR'; src: url('fonts/NotoSansKR.ttf') format('truetype'); font-weight: 100 900; font-display: block; }
  @font-face { font-family: 'Inter'; src: url('fonts/Inter.ttf') format('truetype'); font-weight: 100 900; font-display: block; }
  @font-face { font-family: 'JetBrains Mono'; src: url('fonts/JetBrainsMono.ttf') format('truetype'); font-weight: 100 900; font-display: block; }
  html, body { margin: 0; background: #111; }
  body { display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 12px; font-family: 'Noto Sans KR', sans-serif; color: #ddd; }
  canvas { width: min(100%, 1280px); aspect-ratio: 16 / 9; display: block; background: #000; }
  .bar { display: flex; gap: 12px; align-items: center; width: min(100%, 1280px); }
  .bar input { flex: 1; }
  body.render { padding: 0; gap: 0; }
  body.render canvas { width: 1920px; height: 1080px; }
  body.render .bar { display: none; }
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<div class="bar">
  <button id="play">▶ 재생</button>
  <input id="seek" type="range" min="0" max="30" step="0.01" value="0">
  <span id="time">0.00s</span>
</div>
<script>
// ------------------------------------------------------------
// 재능교육 교육플랫폼팀 30초 홍보 — 통통 튀는 버전
// 120BPM (한 박 0.5초). 장면 전환: 4 · 8 · 12 · 16 · 20 · 25초, 박자마다 튀고 흔들림
// draw(t) 는 시간 t(초)만으로 화면을 그리는 순수 함수 → 프레임 단위 렌더 가능
// ------------------------------------------------------------
const W = 1920, H = 1080, DURATION = 30, BEAT = .5;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const P = { red: '#E60012', yellow: '#FFC93C', blue: '#3D7CFF', mint: '#22CFA0', pink: '#FF7AB6', cream: '#FFF6EC', ink: '#17151F', white: '#FFFFFF', purple: '#8B5CFF' };
const DISP = "'Black Han Sans', 'Noto Sans KR', sans-serif", KR = "'Noto Sans KR', sans-serif", EN = "'Inter', sans-serif", MONO = "'JetBrains Mono', monospace";

// ---------- easing ----------
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;
const p = (t, s, d) => clamp((t - s) / d);
const eOut = x => 1 - Math.pow(1 - x, 3);
const eIn = x => x * x * x;
const eIO = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const eBack = x => { const c1 = 2.4, c3 = c1 + 1; return x <= 0 ? 0 : 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const eElastic = x => x <= 0 ? 0 : x >= 1 ? 1 : Math.pow(2, -10 * x) * Math.sin((x * 10 - .75) * (2 * Math.PI) / 3) + 1;
const eBounce = x => { const n = 7.5625, d = 2.75; if (x < 1 / d) return n * x * x; if (x < 2 / d) return n * (x -= 1.5 / d) * x + .75; if (x < 2.5 / d) return n * (x -= 2.25 / d) * x + .9375; return n * (x -= 2.625 / d) * x + .984375; };
// 박자 격자: 모든 등장 시각을 8분음표(0.25초) 격자에 맞춤. 등장 시각은 EV 에 기록해 효과음 배치에 씀
const Q = (s, g = BEAT / 2) => Math.round(s / g + 1e-6) * g;
const EV = new Map();
function mark(type, s, info = 0) { const k = type + ':' + s.toFixed(3); if (!EV.has(k)) EV.set(k, { type, t: +s.toFixed(3), info }); }
const pop = (t, s, d = .32) => { s = Q(s); mark('pop', s); return eBack(p(t, s, d)); };
const outK = (t, e, d = .3) => 1 - eIn(p(t, e - d, d));
function rng(seed) { return () => (seed = (seed * 16807) % 2147483647) / 2147483647; }
// 박자 펄스 (박마다 0→1→0)
const beatPulse = t => t < 0 ? 0 : Math.pow(1 - ((t % BEAT) / BEAT), 4);
// 박마다 바닥에 닿는 통통 (박자 순간 = 0, 사이 = 1)
const hop = t => Math.sin(Math.PI * (((t % BEAT) + BEAT) % BEAT) / BEAT);

// ---------- 그리기 도구 ----------
function bg(c) { ctx.fillStyle = c; ctx.fillRect(-200, -200, W + 400, H + 400); }
function circle(x, y, r, c, a = 1) { if (r <= 0 || a <= 0) return; ctx.save(); ctx.globalAlpha *= a; ctx.fillStyle = c; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill(); ctx.restore(); }
function rrect(x, y, w, h, r, fill, a = 1, stroke = null, lw = 4) {
  if (a <= 0 || w <= 0 || h <= 0) return;
  ctx.save(); ctx.globalAlpha *= a; ctx.beginPath(); ctx.roundRect(x, y, w, h, Math.min(r, w / 2, h / 2));
  if (fill) { ctx.fillStyle = fill; ctx.fill(); } if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw; ctx.stroke(); } ctx.restore();
}
function text(str, x, y, { size = 60, color = P.ink, family = DISP, weight = 400, align = 'center', alpha = 1, rot = 0, sx = 1, sy = 1, stroke = null, lw = 0, shadow = null } = {}) {
  if (alpha <= 0 || sx <= 0 || sy <= 0) return;
  ctx.save(); ctx.globalAlpha *= alpha; ctx.translate(x, y); ctx.rotate(rot); ctx.scale(sx, sy);
  ctx.font = `${weight} ${size}px ${family}`; ctx.textAlign = align; ctx.textBaseline = 'middle';
  if (shadow) { ctx.fillStyle = shadow; ctx.fillText(str, 8, 10); }
  if (stroke) { ctx.lineJoin = 'round'; ctx.strokeStyle = stroke; ctx.lineWidth = lw; ctx.strokeText(str, 0, 0); }
  ctx.fillStyle = color; ctx.fillText(str, 0, 0); ctx.restore();
}
function measure(str, size, family = DISP, weight = 400) { ctx.save(); ctx.font = `${weight} ${size}px ${family}`; const w = ctx.measureText(str).width; ctx.restore(); return w; }
// 한 글자씩 튀어 오르며 찌그러졌다 펴지는 글자
function bouncy(str, cx, cy, t, start, { size = 160, color = P.ink, stagger = BEAT / 4, shadow = 'rgba(0,0,0,.18)', stroke = null, lw = 0, align = 'center', end = null, jiggle = true } = {}) {
  const chars = [...str], ws = chars.map(c => measure(c, size)), total = ws.reduce((a, b) => a + b, 0);
  let x = align === 'center' ? cx - total / 2 : cx;
  const o = end == null ? 1 : outK(t, Q(end), .25);
  const st = Q(start, BEAT / 4);
  stagger = chars.filter(c => c !== ' ').length > 8 ? BEAT / 8 : BEAT / 4;          // 글자 간격도 16분·32분음표에 고정
  let li = 0;
  chars.forEach((ch, i) => {
    if (ch === ' ') { x += ws[i]; return; }
    const land = st + (li++) * stagger;                   // 이 글자가 바닥에 닿는 박자 순간
    mark('land', land, size);
    const fall = p(t, land - .22, .22);
    if (fall <= 0) { x += ws[i]; return; }
    let y = cy - (1 - eIn(fall)) * 300, sq = 0;
    const after = t - land;
    if (after >= 0) {
      sq = Math.exp(-after * 9) * Math.cos(after * 26) * .28;               // 착지 순간 찌그러졌다 튕김
      y -= Math.max(0, Math.sin(after * 26) * Math.exp(-after * 9)) * 30;
      sq += beatPulse(t) * .06;                                              // 이후 박마다 통통
    }
    const wob = jiggle ? Math.sin(t * 6 + i) * .025 : 0;
    text(ch, x + ws[i] / 2, y + size * .2 * Math.max(0, sq), { size, color, sx: (1 + sq) * o, sy: (1 - sq) * o, rot: wob, shadow, stroke, lw, alpha: eOut(clamp(fall * 3)) });
    x += ws[i];
  });
  return total;
}
// 스티커 (돌아간 둥근 사각형 + 흰 테두리 + 그림자)
function sticker(str, x, y, t, s, { size = 44, fill = P.yellow, color = P.ink, rot = -.06, padX = 30, end = null, family = DISP } = {}) {
  const k = pop(t, s, .45) * (end == null ? 1 : outK(t, end, .25)); if (k <= 0) return;
  const w = measure(str, size, family) + padX * 2, h = size * 1.6;
  const hh = t > Q(s) + .3 ? hop(t) * 10 : 0, bp = t > Q(s) + .3 ? beatPulse(t) * .05 : 0;
  ctx.save(); ctx.translate(x, y - hh); ctx.rotate(rot + Math.sin(t * 5 + x) * .02); ctx.scale(k * (1 + bp), k * (1 - bp));
  rrect(-w / 2 + 8, -h / 2 + 10, w, h, h / 2, 'rgba(0,0,0,.18)');
  rrect(-w / 2, -h / 2, w, h, h / 2, fill, 1, P.white, 6);
  text(str, 0, 3, { size, color, family });
  ctx.restore();
}
// 장식 도형: 별, 꼬불선, 원, 삼각형
function star(x, y, r, c, rot = 0, a = 1) {
  if (r <= 0) return; ctx.save(); ctx.globalAlpha *= a; ctx.translate(x, y); ctx.rotate(rot); ctx.fillStyle = c; ctx.beginPath();
  for (let i = 0; i < 10; i++) { const rr = i % 2 ? r * .45 : r, an = i / 10 * Math.PI * 2 - Math.PI / 2; ctx.lineTo(Math.cos(an) * rr, Math.sin(an) * rr); }
  ctx.closePath(); ctx.fill(); ctx.restore();
}
function squiggle(x, y, len, c, t, a = 1, w = 14) {
  ctx.save(); ctx.globalAlpha *= a; ctx.strokeStyle = c; ctx.lineWidth = w; ctx.lineCap = 'round'; ctx.beginPath();
  for (let i = 0; i <= 40; i++) { const u = i / 40; const px = x + u * len, py = y + Math.sin(u * Math.PI * 4 + t * 6) * 18; i ? ctx.lineTo(px, py) : ctx.moveTo(px, py); }
  ctx.stroke(); ctx.restore();
}
function tri(x, y, r, c, rot, a = 1) { ctx.save(); ctx.globalAlpha *= a; ctx.translate(x, y); ctx.rotate(rot); ctx.fillStyle = c; ctx.beginPath(); ctx.moveTo(0, -r); ctx.lineTo(r * .87, r * .5); ctx.lineTo(-r * .87, r * .5); ctx.closePath(); ctx.fill(); ctx.restore(); }
// 떠다니는 장식들
function confettiField(t, seed, colors, n = 18, a = 1) {
  const r = rng(seed);
  for (let i = 0; i < n; i++) {
    const x = r() * W, y = r() * H, s = 14 + r() * 26, sp = .6 + r(), kind = Math.floor(r() * 4), c = colors[Math.floor(r() * colors.length)], ph = r() * 6;
    const yy = y + Math.sin(t * sp + ph) * 20 - hop(t + (i % 2) * BEAT / 2) * 22, xx = x + Math.cos(t * sp + ph) * 20, rot = t * sp + ph + beatPulse(t) * .6;
    const k = (1 + beatPulse(t) * .35);
    if (kind === 0) star(xx, yy, s * k, c, rot, a); else if (kind === 1) circle(xx, yy, s * .6 * k, c, a); else if (kind === 2) tri(xx, yy, s * k, c, rot, a);
    else { ctx.save(); ctx.globalAlpha = a; ctx.translate(xx, yy); ctx.rotate(rot); ctx.fillStyle = c; ctx.fillRect(-s * .7, -s * .2, s * 1.4, s * .4); ctx.restore(); }
  }
}
// 색종이 폭발
function burst(t, s, x, y, seed, colors, n = 40, power = 700) {
  s = Q(s); mark('burst', s);
  const k = p(t, s, 1.6); if (k <= 0 || k >= 1) return;
  const r = rng(seed);
  for (let i = 0; i < n; i++) {
    const an = r() * Math.PI * 2, sp = power * (.4 + r() * .8), c = colors[i % colors.length], sz = 10 + r() * 16, spin = (r() - .5) * 20;
    const tt = k * 1.6, px = x + Math.cos(an) * sp * tt * (1 - k * .35), py = y + Math.sin(an) * sp * tt * (1 - k * .35) + 520 * tt * tt;
    ctx.save(); ctx.globalAlpha = 1 - eIn(k); ctx.translate(px, py); ctx.rotate(spin * tt); ctx.fillStyle = c;
    if (i % 3 === 0) { ctx.beginPath(); ctx.arc(0, 0, sz * .5, 0, Math.PI * 2); ctx.fill(); } else ctx.fillRect(-sz / 2, -sz / 4, sz, sz / 2);
    ctx.restore();
  }
}
// 원이 퍼지며 다음 장면 색으로 전환
function wipe(t, s, x, y, c, d = .5) { s = Q(s); mark('wipe', s); const k = eIO(p(t, s, d)); if (k <= 0) return false; circle(x, y, k * Math.hypot(W, H), c); return k >= 1; }
function mouse(x, y, s = 1) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s); ctx.fillStyle = P.white; ctx.strokeStyle = P.ink; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, 44); ctx.lineTo(12, 33); ctx.lineTo(20, 52); ctx.lineTo(28, 49); ctx.lineTo(20, 30); ctx.lineTo(35, 30); ctx.closePath(); ctx.fill(); ctx.stroke(); ctx.restore();
}

// ============================================================
// 장면
// ============================================================
// 0–4 : 우리는 교육플랫폼팀!
function s1(t) {
  bg(P.red);
  confettiField(t, 3, [P.yellow, P.white, P.pink, P.blue], 22, eOut(p(t, .2, .6)));
  // 큰 원들이 박자마다 튐
  [[260, 220, 120, P.yellow], [1700, 860, 160, P.blue], [1640, 200, 70, P.white], [300, 900, 90, P.pink]].forEach(([x, y, r, c], i) => circle(x, y - hop(t + i * .25) * 16, r * pop(t, i * .25, .4) * (1 + beatPulse(t) * .14), c, .95));
  sticker('Hello, World!', 960, 300, t, .3, { size: 40, fill: P.white, color: P.red, family: MONO, rot: -.08 });
  bouncy('우리는', 960, 470, t, .6, { size: 120, color: P.white, shadow: 'rgba(0,0,0,.18)' });
  bouncy('교육플랫폼팀!', 960, 660, t, 1.1, { size: 210, color: P.yellow, stroke: P.ink, lw: 14, shadow: 'rgba(0,0,0,.25)', stagger: .07 });
  squiggle(620, 830, 680, P.white, t, eOut(p(t, 2.0, .4)));
  burst(t, 1.8, 960, 640, 11, [P.yellow, P.white, P.blue, P.pink, P.mint]);
  wipe(t, 3.55, 960, 540, P.cream);
}
// 4–8 : 상상하면, 만든다! + 튀는 공이 지나가는 파이프라인
const NODES = [['연구원', P.pink], ['저작도구', P.red], ['콘텐츠', P.blue], ['교육 서비스', P.mint]];
function s2(t) {
  bg(P.cream);
  confettiField(t, 8, [P.yellow, P.pink, P.blue, P.mint], 14, .9);
  const o = outK(t, 7.8);
  const w1 = measure('상상하면, ', 120);
  bouncy('상상하면,', 200, 200, t, 4.1, { size: 120, color: P.ink, align: 'left', end: 7.9 });
  bouncy('만든다!', 200 + w1, 200, t, 4.5, { size: 120, color: P.red, align: 'left', end: 7.9 });
  const y = 640, x0 = 330, gap = 420;
  // 점선 길
  ctx.save(); ctx.globalAlpha = o; ctx.setLineDash([2, 26]); ctx.lineCap = 'round'; ctx.lineWidth = 12; ctx.strokeStyle = 'rgba(23,21,31,.25)';
  ctx.beginPath(); ctx.moveTo(x0, y); ctx.lineTo(x0 + gap * 3, y); ctx.stroke(); ctx.restore();
  NODES.forEach(([s, c], i) => {
    const x = x0 + i * gap, k = pop(t, 4.5 + i * .25, .4) * o;
    const hit = p(t, 5.0 + i * .5, .25), bump = hit > 0 && hit < 1 ? Math.sin(hit * Math.PI) * .18 : 0;
    ctx.save(); ctx.translate(x, y); ctx.scale(k * (1 + bump), k * (1 - bump * .6)); ctx.rotate((i % 2 ? .05 : -.05));
    rrect(-150 + 10, -95 + 12, 300, 190, 46, 'rgba(0,0,0,.15)'); rrect(-150, -95, 300, 190, 46, c, 1, P.white, 8);
    text(s, 0, 4, { size: s.length > 4 ? 52 : 62, color: P.white });
    ctx.restore();
  });
  // 튀는 공: 노드마다 한 박에 한 번 착지
  [5, 5.5, 6, 6.5].forEach((h, i) => mark('ball', h, i));
  const bt = (t - 5.0) / BEAT;
  if (bt > -1 && bt < 3.6) {
    const i = Math.floor(clamp(bt, 0, 3)), f = clamp(bt - i);
    const xa = x0 + Math.max(0, i - (bt < 0 ? 1 : 0)) * gap, xb = x0 + Math.min(3, i + 1) * gap;
    const x = bt < 0 ? lerp(x0 - 200, x0, eOut(bt + 1)) : i >= 3 ? x0 + 3 * gap : lerp(x0 + i * gap, x0 + (i + 1) * gap, f);
    const yy = y - 150 - Math.sin(f * Math.PI) * 170;
    const sq = f < .12 ? (1 - f / .12) * .35 : 0;
    ctx.save(); ctx.globalAlpha = o; ctx.translate(x, yy); ctx.scale(1 + sq, 1 - sq); circle(0, 0, 38, P.yellow); circle(-12, -12, 10, 'rgba(255,255,255,.7)'); ctx.restore();
  }
  sticker('우리가 만드는 것!', x0 + gap, y - 190, t, 6.2, { size: 34, fill: P.yellow, rot: .08, end: 7.9 });
  sticker('콘텐츠 양산 파이프라인', 960, 900, t, 6.6, { size: 44, fill: P.ink, color: P.white, rot: -.02, end: 7.9 });
  wipe(t, 7.55, 960, 640, P.yellow);
}
// 8–12 : 저작도구 — 블록이 통통 떨어져 문항 완성, 발행 도장 쾅!
function s3(t) {
  bg(P.yellow);
  confettiField(t, 12, [P.white, P.red, P.blue], 12, .8);
  bouncy('연구원을 위한 저작도구', 960, 150, t, 8.1, { size: 96, color: P.ink, end: 11.9, stagger: .035 });
  const o = outK(t, 11.9), k = pop(t, 8.3, .6) * o;
  const wx = 960, wy = 600, ww = 1180, wh = 640;
  ctx.save(); ctx.translate(wx, wy); ctx.rotate(-.025 + Math.sin(t * 2) * .006); ctx.scale(k, k);
  rrect(-ww / 2 + 16, -wh / 2 + 20, ww, wh, 34, 'rgba(0,0,0,.2)');
  rrect(-ww / 2, -wh / 2, ww, wh, 34, P.white, 1, P.ink, 8);
  rrect(-ww / 2, -wh / 2, ww, 70, 34, P.ink); [P.red, P.yellow, P.mint].forEach((c, i) => circle(-ww / 2 + 44 + i * 34, -wh / 2 + 35, 11, c));
  text('수학 1-2 · 문항 만들기', 0, -wh / 2 + 36, { size: 26, color: P.white, family: KR, weight: 700 });
  const blocks = [[9.0, '문제', '18 + 25 = ?', P.blue], [9.5, '보기', '① 33   ② 43   ③ 53', P.pink], [10.0, '정답', '② 43', P.mint], [10.5, '해설', '8 + 5 = 13, 받아올림 1!', P.purple]];
  blocks.forEach(([s0, lbl, body, c], i) => {
    const s = Q(s0); mark('block', s, i);                       // s = 바닥에 닿는 박자 순간
    const fall = p(t, s - .25, .25); if (fall <= 0) return;
    const after = Math.max(0, t - s);
    const y = -wh / 2 + 130 + i * 118 - (1 - eIn(fall)) * 700 - Math.max(0, Math.sin(after * 22) * Math.exp(-after * 8)) * 40, x = -ww / 2 + 50;
    const sq = after > 0 ? Math.exp(-after * 9) * Math.cos(after * 22) * .12 + beatPulse(t) * .03 : 0;
    ctx.save(); ctx.translate(0, y + 48); ctx.scale(1 + sq, 1 - sq); ctx.translate(0, -(y + 48));
    rrect(x, y, ww - 100, 96, 24, c, 1, P.ink, 5);
    rrect(x + 20, y + 22, 110, 52, 26, P.white); text(lbl, x + 75, y + 49, { size: 28, color: c });
    text(body, x + 170, y + 50, { size: lbl === '문제' ? 50 : 34, color: P.white, align: 'left', family: lbl === '해설' ? DISP : DISP });
    ctx.restore();
  });
  // 발행 도장
  mark('stamp', 11.0); const sk = p(t, 10.85, .15);
  if (sk > 0) {
    const sc = lerp(2.4, 1, eOut(sk)), a = eOut(sk);
    ctx.save(); ctx.translate(ww / 2 - 170, wh / 2 - 90); ctx.rotate(-.18); ctx.scale(sc, sc); ctx.globalAlpha = a;
    rrect(-130, -58, 260, 116, 22, null, 1, P.red, 10); text('발행!', 0, 4, { size: 70, color: P.red }); ctx.restore();
  }
  ctx.restore();
  // 커서가 블록을 톡톡
  const cur = blocks.find(([s]) => t >= s - .3 && t < s + .3);
  const mx = cur ? lerp(1500, 1200, eOut(p(t, cur[0] - .3, .3))) : 1540, my = cur ? 380 + blocks.indexOf(cur) * 118 : 900;
  if (t > 8.6 && o > 0) mouse(mx, my, 1.4);
  burst(t, 11.0, 1500, 820, 21, [P.red, P.ink, P.white, P.blue]);
  wipe(t, 11.55, 1500, 820, P.blue);
}
// 12–16 : 하나를 만들면 → 모두에게! (카드가 2배씩 늘어남)
function s4(t) {
  bg(P.blue);
  confettiField(t, 16, [P.yellow, P.white, P.pink], 14, .8);
  const o = outK(t, 15.9);
  const steps = [1, 2, 4, 8, 16, 32, 64, 128], si = clamp(Math.floor((t - 12.5) / BEAT), 0, steps.length - 1), n = steps[si];
  steps.forEach((_, i) => mark('double', 12.5 + i * BEAT, i));
  const cols = Math.ceil(Math.sqrt(n * 16 / 9)), rows = Math.ceil(n / cols);
  const cw = Math.min(260, 1500 / cols), ch = cw * .66, g = cw * .14;
  const gw = cols * cw + (cols - 1) * g, gh = rows * ch + (rows - 1) * g, gx = (W - gw) / 2, gy = 620 - gh / 2;
  const since = p(t, 12.5 + si * BEAT, .22);
  const colors = [P.white, P.yellow, P.pink, P.mint];
  for (let i = 0; i < n; i++) {
    const c = i % cols, r = Math.floor(i / cols), x = gx + c * (cw + g), y = gy + r * (ch + g);
    const isNew = i >= n / 2 && si > 0, k = isNew ? eBack(since) : 1;
    if (k <= 0) continue;
    ctx.save(); ctx.globalAlpha = o; ctx.translate(x + cw / 2, y + ch / 2 - hop(t + (i % 2) * BEAT / 2) * ch * .06); ctx.scale(k * (1 + beatPulse(t) * .05), k * (1 - beatPulse(t) * .05)); ctx.rotate(Math.sin(i * 1.7 + t * 3) * .04);
    rrect(-cw / 2, -ch / 2, cw, ch, cw * .12, colors[i % 4], 1, P.ink, Math.max(2, cw * .025));
    rrect(-cw * .38, -ch * .26, cw * .45, ch * .12, ch * .06, P.ink);
    rrect(-cw * .38, -ch * .02, cw * .7, ch * .09, ch * .05, 'rgba(23,21,31,.35)'); rrect(-cw * .38, ch * .16, cw * .5, ch * .09, ch * .05, 'rgba(23,21,31,.35)');
    ctx.restore();
  }
  text(`×${n}`, 1700, 200, { size: 110 * (1 + beatPulse(t) * .25), color: P.yellow, stroke: P.ink, lw: 10, alpha: o * eOut(p(t, 12.5, .2)), rot: .08 });
  bouncy('하나를 만들면', 200, 170, t, 12.2, { size: 96, color: P.white, align: 'left', end: 15.9, stagger: .04 });
  bouncy('모두에게!', 200 + measure('하나를 만들면 ', 96), 170, t, 12.8, { size: 96, color: P.yellow, align: 'left', end: 15.9, stroke: P.ink, lw: 8 });

  wipe(t, 15.55, 960, 540, P.mint);
}
// 16–20 : 웹도! 앱도! (브라우저·폰이 번갈아 통통)
function device(kind, x, y, s, t, hop) {
  ctx.save(); ctx.translate(x, y - hop); ctx.scale(s, s);
  if (kind === 'web') {
    rrect(-330 + 14, -210 + 18, 660, 420, 30, 'rgba(0,0,0,.2)'); rrect(-330, -210, 660, 420, 30, P.white, 1, P.ink, 8);
    rrect(-330, -210, 660, 60, 30, P.ink); [P.red, P.yellow, P.mint].forEach((c, i) => circle(-290 + i * 30, -180, 10, c));
    screen(t, -290, -120, 580, 300);
  } else {
    rrect(-150 + 14, -290 + 18, 300, 580, 56, 'rgba(0,0,0,.2)'); rrect(-150, -290, 300, 580, 56, P.ink);
    rrect(-132, -272, 264, 544, 44, P.white); rrect(-50, -262, 100, 24, 12, P.ink);
    screen(t, -110, -210, 220, 440);
  }
  ctx.restore();
}
function screen(t, x, y, w, h) {
  const prog = clamp((t - 16.6) / 2.6);
  text('오늘의 스스로학습', x + 10, y + 26, { size: Math.min(34, w / 9), color: P.red, align: 'left' });
  rrect(x + 10, y + 60, w - 20, 22, 11, '#EEE'); rrect(x + 10, y + 60, (w - 20) * prog, 22, 11, P.red);
  const items = [['덧셈', P.blue], ['뺄셈', P.pink], ['수의 순서', P.mint]];
  items.forEach(([s, c], i) => {
    const yy = y + 104 + i * Math.min(70, (h - 110) / 3); if (yy + 50 > y + h) return;
    const done = prog > (i + 1) / 3.3;
    rrect(x + 10, yy, w - 20, 54, 16, done ? c : '#F4F1EC', 1, P.ink, 3);
    text(s, x + 30, yy + 28, { size: 28, color: done ? P.white : P.ink, align: 'left' });
    if (done) star(x + w - 40, yy + 27, 16, P.yellow, t * 2);
  });
}
function s5(t) {
  bg(P.mint);
  confettiField(t, 20, [P.white, P.yellow, P.blue, P.pink], 16, .85);
  const o = outK(t, 19.9);
  const beatIdx = Math.floor((t - 16) / BEAT);
  const hopW = hop(t) * 60 * (beatIdx % 2 === 0 ? 1 : .15), hopA = hop(t) * 60 * (beatIdx % 2 === 1 ? 1 : .15);
  for (let i = 0; i < 8; i++) mark('device', 16.5 + i * BEAT, i % 2);
  device('web', 700, 610, pop(t, 16.3, .5) * o, t, hopW);
  device('app', 1450, 600, pop(t, 16.7, .5) * o, t, hopA);
  bouncy('웹도!', 480, 180, t, 16.3, { size: 130, color: P.white, stroke: P.ink, lw: 10, end: 19.9 });
  bouncy('앱도!', 1450, 180, t, 16.8, { size: 130, color: P.yellow, stroke: P.ink, lw: 10, end: 19.9 });
  // 하트처럼 오가는 동기화 점
  for (let j = 0; j < 4; j++) { const u = ((t - 17.2) * .8 + j / 4) % 1; if (t > 17.2) circle(lerp(1040, 1300, u), 620 - Math.sin(u * Math.PI) * 90, 14, P.red, o * Math.sin(u * Math.PI)); }
  sticker('하나의 코드로 어디서나!', 960, 990, t, 18.2, { size: 44, fill: P.ink, color: P.white, rot: -.02, end: 19.9 });
  wipe(t, 19.55, 1450, 600, P.ink);
}
// 20–25 : AI랑 같이, 더 빠르게!
function s6(t) {
  bg(P.ink);
  const o = outK(t, 24.8);
  // 네온 느낌 반짝이
  const r = rng(31);
  for (let i = 0; i < 40; i++) { const x = r() * W, y = r() * H, c = [P.pink, P.blue, P.yellow, P.mint][i % 4]; star(x, y, (8 + r() * 14) * (.6 + .6 * Math.abs(Math.sin(t * 3 + i))), c, t + i, .8 * o); }
  bouncy('AI랑 같이,', 960, 170, t, 20.2, { size: 120, color: P.white, end: 24.9 });
  bouncy('더 빠르게!', 960, 320, t, 20.7, { size: 140, color: P.pink, end: 24.9, stroke: P.white, lw: 6 });
  // AI 캐릭터 (둥근 로봇 얼굴)
  const bk = pop(t, 21.0, .4) * o, bob = -hop(t) * 22;
  ctx.save(); ctx.translate(1560, 640 + bob); ctx.scale(bk, bk);
  rrect(-150 + 12, -130 + 16, 300, 260, 90, 'rgba(0,0,0,.3)'); rrect(-150, -130, 300, 260, 90, P.blue, 1, P.white, 8);
  const blink = (t % 2.1) < .1 ? .15 : 1;
  ctx.save(); ctx.scale(1, blink); circle(-55, -10 / blink, 26, P.white); circle(55, -10 / blink, 26, P.white); ctx.restore();
  circle(-55, -10, 12 * blink, P.ink); circle(55, -10, 12 * blink, P.ink);
  ctx.strokeStyle = P.white; ctx.lineWidth = 10; ctx.lineCap = 'round'; ctx.beginPath(); ctx.arc(0, 40, 36, .15 * Math.PI, .85 * Math.PI); ctx.stroke();
  ctx.strokeStyle = P.white; ctx.lineWidth = 8; ctx.beginPath(); ctx.moveTo(0, -130); ctx.lineTo(0, -185); ctx.stroke(); circle(0, -195, 18 * (1 + beatPulse(t) * .4), P.yellow);
  ctx.restore();
  // 말풍선에 프롬프트 타이핑
  const bb = pop(t, 21.0, .45) * o;
  ctx.save(); ctx.translate(700, 520); ctx.scale(bb, bb);
  rrect(-520, -80, 1040, 160, 60, P.white, 1, P.ink, 6);
  const prompt = '덧셈 문항 5개랑 해설 만들어 줘!';
  const n = Math.floor(clamp((t - 21.3) / 1.2) * prompt.length);
  text(prompt.slice(0, n), -470, 4, { size: 52, color: P.ink, align: 'left' });
  ctx.beginPath(); ctx.moveTo(470, 60); ctx.lineTo(560, 110); ctx.lineTo(430, 76); ctx.fillStyle = P.white; ctx.fill();
  ctx.restore();
  // 결과 카드가 톡톡 튀어나옴
  const cards = ['27 + 35', '48 + 16', '53 + 29', '66 + 18', '39 + 44'], cc = [P.yellow, P.pink, P.mint, P.blue, P.purple];
  cards.forEach((s, i) => {
    const k = pop(t, 22.75 + i * .25, .35) * o; if (k <= 0) return;
    const x = 290 + i * 240, y = 780 + (i % 2 ? 30 : -10);
    ctx.save(); ctx.translate(x, y); ctx.rotate((i - 2) * .06); ctx.scale(k, k);
    rrect(-105 + 8, -85 + 10, 210, 170, 30, 'rgba(0,0,0,.3)'); rrect(-105, -85, 210, 170, 30, cc[i], 1, P.white, 6);
    text(`Q${i + 1}`, 0, -40, { size: 30, color: P.white }); text(s, 0, 20, { size: 44, color: P.ink, family: EN, weight: 800 });

  burst(t, 22.75, 900, 780, 41, [P.yellow, P.pink, P.mint, P.blue, P.white], 36, 600);
  sticker('사람의 아이디어 + AI의 속도', 960, 1000, t, 23.6, { size: 40, fill: P.yellow, rot: .02, end: 24.9 });
  wipe(t, 24.6, 1560, 640, P.red);
}
// 25–30 : 열정 ON! → 교육의 미래를, 코드로.
function s7(t) {
  bg(P.red);
  confettiField(t, 25, [P.yellow, P.white, P.pink, P.blue, P.mint], 24, eOut(p(t, 25.2, .5)));
  // 토글 스위치가 딸깍 켜짐
  mark('toggle', 25.5); const on = eElastic(p(t, 25.5, .6)), tk = pop(t, 25.0, .35);
  ctx.save(); ctx.translate(1010, 300); ctx.scale(tk, tk);
  rrect(-190 + 10, -80 + 12, 380, 160, 80, 'rgba(0,0,0,.2)');
  rrect(-190, -80, 380, 160, 80, on > .5 ? P.yellow : '#B00010', 1, P.white, 8);
  circle(lerp(-110, 110, on), 0, 62, P.white); text(on > .5 ? 'ON' : 'OFF', lerp(80, -80, on), 4, { size: 48, color: on > .5 ? P.ink : P.white, family: EN, weight: 900 });
  ctx.restore();
  bouncy('열정', 500, 300, t, 25.3, { size: 130, color: P.white, stroke: P.ink, lw: 10 });
  burst(t, 25.5, 1010, 300, 51, [P.yellow, P.white, P.pink, P.blue, P.mint], 60, 900);
  bouncy('교육의 미래를,', 960, 560, t, 26.0, { size: 150, color: P.white, shadow: 'rgba(0,0,0,.2)', stagger: .05 });
  bouncy('코드로.', 960, 740, t, 26.6, { size: 190, color: P.yellow, stroke: P.ink, lw: 14, shadow: 'rgba(0,0,0,.25)', stagger: .08 });
  sticker('재능교육 교육플랫폼팀', 960, 925, t, 27.4, { size: 50, fill: P.white, color: P.red, rot: -.03 });
  text('Frontend · Web & App · AI', 960, 1015, { size: 26, color: P.white, family: EN, weight: 700, alpha: eOut(p(t, 27.8, .4)) });
  const f = p(t, 29.3, .7); if (f > 0) { ctx.fillStyle = `rgba(0,0,0,${eIO(f)})`; ctx.fillRect(-200, -200, W + 400, H + 400); }
}

function draw(t) {
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1;
  // 박마다 화면 전체가 통 (줌 펄스), 큰 순간(장면 전환·도장·폭발·토글)엔 쿵 흔들림
  const hits = [0, 4, 8, 11, 12, 16, 20, 22.75, 25, 25.5, 26.5];
  let shake = beatPulse(t) * 4;
  hits.forEach(h => { const k = p(t, h, .3); if (k > 0 && k < 1) shake += (1 - k) * 22; });
  const r = rng(1 + Math.floor(t * 30));
  const sx = (r() - .5) * shake, sy = (r() - .5) * shake, zoom = 1 + beatPulse(t) * .018 + (Math.floor(t / BEAT) % 4 === 0 ? beatPulse(t) * .012 : 0);
  ctx.translate(W / 2 + sx, H / 2 + sy); ctx.scale(zoom, zoom); ctx.translate(-W / 2, -H / 2);
  if (t < 4) s1(t); else if (t < 8) s2(t); else if (t < 12) s3(t); else if (t < 16) s4(t); else if (t < 20) s5(t); else if (t < 25) s6(t); else s7(t);
}

// ---------- preview player ----------
const seekEl = document.getElementById('seek'), timeEl = document.getElementById('time'), playEl = document.getElementById('play');
let playing = false, t0 = 0, tCur = 0;
const audio = new Audio('audio/mix.wav'); audio.preload = 'auto';
function show(t) { tCur = t; draw(t); seekEl.value = t; timeEl.textContent = t.toFixed(2) + 's'; }
function loop(now) {
  if (!playing) return;
  const t = (now - t0) / 1000;
  if (t >= DURATION) { playing = false; playEl.textContent = '▶ 재생'; audio.pause(); show(DURATION); return; }
  show(t); requestAnimationFrame(loop);
}
playEl.onclick = () => {
  playing = !playing; playEl.textContent = playing ? '❚❚ 정지' : '▶ 재생';
  if (playing) { if (tCur >= DURATION) tCur = 0; t0 = performance.now() - tCur * 1000; try { audio.currentTime = tCur; audio.play().catch(() => {}); } catch (e) {} requestAnimationFrame(loop); }
  else audio.pause();
};
seekEl.oninput = () => { show(+seekEl.value); if (playing) { t0 = performance.now() - tCur * 1000; try { audio.currentTime = tCur; } catch (e) {} } };

window.draw = draw;
window.collectEvents = () => { EV.clear(); for (let f = 0; f <= DURATION * 30; f++) draw(f / 30); return [...EV.values()].sort((a, b) => a.t - b.t); };
window.DURATION = DURATION;
window.ready = Promise.all([document.fonts.load(`100px 'Black Han Sans'`, '가'), document.fonts.load(`700 100px 'Noto Sans KR'`, '가'), document.fonts.load(`800 100px 'Inter'`, 'A'), document.fonts.load(`500 100px 'JetBrains Mono'`, 'a')]).then(r => {
  if (r.some(fs => !fs.length)) throw new Error('폰트를 불러오지 못했습니다 (fonts/ 폴더 확인)');
}).then(() => document.fonts.ready).then(() => { if (location.search.includes('render')) document.body.classList.add('render'); show(0); return true; });
