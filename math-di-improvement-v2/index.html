<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>JEI Math Grades D–I Improvement Plan v2</title>
<style>
  html, body { margin: 0; background: #0E1424; }
  canvas { display: block; width: 1920px; height: 1080px; }
  body.fit canvas { width: 100vw; height: auto; }
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script src="timeline.js"></script>
<script>
// ------------------------------------------------------------
// JEI Math Grades D–I Improvement Plan — v2 (same narration as ../math-di-improvement, new visuals)
// Concept: one continuous sheet of graph paper. Each scene is a workbook page; the camera slides sideways between pages
// and stays still while the page is read. Teacher's-pen marks (circles, checks, highlighter, sticky notes, stamps).
// draw(t) is a pure function of time. Cue times come from timeline.js (written by ../math-di-improvement/build_audio.py).
// Renderer contract (render.js): window.READY, window.DURATION, window.seek(t).
// ------------------------------------------------------------
const W = 1920, H = 1080, TL = window.TIMELINE, SC = TL.scenes, DURATION = TL.duration;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const SANS = "'Avenir Next', 'Helvetica Neue', Arial, sans-serif";
const HAND = "'Noteworthy', 'Bradley Hand', 'Marker Felt', cursive";
const K = {
  paper: '#F7F9FC', grid: '#E2E9F3', gridMajor: '#CCD8E9', margin: '#F1A9A4',
  ink: '#18264A', muted: '#66748F', line: '#D5DDEA',
  blue: '#2B59E0', blueSoft: '#E6EDFF', red: '#E0362C', redSoft: '#FDE9E7',
  green: '#1D9A60', greenSoft: '#E2F5EC', orange: '#EE8A23', orangeSoft: '#FDF0E1', teal: '#14A0A6',
  hi: 'rgba(255,212,40,.5)', sticky: '#FFE47A',
};

// ---------- basics ----------
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;
const p = (t, s, d) => clamp((t - s) / d);
const eOut = x => 1 - Math.pow(1 - x, 3), eIO = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const eBack = x => { const c1 = 1.7, c3 = c1 + 1; return x <= 0 ? 0 : 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const nz = (i, s = 1) => { const v = Math.sin(i * 12.9898 + s * 78.233) * 43758.5453; return v - Math.floor(v) - .5; };   // fixed jitter (no flicker)
function rgba(hex, a) { const n = parseInt(hex.slice(1), 16); return `rgba(${n >> 16 & 255},${n >> 8 & 255},${n & 255},${a})`; }

function rr(x, y, w, h, r, fill, stroke, lw = 2, a = 1) { if (a <= 0) return; ctx.save(); ctx.globalAlpha *= a; ctx.beginPath(); ctx.roundRect(x, y, w, h, r); if (fill) { ctx.fillStyle = fill; ctx.fill(); } if (stroke) { ctx.lineWidth = lw; ctx.strokeStyle = stroke; ctx.stroke(); } ctx.restore(); }
function card(x, y, w, h, { fill = '#FFFFFF', stroke = K.line, r = 16, a = 1, shadow = true } = {}) {
  if (a <= 0) return; ctx.save(); ctx.globalAlpha *= a;
  if (shadow) { ctx.shadowColor = 'rgba(24,38,74,.10)'; ctx.shadowBlur = 22; ctx.shadowOffsetY = 8; }
  ctx.beginPath(); ctx.roundRect(x, y, w, h, r); ctx.fillStyle = fill; ctx.fill(); ctx.shadowColor = 'transparent';
  if (stroke) { ctx.lineWidth = 2; ctx.strokeStyle = stroke; ctx.stroke(); } ctx.restore();
}
function measure(str, size, weight = 600, fam = SANS) { ctx.save(); ctx.font = `${weight} ${size}px ${fam}`; const w = ctx.measureText(str).width; ctx.restore(); return w; }
function text(str, x, y, { size = 36, weight = 600, fam = SANS, color = K.ink, align = 'left', alpha = 1, maxW, spacing = 0 } = {}) {
  if (alpha <= 0 || !str) return; ctx.save(); ctx.globalAlpha *= alpha;
  let sz = size; if (maxW) { const w = measure(str, size, weight, fam) + spacing * str.length; if (w > maxW) sz = size * maxW / w; }
  ctx.font = `${weight} ${sz}px ${fam}`; ctx.textAlign = align; ctx.textBaseline = 'middle'; ctx.fillStyle = color;
  if (spacing) ctx.letterSpacing = spacing + 'px';
  ctx.fillText(str, x, y); ctx.restore();
}
// word-wrapped paragraph; returns the number of lines
function para(str, x, y, maxW, lh, o = {}) {
  const words = str.split(' '), lines = []; let cur = '';
  words.forEach(w => { const t = cur ? cur + ' ' + w : w; if (cur && measure(t, o.size || 36, o.weight || 600, o.fam || SANS) > maxW) { lines.push(cur); cur = w; } else cur = t; });
  if (cur) lines.push(cur);
  lines.forEach((l, i) => text(l, x, y + i * lh, o)); return lines.length;
}
// entrance: fade + rise (+ optional pop around ox, oy). Moves only while entering, then stays put
function enter(t, t0, fn, { d = .55, dy = 26, pop = false, ox = 960, oy = 540 } = {}) {
  const k = p(t, t0, d); if (k <= 0) return 0;
  ctx.save(); ctx.globalAlpha *= clamp(k * 1.5);
  if (pop) { const s = lerp(.5, 1, eBack(k)); ctx.translate(ox, oy); ctx.scale(s, s); ctx.translate(-ox, -oy); }
  else ctx.translate(0, (1 - eOut(k)) * dy);
  fn(k); ctx.restore(); return k;
}

// ---------- teacher's pen ----------
function strokePts(pts, k, color, lw = 5, a = 1, dash) {
  if (k <= 0 || a <= 0 || pts.length < 2) return;
  let L = 0; const seg = []; for (let i = 1; i < pts.length; i++) { const d = Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]); seg.push(d); L += d; }
  let left = L * clamp(k);
  ctx.save(); ctx.globalAlpha *= a; ctx.strokeStyle = color; ctx.lineWidth = lw; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; if (dash) ctx.setLineDash(dash);
  ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length && left > 0; i++) { const f = Math.min(1, left / seg[i - 1]); ctx.lineTo(lerp(pts[i - 1][0], pts[i][0], f), lerp(pts[i - 1][1], pts[i][1], f)); left -= seg[i - 1]; }
  ctx.stroke(); ctx.restore();
}
function wobble(x1, y1, x2, y2, seed = 1, amp = 1.6, n = 14) {
  const dx = x2 - x1, dy = y2 - y1, L = Math.hypot(dx, dy) || 1, nx = -dy / L, ny = dx / L, pts = [];
  for (let i = 0; i <= n; i++) { const f = i / n, j = (i === 0 || i === n) ? 0 : nz(i, seed) * amp * 2; pts.push([x1 + dx * f + nx * j, y1 + dy * f + ny * j]); }
  return pts;
}
const pen = (x1, y1, x2, y2, k, c = K.red, lw = 5, seed = 1, a = 1, dash) => strokePts(wobble(x1, y1, x2, y2, seed), k, c, lw, a, dash);
function penCircle(cx, cy, rx, ry, k, c = K.red, lw = 5, seed = 1, a = 1) {
  const pts = [], a0 = -2.3 + nz(1, seed) * .4, n = 56;
  for (let i = 0; i <= n; i++) { const ang = a0 + (i / n) * Math.PI * 2.12, r = 1 + nz(i, seed) * .05 + (i / n) * .06; pts.push([cx + Math.cos(ang) * rx * r, cy + Math.sin(ang) * ry * r]); }
  strokePts(pts, k, c, lw, a);
}
function penArrow(x1, y1, x2, y2, k, c = K.red, lw = 5, seed = 1, a = 1) {
  pen(x1, y1, x2, y2, clamp(k / .8), c, lw, seed, a);
  const hk = clamp((k - .75) / .25); if (hk <= 0) return;
  const ang = Math.atan2(y2 - y1, x2 - x1), s = 18 + lw;
  pen(x2, y2, x2 - Math.cos(ang - .5) * s, y2 - Math.sin(ang - .5) * s, hk, c, lw, seed + 3, a);
  pen(x2, y2, x2 - Math.cos(ang + .5) * s, y2 - Math.sin(ang + .5) * s, hk, c, lw, seed + 5, a);
}
function penCurve(x1, y1, cx, cy, x2, y2, k, c = K.red, lw = 5, a = 1, arrow = false) {
  const pts = []; for (let i = 0; i <= 30; i++) { const f = i / 30; pts.push([(1 - f) * (1 - f) * x1 + 2 * (1 - f) * f * cx + f * f * x2, (1 - f) * (1 - f) * y1 + 2 * (1 - f) * f * cy + f * f * y2]); }
  strokePts(pts, arrow ? clamp(k / .85) : k, c, lw, a);
  if (arrow) { const hk = clamp((k - .8) / .2); if (hk > 0) { const ang = Math.atan2(y2 - cy, x2 - cx), s = 16 + lw; pen(x2, y2, x2 - Math.cos(ang - .5) * s, y2 - Math.sin(ang - .5) * s, hk, c, lw, 7, a); pen(x2, y2, x2 - Math.cos(ang + .5) * s, y2 - Math.sin(ang + .5) * s, hk, c, lw, 9, a); } }
}
function check(x, y, s, k, c = K.green, lw = 7) { strokePts([[x - s * .5, y], [x - s * .12, y + s * .38], [x + s * .55, y - s * .45]], k, c, lw); }
function crossMark(x, y, s, k, c = K.red, lw = 6) { pen(x - s / 2, y - s / 2, x + s / 2, y + s / 2, clamp(k * 2), c, lw, 2); pen(x + s / 2, y - s / 2, x - s / 2, y + s / 2, clamp(k * 2 - 1), c, lw, 4); }
function hiLite(x, y, w, h, k, c = K.hi) { if (k <= 0) return; const e = eOut(k); ctx.save(); ctx.fillStyle = c; ctx.beginPath(); ctx.moveTo(x, y + 4); ctx.lineTo(x + w * e, y); ctx.lineTo(x + w * e - 6, y + h); ctx.lineTo(x - 4, y + h - 3); ctx.closePath(); ctx.fill(); ctx.restore(); }
function hbox(x, y, w, h, k, c = K.ink, lw = 4, seed = 3) { strokePts([...wobble(x, y, x + w, y, seed, 1), ...wobble(x + w, y, x + w, y + h, seed + 1, 1).slice(1), ...wobble(x + w, y + h, x, y + h, seed + 2, 1).slice(1), ...wobble(x, y + h, x, y, seed + 3, 1).slice(1)], k, c, lw); }
function sticky(x, y, w, h, rot, k, lines, { size = 32, color = K.ink } = {}) {
  if (k <= 0) return; const s = lerp(.6, 1, eBack(k));
  ctx.save(); ctx.globalAlpha *= clamp(k * 2); ctx.translate(x + w / 2, y + h / 2); ctx.rotate(rot); ctx.scale(s, s);
  ctx.shadowColor = 'rgba(24,38,74,.18)'; ctx.shadowBlur = 16; ctx.shadowOffsetY = 8; ctx.fillStyle = K.sticky; ctx.fillRect(-w / 2, -h / 2, w, h); ctx.shadowColor = 'transparent';
  ctx.fillStyle = 'rgba(0,0,0,.05)'; ctx.fillRect(-w / 2, -h / 2, w, 26);
  lines.forEach((l, i) => text(l, 0, (i - (lines.length - 1) / 2) * size * 1.25 + 8, { size, weight: 700, fam: HAND, color, align: 'center', maxW: w - 30 }));
  ctx.restore();
}
function stamp(lines, x, y, k, c = K.red, rot = -.1, { r = 130 } = {}) {
  if (k <= 0) return; const s = lerp(1.7, 1, eOut(k));
  ctx.save(); ctx.globalAlpha *= clamp(k * 3) * .92; ctx.translate(x, y); ctx.rotate(rot); ctx.scale(s, s);
  ctx.strokeStyle = c; ctx.lineWidth = 7; ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.stroke();
  ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(0, 0, r - 14, 0, Math.PI * 2); ctx.stroke();
  lines.forEach(([str, sz], i) => text(str, 0, (i - (lines.length - 1) / 2) * sz * 1.15, { size: sz, weight: 800, color: c, align: 'center', maxW: r * 1.6, spacing: 2 }));
  ctx.restore();
}
function chip(str, x, y, { size = 22, fill = K.blue, color = '#FFFFFF', a = 1, pad = 16, weight = 700, spacing = 1.5 } = {}) {
  if (a <= 0) return 0; const w = measure(str, size, weight) + spacing * str.length + pad * 2, h = size * 1.8;
  rr(x, y - h / 2, w, h, h / 2, fill, null, 0, a); text(str, x + pad, y + 1, { size, weight, color, alpha: a, spacing }); return w;
}
function sheet(x, y, w, h, rot = 0, a = 1, lines = 5) {
  if (a <= 0) return; ctx.save(); ctx.globalAlpha *= a; ctx.translate(x, y); ctx.rotate(rot);
  ctx.shadowColor = 'rgba(24,38,74,.12)'; ctx.shadowBlur = 12; ctx.shadowOffsetY = 5; ctx.fillStyle = '#FFFFFF'; ctx.fillRect(-w / 2, -h / 2, w, h); ctx.shadowColor = 'transparent';
  ctx.strokeStyle = K.line; ctx.lineWidth = 2; ctx.strokeRect(-w / 2, -h / 2, w, h);
  ctx.strokeStyle = '#C9D3E3'; ctx.lineWidth = 4; for (let i = 0; i < lines; i++) { const yy = -h / 2 + h * .2 + i * h * .7 / lines; ctx.beginPath(); ctx.moveTo(-w / 2 + w * .14, yy); ctx.lineTo(w / 2 - w * (i % 2 ? .3 : .14), yy); ctx.stroke(); }
  ctx.restore();
}

// ---------- page furniture ----------
function paper(cam) {
  ctx.fillStyle = K.paper; ctx.fillRect(0, 0, W, H);
  const off = ((cam % 40) + 40) % 40;
  ctx.lineWidth = 1; ctx.strokeStyle = K.grid; ctx.beginPath();
  for (let x = -off; x <= W; x += 40) { ctx.moveTo(Math.round(x) + .5, 0); ctx.lineTo(Math.round(x) + .5, H); }
  for (let y = 0; y <= H; y += 40) { ctx.moveTo(0, y + .5); ctx.lineTo(W, y + .5); }
  ctx.stroke();
  const offM = ((cam % 200) + 200) % 200;
  ctx.strokeStyle = K.gridMajor; ctx.beginPath();
  for (let x = -offM; x <= W; x += 200) { ctx.moveTo(Math.round(x) + .5, 0); ctx.lineTo(Math.round(x) + .5, H); }
  for (let y = 0; y <= H; y += 200) { ctx.moveTo(0, y + .5); ctx.lineTo(W, y + .5); }
  ctx.stroke();
}
function pageFurniture(i) {
  ctx.save(); ctx.strokeStyle = K.margin; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(150, 0); ctx.lineTo(150, H); ctx.stroke(); ctx.restore();
  text('JEI Math Grades D–I  ·  Improvement Plan', 210, 1036, { size: 18, weight: 500, color: K.muted });
  text(`p. ${i + 1}`, 1800, 1036, { size: 22, weight: 700, fam: HAND, color: K.muted, align: 'right' });
}
// section tab + title (top-left). Slides in once, then stays still
function header(u, tab, title, col = K.blue) {
  const k1 = eOut(p(u, .15, .5)), k2 = eOut(p(u, .3, .6));
  if (k1 > 0) { ctx.save(); ctx.translate((1 - k1) * -30, 0); chip(tab, 210, 92, { size: 18, fill: col, a: k1, spacing: 2.5 }); ctx.restore(); }
  if (k2 > 0) { ctx.save(); ctx.translate((1 - k2) * -30, 0); text(title, 210, 160, { size: 56, weight: 700, alpha: k2, maxW: 1560 }); ctx.restore(); }
}

// ---------- images ----------
const IMG = {}; const imgReady = Promise.all(['rabbit_l', 'rabbit_r'].map(n => new Promise(res => { const im = new Image(); im.onload = res; im.onerror = res; im.src = `assets/${n}.png`; IMG[n] = im; })));
function img(name, x, y, w, h, a = 1) { const im = IMG[name]; if (!im || !im.complete || !im.naturalWidth || a <= 0) return; ctx.save(); ctx.globalAlpha *= a; ctx.drawImage(im, x, y, w, h); ctx.restore(); }

// ============================================================
// scenes: f(u, c) — u = seconds since the scene started, c = cue times (seconds since scene start)
// ============================================================
const S = {};

// 1. title — grade cards D–I, agenda ticked off as it is read
S.intro = (u, c) => {
  const cols = ['#2B59E0', '#2C6CE0', '#2A82D6', '#2196C8', '#17A2B4', '#14A0A6'];
  'DEFGHI'.split('').forEach((L, i) => {
    const x = 1270 + (i % 3) * 180, y = 270 + Math.floor(i / 3) * 180, k = eBack(p(u, .3 + i * .12, .55)); if (k <= 0) return;
    ctx.save(); ctx.translate(x + 75, y + 75); ctx.scale(k, k); ctx.rotate(nz(i, 4) * .06); card(-75, -75, 150, 150, { fill: cols[i], stroke: null, r: 20 });
    text(L, 0, 4, { size: 88, weight: 700, color: '#FFFFFF', align: 'center' }); ctx.restore();
  });
  text('Grades', 1270, 240, { size: 30, weight: 700, fam: HAND, color: K.muted, alpha: p(u, 1.2, .5) });
  enter(u, .4, () => text('JEI Math Grades D–I', 210, 330, { size: 60, weight: 600 }));
  hiLite(200, 416, measure('Improvement Plan', 100, 800) + 20, 76, p(u, 1.4, .7));
  enter(u, .6, () => text('Improvement Plan', 210, 452, { size: 100, weight: 800, color: K.blue }));
  enter(u, .9, () => text('U.S. Curriculum Alignment and Workbook Revision', 214, 548, { size: 34, weight: 500, color: K.muted }));
  text('In this video', 210, 668, { size: 34, weight: 700, fam: HAND, color: K.red, alpha: p(u, c.agenda1 - .7, .5) });
  ['Three key directions for improvement', 'Detailed changes for each grade', 'How supplementary materials will be used'].forEach((s, i) => {
    const t0 = c['agenda' + (i + 1)], y = 740 + i * 82;
    enter(u, t0, () => { hbox(214, y - 22, 44, 44, 1, K.ink, 3, 10 + i); text(s, 290, y, { size: 38, weight: 600 }); });
    check(238, y - 2, 46, p(u, t0 + .25, .35), K.red, 6);
  });
};

// 2. priority — members by grade, D–I ≈ 80 %, then the two goals
S.priority = (u, c) => {
  header(u, 'BACKGROUND', 'Why Grades D–I come first');
  const Hs = [7, 12, 28, 120, 155, 209, 180, 137, 121, 112, 76, 24], base = 860, x0 = 250, step = 76, bw = 52, hl = eOut(p(u, c.highlight, .6));
  Hs.forEach((h, i) => {
    const k = eOut(p(u, .5 + i * .05, .7)), x = x0 + i * step, hh = h * 1.9 * k, inD = i >= 3 && i <= 8;
    const col = inD ? (hl > 0 ? K.blue : '#AEBBD0') : '#AEBBD0';
    rr(x, base - hh, bw, hh, [6, 6, 0, 0], col, null, 0, inD ? 1 : lerp(1, .55, hl));
    text('ABCDEFGHIJKL'[i], x + bw / 2, base + 30, { size: 26, weight: inD && hl > 0 ? 700 : 500, color: inD && hl > 0 ? K.blue : K.muted, align: 'center', alpha: k });
  });
  line0(x0 - 20, base, x0 + 12 * step, base);
  text('Members by grade', x0, 940, { size: 28, weight: 700, fam: HAND, color: K.muted, alpha: p(u, 1, .5) });
  // bracket over D–I and the share
  const bx1 = x0 + 3 * step, bx2 = x0 + 8 * step + bw, by = 440;
  strokePts([[bx1, by + 14], [bx1, by], [bx2, by], [bx2, by + 14]], p(u, c.highlight + .1, .5), K.red, 4);
  const n = Math.round(80 * eOut(p(u, c.highlight + .2, 1.1)));
  text(`≈ ${n}%`, (bx1 + bx2) / 2, 352, { size: 84, weight: 800, color: K.red, align: 'center', alpha: p(u, c.highlight + .2, .3) });
  text('of total members', (bx1 + bx2) / 2, 410, { size: 26, weight: 600, color: K.ink, align: 'center', alpha: p(u, c.highlight + .5, .4) });
  // right: top priority + goals
  enter(u, c.shift, () => {
    card(1290, 290, 510, 600);
    chip('TOP PRIORITY', 1330, 340, { size: 18, fill: K.red, spacing: 2 });
    text('Grades D–I', 1330, 410, { size: 58, weight: 700 });
    para('Chosen first, building on JEI’s unique and systematic learning structure', 1330, 470, 430, 34, { size: 24, weight: 500, color: K.muted });
    line0(1330, 560, 1760, 560, K.line);
    text('Goals', 1330, 600, { size: 30, weight: 700, fam: HAND, color: K.red });
  });
  [['Stronger alignment with the CCSS', 'Common Core State Standards', c.prio1], ['Optimized learner experience', 'for every learner in D–I', c.prio2]].forEach(([a, b, t0], i) => {
    const y = 680 + i * 110;
    enter(u, t0, () => { hbox(1330, y - 22, 40, 40, 1, K.ink, 3, 20 + i); text(a, 1392, y - 6, { size: 30, weight: 700, maxW: 380 }); text(b, 1392, y + 28, { size: 21, weight: 500, color: K.muted }); });
    check(1352, y - 4, 42, p(u, t0 + .3, .35), K.green, 6);
  });
};
function line0(x1, y1, x2, y2, c = K.ink, lw = 3) { ctx.save(); ctx.strokeStyle = c; ctx.lineWidth = lw; ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke(); ctx.restore(); }

// 3. roadmap — JEI's small-step staircase; the CCSS progression does not always line up
S.roadmap = (u, c) => {
  header(u, 'DIRECTION 1  ·  CCSS ALIGNMENT', 'Stronger incorporation of the CCSS');
  text('1', 1800, 150, { size: 170, weight: 800, color: rgba(K.blue, .12), align: 'right', alpha: p(u, .3, .6) });
  text('JEI’s Small Step Learning Road Map', 260, 320, { size: 36, weight: 700, fam: HAND, color: K.blue, alpha: p(u, c.roadmapLabel, .5) });
  const steps = [['Concept Introduction', 'Understand the concept'], ['Step-by-Step Learning', 'Build skills in small steps'], ['Practice & Reinforce', 'Apply and solidify'], ['Advanced & Connected', 'Link to higher-level learning']];
  const base = 900, sw = 350, rise = 130;
  steps.forEach(([a, b], i) => {
    const k = eOut(p(u, c.roadmapLabel + .4 + i * .45, .7)); if (k <= 0) return;
    const x = 260 + i * sw, top = base - (i + 1) * rise, hh = (base - top) * k;
    rr(x, base - hh, sw - 8, hh, [10, 10, 0, 0], rgba(K.blue, .10 + i * .07), null);
    pen(x, top, x + sw - 8, top, k, K.blue, 5, 30 + i);
    text(a, x + 22, top + 42, { size: 28, weight: 700, color: K.ink, alpha: clamp(k * 2 - 1), maxW: sw - 44 });
    text(b, x + 22, top + 80, { size: 22, weight: 500, color: K.muted, alpha: clamp(k * 2 - 1), maxW: sw - 44 });
  });
  // CCSS progression (red, dashed) with mismatch marks
  const cc = [[260, 735], [500, 735], [530, 600], [880, 600], [910, 470], [1230, 470], [1260, 340], [1660, 340]];

// ============================================================
// compositor: slide between pages, then hold still
// ============================================================
const TR = .9;
function frame(i, t, ox) {
  if (Math.abs(ox) >= W) return; const s = SC[i];
  ctx.save(); ctx.translate(Math.round(ox), 0); pageFurniture(i); S[s.id](t - s.start, s.cues); ctx.restore();
}
function draw(t) {
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1;
  let i = SC.findIndex(s => t < s.end); if (i < 0) i = SC.length - 1;
  const k = i > 0 ? eIO(p(t, SC[i].start, TR)) : 1;
  paper(i > 0 ? Math.round((i - 1 + k) * W) : 0);
  if (k < 1) frame(i - 1, t, -k * W);
  frame(i, t, (1 - k) * W);
}

});
